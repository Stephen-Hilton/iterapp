           <div class="why" style="margin-top:4px">${why}</div></div></div>`
      : `<div class="setrow"><label>${key}</label><input type="text" data-ps="${key}" value="${esc(value)}"><span class="why">${why}</span></div>`;
  };
  const row = (item) => item.src === 'cfg' ? cfgRow(item) : psRow(item);
  const legend = `<div class="sub" style="border:1px solid var(--border);border-radius:7px;padding:10px 12px;line-height:1.7">
      <b>How iter files work:</b> any file matching <span class="mono">marker_glob</span> is iterapp-meaningful;
      its <b>FILENAME declares its role</b> — the word right before <span class="mono">.iter.md</span> (any prefix allowed, e.g.
      <span class="mono">gateway.marker.iter.md</span>):
      <span class="mono">*marker.iter.md</span> → a node on the Projects map (frontmatter <span class="mono">level:</span> says which C4 level) ·
      <span class="mono">*interface.iter.md</span> → a globally-aggregated interface contract ·
      <span class="mono">*usecase.iter.md</span> → a use-case thread ·
      <span class="mono">*testgroup.iter.md</span> → test definitions (owned via the marker's <span class="mono">testgroup:</span> key) ·
      <span class="mono">*bizreq.iter.md</span> / <span class="mono">*techreq.iter.md</span> → requirement docs ·
      any other name → a plain context doc. Stray frontmatter never changes a file's role — renaming the file is the only way.<br>
      <b>Placeholders in default_context:</b>
      <span class="mono">{marker}</span> = the clicked node’s own .iter.md file ·
      <span class="mono">{ancestor_markers}</span> = markers of that node’s parent chain up to the project root ·
      <span class="mono">{interfaces}</span> = the contract files for everything in the node’s uses:/provides: ·
      <span class="mono">{codepath}</span> = the node’s directory (anchors a glob to the work item’s own tree) ·
      <span class="mono">{reqs}</span> = the project-wide reqs dir — global bizreq/techreq home (default <span class="mono">.iter/reqs/</span>,
      relocated by a <span class="mono">reqs:</span> key on the project-level marker; its files are auto-surfaced to every agent).
    </div>`;
  const groupHtml = ([name, sub, items]) => `<div class="setgroup"><h3>${name}</h3><div class="sub">${sub}</div>
    ${name === 'Marker discovery' ? legend : ''}
    ${items.map(row).join('')}</div>`;
  const agentOptions = agents.map((a, i) =>
    `<option value="${esc(a.type)}"${i === 0 ? ' selected' : ''}>${esc(a.type)}</option>`).join('');
  const agentsGroup = `<div class="setgroup">
      <h3>Agents Settings</h3>
      <div class="sub">Per-agent settings and prompt — <span class="mono">.iter/agents/&lt;name&gt;.md</span>.

        Instructions for ALL agents live in <span class="mono">.iter/agents/_shared.md</span> (appended to every agent's context; edit on disk).</div>
      ${agents.length ? `
      <div class="setrow"><label>agent</label>

        <span class="why">which agent file to edit</span></div>

  const sectionHtml = ([title, subtitle, groups], extra = '') => `<div class="setsection">
    <h2 class="sethead">${title}<small>${subtitle}</small></h2>

  const layout = settingsLayout();
  $('view-settings').innerHTML = `<div class="setform">
    <div class="setsearch"><input type="search" id="setSearch"
      placeholder="Search settings — any part of a name, group, or description"
      autocomplete="off" spellcheck="false"></div>
    ${sectionHtml(layout[0], agentsGroup)}
    ${sectionHtml(layout[1])}
    <div class="setfoot">
      <button class="btn" id="cfgReload">Reload from disk</button>
      <button class="btn" id="cfgReset">Reset engine config to defaults</button>
      <button class="btn primary" id="cfgSave">Save All</button>
    </div>
  </div>`;
  wirePathHints('ps_scan_roots', 'ps_hint_scan_roots', null);
  wirePathHints('ps_default_context', 'ps_hint_default_context', null);
  $('setSearch').addEventListener('input', () => {
    const q = $('setSearch').value.trim().toLowerCase();
    document.querySelectorAll('#view-settings .setgroup').forEach(g => {
      const titleHit = q && g.querySelector('h3').textContent.toLowerCase().includes(q);
      let any = false;
      g.querySelectorAll('.setrow').forEach(r => {
        const hit = !q || titleHit || r.textContent.toLowerCase().includes(q);
        r.style.display = hit ? '' : 'none';
        if (hit) any = true;
      });
      g.style.display = (any || titleHit) ? '' : 'none';
    });
    document.querySelectorAll('#view-settings .setsection').forEach(sec => {
      const any = [...sec.querySelectorAll('.setgroup')].some(g => g.style.display !== 'none');
      sec.style.display = any ? '' : 'none';
    });
  });
  $('cfgSave').addEventListener('click', () => {
    const cfgOut = {};
    document.querySelectorAll('[data-cfg]').forEach(input => {
      const [section, key] = input.dataset.cfg.split('.');
      const raw = input.value.trim();
      (cfgOut[section] = cfgOut[section] || {})[key] =
        input.dataset.bool === 'true' ? raw === 'true'
        : input.dataset.num === 'true' ? (Number(raw) || 0) : raw;
    });
    const psOut = {};
    document.querySelectorAll('[data-ps]').forEach(el => {
      const k = el.dataset.ps;
      psOut[k] = PS_MULTILINE.includes(k)
        ? el.value.split('\n').map(x => x.trim()).filter(Boolean)
        : el.value.trim();
    });
    const applyTz = () => {
      USER_TZ = (cfgOut.globalsettings && cfgOut.globalsettings.user_timezone) || 'UTC';
      render();
    };
    if (!LIVE) { applyTz(); toast('config.json + projects.json saved (mock) — engine applies config on its next tick'); return; }
    Promise.all([
      api('/api/config', { method: 'PUT', body: JSON.stringify(cfgOut) }),
      api('/api/projectsettings', { method: 'PUT', body: JSON.stringify(psOut) }),
    ]).then(() => {
        applyTz();
        projLoaded = false;
        toast('Saved — engine applies config on its next tick; rescan applies new globs');
      })
      .catch(e => toast('Save failed: ' + e.message));
  });
  $('cfgReload').addEventListener('click', () => { renderSettings(); toast('Reloaded from disk'); });
  $('cfgReset').addEventListener('click', () => {
    if (LIVE) {
      const defaults = {};
      for (const [section, obj] of Object.entries(CONFIG)) {
        for (const [k, [v]] of Object.entries(obj)) (defaults[section] = defaults[section] || {})[k] = v;
      }
      api('/api/config', { method: 'PUT', body: JSON.stringify(defaults) })
        .then(() => { toast('Engine config reset to defaults and saved — projects.json untouched'); USER_TZ = 'UTC'; render(); renderSettings(); })
        .catch(e => toast('Reset failed: ' + e.message));
      return;
    }
    renderSettings();
    toast('Reset to defaults (unsaved)');
  });
  if (agents.length) {
    $('agSel').addEventListener('change', () => {
      const picked = agents.find(a => a.type === $('agSel').value) || agents[0];
      $('agFields').innerHTML = agentFieldsHtml(picked);
    });
    $('agSave').addEventListener('click', () => {
      const name = $('agSel').value;
      if (!LIVE) { toast(`agents/${name}.md saved (mock) — engine reloads it on its next tick`); return; }
      const out = {};
      document.querySelectorAll('[data-ag]').forEach(el => {
        const k = el.dataset.ag;
        if (k === 'body') out[k] = el.value;
        else if (k === 'visible') out[k] = el.value === 'true';
        else if (el.dataset.num === 'true') out[k] = Number(el.value.trim()) || 0;
        else out[k] = el.value.trim();
      });
      api('/api/agents/' + encodeURIComponent(name), { method: 'PUT', body: JSON.stringify(out) })
        .then(saved => {
          Object.assign(agents.find(a => a.type === name) || {}, saved);
          toast(`agents/${name}.md saved — engine reloads it on its next tick`);
        })
        .catch(e => toast('Save failed: ' + e.message));
    });
    $('agReset').addEventListener('click', () => { renderSettings(); toast('Reloaded from disk'); });
  }
}

let projUC = -1;          // -1 = no use-case filter
let projIface = '';       // '' = no interface thread; else an interface id
let openIface = -1;       // index into INTERFACES of the expanded contract row
let openUC = -1;          // index into USECASES of the expanded use-case row
let projOrder = 'hierarchy';
let projDepth = null;     // null = all levels; else index into LEVELS
let openMarker = null;
let projLoaded = !LIVE;

async function loadProjects(){
  if (!LIVE) return;
  const scan = await api('/api/markers');
  MARKERS = scan.nodes.map(n => ({
    key: n.key, level: n.level || 'node', name: n.name, desc: n.description,
    uses: n.uses || [], provides: n.provides || [], depth: n.depth,
    dir: n.dir, path: n.path, body: n.body || '',
    testgroup: n.testgroup || '', test_dir: n.test_dir || '',
    bizreq: n.bizreq || '', techreq: n.techreq || '',
  }));
  USECASES = scan.usecases.map(u => ({ name: u.name, desc: u.description, file: u.file, steps: u.steps,
    participants: u.participants || [], body: u.body || '' }));
  INTERFACES = scan.interfaces.map(i => ({ id: i.id, kind: i.kind, endpoint: i.endpoint, description: i.description, file: i.file, body: i.body || '' }));
  projLoaded = true;
  return scan;
}

function ifaceTouches(m, id){
  return (m.uses || []).includes(id) || (m.provides || []).includes(id);
}

function orderedMarkers(){
  const list = MARKERS.slice();
  if (projOrder === 'level') list.sort((a,b) => LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level) || a.name.localeCompare(b.name));
  if (projOrder === 'name') list.sort((a,b) => a.name.localeCompare(b.name));
  return list;
}

async function renderProjects(){
  if (LIVE && !projLoaded) {
    try { await loadProjects(); } catch (e) {
      $('view-projects').innerHTML = `<div class="empty">API error: ${esc(e.message)}</div>`;
      return;
    }
  }
  if (projUC >= USECASES.length) projUC = -1;   // CRUD can shrink the list
  if (openUC >= USECASES.length) openUC = -1;
  const uc = projUC >= 0 ? USECASES[projUC] : null;
  const counts = LEVELS.map(l => MARKERS.filter(m => m.level === l).length);
  const threaded = uc || projIface;
  const rows = orderedMarkers()
    .filter(m => projDepth === null || LEVELS.indexOf(m.level) <= projDepth)
    .map(m => {
      const step = uc ? uc.steps[m.key]
        : (projIface && ifaceTouches(m, projIface)
            ? (m.provides.includes(projIface) ? 'prov' : 'uses') : '');
      const dim = threaded && !step;
      const indent = projOrder === 'hierarchy' ? m.depth * 22 : 0;
      const open = openMarker === m.key;
      const ifaceOf = (u) => INTERFACES.some(i => i.id === u);
      return `
      <div class="prow ${dim?'dimmed':''} ${step?'participant':''}" data-marker="${esc(m.key)}"
           role="button" tabindex="0" style="padding-left:${8+indent}px">
        <span class="lvltag" style="background:var(--lvl-${m.level}-bg, var(--surface2));color:var(--lvl-${m.level}-fg, var(--text))">${esc(m.level)}</span>

        <span class="pdesc">${esc(m.desc)}</span>
        <span class="uses">
          ${m.provides.map(u => `<span class="useb prov ${ifaceOf(u)?'linked':''}" title="provides interface">▲ ${esc(u)}</span>`).join('')}
          ${m.uses.map(u => `<span class="useb ${ifaceOf(u)?'linked':''}" title="${ifaceOf(u)?'uses declared interface':'uses (no interface declared)'}">${esc(u)}</span>`).join('')}
        </span>
        ${step ? `<span class="step">${esc(step)}</span>` : ''}
      </div>
      ${open ? `<div class="pdetail">
        ${c4DetailRows(m)}
        <div class="dlabel">Use-cases</div><div>${USECASES.filter(u=>u.steps[m.key]).map(u=>`${esc(u.name)} <b class="mono">(${u.steps[m.key]})</b>`).join('<br>') || '<span style="color:var(--text-dim)">not a participant</span>'}</div>

        </div>
      </div>` : ''}`;
    }).join('');

  // Interfaces: global aggregation, duplicate ids flagged for rationalization.
  const idCounts = {};
  INTERFACES.forEach(i => { idCounts[i.id] = (idCounts[i.id] || 0) + 1; });
  const ifaceRows = INTERFACES.map((i, idx) => {
    const providers = MARKERS.filter(m => m.provides.includes(i.id));

    const open = openIface === idx;
    return `<div class="prow ${on?'participant':''}" data-ifacerow="${idx}" role="button" tabindex="0"
        aria-expanded="${open}" title="Click to open the contract and thread providers/consumers in the tree">

      <span class="uses"><span class="useb prov">▲ ${providers.length}</span><span class="useb">${consumers.length} consumer${consumers.length===1?'':'s'}</span></span>
    </div>
    ${open ? `<div class="pdetail">
      <div class="dlabel">Kind</div><div><span class="kindchip k-${esc(i.kind || 'other')}">${esc(i.kind || '?')}</span>

      <div class="dlabel">Contract</div>
      <div class="textblock mono" style="max-height:60vh">${esc(i.body || '(no contract body in the marker yet — the file is frontmatter only)')}</div>
    </div>` : ''}`;
  }).join('');

  // Use-cases: participants: markers, threaded through the tree one-way — the
  // use-case names its nodes; nodes never mention use-cases. Full CRUD here.
  const ucRows = USECASES.map((u, idx) => {
    const on = projUC === idx;
    const open = openUC === idx;
    const plist = (u.participants || []).map(line => {
      const sp = line.trim().split(/\s+/);
      const step = sp[0] || '';
      const key = (sp.slice(1).join(' ') || '') === '.' ? '' : sp.slice(1).join(' ');
      const node = MARKERS.find(m => m.key === key);
      return `<div><b class="mono">${esc(step)}</b> ${node ? esc(node.name) : `<span class="mono">${esc(key || '(project root)')}</span>`}
        <span class="mono" style="color:var(--text-dim)">${node ? '· ' + esc(key || '(project root)') : key ? '— no node with this key' : ''}</span></div>`;
    }).join('');
    return `<div class="prow ${on?'participant':''}" data-ucrow="${idx}" role="button" tabindex="0"
        aria-expanded="${open}" title="Click to expand and thread this use-case's participants in the tree">
      <span class="chev">${open ? '▾' : '▸'}</span>

function markerAncestors(key){
  const out = [];
  let k = key;
  while (k) { k = k.includes('/') ? k.slice(0, k.lastIndexOf('/')) : ''; const a = MARKERS.find(m => m.key === k); if (a) out.push(a); }
  return out;
}

function projClick(e){
  const mk_ = e.target.closest('[data-mkworkitem]');
  if (mk_) {
    const m = MARKERS.find(x => x.key === mk_.dataset.mkworkitem);
    // Expand the default_context TEMPLATE from Project Settings — placeholders
    // resolve here; literal lines (and {codepath} lines) pass through for the engine.
    const ctx = [];
    for (const line of DEFAULT_CONTEXT) {
      if (line === '{marker}') ctx.push(m.path);
      else if (line === '{ancestor_markers}') markerAncestors(m.key).forEach(a => ctx.push(a.path));
      else if (line === '{interfaces}') INTERFACES
        .filter(i => m.uses.includes(i.id) || m.provides.includes(i.id))
        .forEach(i => ctx.push(i.file));
      else ctx.push(line);
    }
    openForm('create', mk({ codepath: m.dir, context: [...new Set(ctx)],
      testfiles: m.testgroup ? [`${m.dir}/${m.testgroup}`] : [], title: '', mainwork: '', source: 'user' }));
    return true;
  }
  const ifr = e.target.closest('[data-ifacerow]');
  if (ifr && !e.target.closest('.pdetail')) {
    const idx = +ifr.dataset.ifacerow;
    if (openIface === idx) {
      openIface = -1;
      projIface = '';
    } else {
      openIface = idx;
      projIface = INTERFACES[idx].id;
      projUC = -1; openUC = -1;
    }
    renderProjects();
    return true;
  }
  const ucnew = e.target.closest('[data-ucnew]');
  if (ucnew) { ucForm(-1); return true; }
  const uced = e.target.closest('[data-ucedit]');
  if (uced) { ucForm(+uced.dataset.ucedit); return true; }
  const ucdel = e.target.closest('[data-ucdel]');
  if (ucdel) { ucDelete(+ucdel.dataset.ucdel); return true; }
  const ucr = e.target.closest('[data-ucrow]');
  if (ucr && !e.target.closest('.pdetail')) {
    const idx = +ucr.dataset.ucrow;
    if (openUC === idx) {
      openUC = -1;
      projUC = -1;
    } else {
      openUC = idx;
      projUC = idx;                    // expanding also threads the red line
      projIface = ''; openIface = -1;
    }
    renderProjects();
    return true;
  }
  const vm = e.target.closest('[data-viewmarker]');
  if (vm) {
    const m = MARKERS.find(x => x.key === vm.dataset.viewmarker);
    if (m.body) {
      // LIVE (or any marker whose body we hold): show the real file content.
      const front = `---\nname: ${m.name}\nlevel: ${m.level}\ndescription: "${m.desc}"` +
        (m.provides.length ? `\nprovides: [${m.provides.join(', ')}]` : '') +
        (m.uses.length ? `\nuses: [${m.uses.join(', ')}]` : '') + '\n---\n\n';
      openLb('Marker — ' + m.path,
        `<div class="textblock mono" style="max-height:66vh">${esc(front + m.body)}</div>`);
      return true;
    }
    openLb('Marker — ' + m.path, `<div class="textblock mono" style="max-height:60vh">${esc(
`---
name: ${m.name}
level: ${m.level}
description: "${m.desc}"${m.uses.length ? `\nuses: [${m.uses.join(', ')}]` : ''}
---

# ${m.name}

${m.desc}.

## Requirements
- (the marker body IS the context handed to agents working under ${absCodepath(m.dir)})
- Interfaces, constraints, and conventions for this node live here, beside the code.

## Interfaces
- See parent context markers for shared contracts.`)}</div>`);
    return true;
  }
  const chip = e.target.closest('[data-depth]');
  if (chip) {
    const d = +chip.dataset.depth;
    projDepth = projDepth === d ? null : d;
    renderProjects();
    return true;
  }
  const row = e.target.closest('[data-marker]');
  if (row) {
    const key = row.dataset.marker;
    openMarker = openMarker === key ? null : key;
    renderProjects();
    return true;
  }
  return false;
}

/* Extract the "# Long Description" section from a marker body (any heading level
   1–3; ends at the next heading or EOF). */
function longDescOf(body){
  const m = (body || '').match(/(?:^|\n)#{1,3}\s*Long Description[^\n]*\n([\s\S]*?)(?=\n#{1,3}\s|$)/i);
  return m ? m[1].trim() : '';
}
function replaceLongDescSection(content, text){
  const re = /((?:^|\n)#{1,3}\s*Long Description[^\n]*\n)[\s\S]*?(?=\n#{1,3}\s|$)/i;
  if (re.test(content)) return content.replace(re, (_, head) => head + text + '\n');
  return content.trimEnd() + '\n\n# Long Description\n' + text + '\n';
}

/* uses/provides as two clickable listboxes: interfaces open their contract,
   C4 nodes open their detail — drill through dependencies infinitely, with a
   breadcrumb trail to walk back. */
function refBtn(name){
  const iface = INTERFACES.find(i => i.id === name);
  const node = !iface && MARKERS.find(x => x.key === name || x.name === name);
  if (iface) return `<button class="refbtn linked" data-refiface="${esc(name)}" title="interface — click for the contract">${esc(name)}</button>`;
  if (node) return `<button class="refbtn linked" data-refnode="${esc(node.key)}" title="C4 object — click for detail">${esc(name)}</button>`;
  return `<button class="refbtn plain" disabled title="no interface or C4 object declared with this id">${esc(name)}</button>`;
}
function upBoxesHtml(m){
  const none = '<span style="color:var(--text-dim);font-size:12px">—</span>';
  return `<div class="upgrid">
    <div class="upbox"><div class="uphead">uses</div>${(m.uses||[]).map(refBtn).join('') || none}</div>
    <div class="upbox"><div class="uphead">provides</div>${(m.provides||[]).map(refBtn).join('') || none}</div>
  </div>`;
}

let lbStack = [];   // [{label, title, build:()=>html, wire?:()=>void}]
function crumbsHtml(){
  if (lbStack.length < 2) return '';
  return `<div class="crumbs">${lbStack.map((s,i) => i === lbStack.length-1
    ? `<span class="chere">${esc(s.label)}</span>`
    : `<button data-crumb="${i}">${esc(s.label)}</button><span class="csep">›</span>`).join('')}</div>`;
}
function lbRenderTop(){
  const top = lbStack[lbStack.length-1];
  if (!top) return;
  openLb(top.title, crumbsHtml() + top.build(), top.foot);
  if (top.wire) top.wire();
}
function lbNav(entry){
  if ($('overlay').classList.contains('open') && lbStack.length) lbStack.push(entry);

  const nodeDir = tg.node ? absCodepath(tg.node.dir) : null;

  tg.sel = 0; tg.logOpen = null;
  await tgLoadRuns();
  lbNav({ label: 'Testing', title: 'Testing — ' + (tg.node ? tg.node.name : 'all testgroups'),
    build: tgBuild, wire: null });
}

async function tgLoadRuns(){
  const e = tgEntrySel();
  if (!e || tg.runs[e.test_dir]) return;
  try { tg.runs[e.test_dir] = (await api('/api/testruns', { method:'POST', body: JSON.stringify({ dir: e.test_dir }) })).runs || []; }
  catch (err) { tg.runs[e.test_dir] = []; }
}

function tgNotesHtml(){
  let out = '';
  for (const f of (tg.missing || [])) {
    out += `<p style="color:var(--s-failed-bg);font-size:12px;margin:8px 0 0">${esc(f.c4_name)}'s marker file declares
      <span class="mono">${esc(f.file)}</span> but the file does not exist — a testwriter item should create it.</p>`;
  }
  if (!tg.node && (tg.undeclared || []).length) {
    out += `<p style="color:var(--text-dim);font-size:12px;margin:8px 0 0">${tg.undeclared.length} C4 object(s) have no
      <span class="mono">testgroup:</span> key in their marker file — deliberately outside the sweep.</p>`;
  }
  if (!tg.node && (tg.orphans || []).length) {
    out += `<p style="color:var(--s-paused-bg);font-size:12px;margin:8px 0 0">Unowned (no marker file declares them):
      <span class="mono">${tg.orphans.map(esc).join(' · ')}</span></p>`;
  }
  return out;
}

function tgBuild(){
  if (!tg.entries.length) {
    return `<p style="color:var(--text-dim)">No declared testgroups found${tg.node ? ' for ' + esc(tg.node.name) : ''}.
      A C4 object's marker file names its testgroup.iter.md with a <span class="mono">testgroup:</span> frontmatter
      key — no key means deliberately untested. The plan agent writes the definitions; the testwriter registers the
      tests (and adds the key + file when missing).</p>` + tgNotesHtml();
  }
  const e = tgEntrySel();
  const left = tg.entries.map((g, i) => `
    <div class="tgrow ${i === tg.sel ? 'sel' : ''}" data-tgsel="${i}">
      <span class="tgdot" style="background:${tgResultColor(g.result)}"></span>
      <span>${esc(g.label)}</span><small>${esc(g.counts || '')}</small>
    </div>`).join('');
  const runs = (tg.runs[e.test_dir] || []).filter(r =>
    (e.testlist || []).some(t => r.name.endsWith('-' + tgSanitize(t.id) + '.log')));
  const openItem = items.find(i => i.source_testgroup === e.label && i.state !== 'complete');
  const tests = (e.testlist || []).map(t => `
    <tr><td class="mono"><b>${esc(t.id)}</b></td><td>${esc(t.name || '')}</td>
      <td style="color:var(--text-dim)">${esc(t.desc || '')}</td><td class="mono">${esc(t.shell)}</td></tr>`).join('');
  const runRows = runs.slice(0, 40).map(r => `
    <tr class="runrow" data-runlog="${esc(r.path)}" title="Click to view the captured output">
      <td class="mono">${esc(r.name)}</td><td class="mono">${(r.size/1024).toFixed(1)} KB</td></tr>`).join('');
  return `<div class="tgwrap">
    <div class="tglist">${left}</div>
    <div>
      <p style="margin:0 0 6px">
        <span class="chip" style="background:${tgResultColor(e.result)};color:#fff">${esc(e.result || 'never run')}</span>
        <span class="chip kv mono">${esc(e.counts || '–')}</span>
        <span class="chip meta mono">last run: <b>${e.lastrun ? esc(fmtTs(e.lastrun)) : '—'}</b></span>
        ${openItem ? `<span class="chip" style="background:var(--s-todo-bg);color:#fff" title="An open work item exists for this group (dedup guard active)">fix item: ${esc(openItem.state)} · ${esc(shortId(openItem))}</span>` : ''}
      </p>
      <p style="margin:0 0 10px;color:var(--text-dim);font-size:12.5px">${esc(e.desc || '(no group description — add "desc" in the testgroups block)')}</p>
      <label class="autofix" title="OFF: a red run births a fix work item in todo, for your review. ON: it lands queued and an agent is dispatched automatically.">
        <input type="checkbox" data-autofix ${e.auto_fix ? 'checked' : ''}> auto-fix
        <span style="font-weight:500;color:var(--text-dim)">red run → fix item ${e.auto_fix ? 'QUEUED (auto-dispatch)' : 'in TODO (human review)'}</span>
      </label>
      <h4 style="margin:14px 0 4px">Tests (${(e.testlist||[]).length})</h4>
      ${tests ? `<table class="t"><thead><tr><th>id</th><th>name</th><th>what it proves</th><th>script</th></tr></thead><tbody>${tests}</tbody></table>`
        : '<p style="color:var(--text-dim);font-size:12.5px;margin:4px 0">No tests registered yet — a testwriter item fills the testlist.</p>'}
      <h4 style="margin:14px 0 4px">Run history <span style="color:var(--text-dim);font-weight:500;font-size:11.5px">· ${esc(e.test_dir)}/runs/ · newest first</span></h4>
      ${runRows ? `<table class="t"><tbody>${runRows}</tbody></table>` : '<p style="color:var(--text-dim);font-size:12.5px;margin:4px 0">No recorded runs yet — the sweep and <span class="mono">iter runtests</span> write one log per test per run.</p>'}
      ${tgNotesHtml()}
    </div></div>`;
}

async function tgToggleAutofix(checked){
  const e = tgEntrySel();
  if (!e) return;
  try {
    await api('/api/testgroups/autofix', { method:'POST', body: JSON.stringify({ path: e.file, label: e.label, auto_fix: checked }) });
    e.auto_fix = checked;
    toast(`auto-fix ${checked ? 'ON — red runs dispatch a fix agent automatically' : 'OFF — red runs wait in todo for review'}`);
    lbRenderTop();
  } catch (err) { toast('auto-fix: ' + err.message); lbRenderTop(); }
}

async function openRunLog(path){
  try {
    const f = await api('/api/file/read', { method:'POST', body: JSON.stringify({ path }) });
    lbNav({ label: path.split('/').pop(), title: 'Test Run — ' + path.split('/').pop(),
      build: () => `<p class="mono" style="color:var(--text-dim);font-size:11.5px;margin:0 0 8px">${esc(path)}</p>
        <div class="textblock mono" style="max-height:60vh">${esc(f.content)}</div>` });
  } catch (e) { toast('Log: ' + e.message); }
}

/* delegated clicks for all the drill-down machinery (works inside lightboxes) */
document.addEventListener('click', (e) => {
  const crumb = e.target.closest('[data-crumb]');
  if (crumb) { lbStack = lbStack.slice(0, +crumb.dataset.crumb + 1); lbRenderTop(); return; }
  const rn = e.target.closest('[data-refnode]');
  if (rn) { navNode(rn.dataset.refnode); return; }
  const ri = e.target.closest('[data-refiface]');
  if (ri) { navIface(ri.dataset.refiface); return; }
  const el = e.target.closest('[data-editlong]');
  if (el) { editLongDesc(el.dataset.editlong); return; }
  const rq = e.target.closest('[data-reqlb]');
  if (rq) { reqLb(rq.dataset.node, rq.dataset.reqlb); return; }
  const tl = e.target.closest('[data-testlb]');
  if (tl) { testingLb(tl.dataset.node ?? null); return; }
  const ts = e.target.closest('[data-tgsel]');
  if (ts) { tg.sel = +ts.dataset.tgsel; tgLoadRuns().then(lbRenderTop); return; }
  const af = e.target.closest('[data-autofix]');
  if (af) { tgToggleAutofix(af.checked); return; }
  const rl = e.target.closest('[data-runlog]');
  if (rl) { openRunLog(rl.dataset.runlog); return; }
});

};
const PS_MULTILINE = ['scan_roots', 'default_context'];
if (!LIVE) DEFAULT_CONTEXT = PROJSET.default_context[0].split('\n');

/* -------------------------------------------------- multi-server identity */
/* In the wired version: url_slug + project_name from /api/projectsettings, the
   server list from /api/servers (backed by ~/.iterapp/servers.json, pid-checked). */
const SLUG = 'pdy-dev';
const SERVERS = [
  { name:'Paydaay Core Product', slug:'pdy-dev', port:9741, current:true },
  { name:'greet (sample)',       slug:'greet',   port:9812 },
  { name:'paydaay-notify',       slug:'notify',  port:9733 },
];

function slugColor(slug){
  let h = 0;
  for (const c of slug) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360}, 62%, 42%)`;
}

/* favicon: an SVG dot tinted by slug hash, carrying the slug's initial —
   with ten tabs open, color beats text */
let faviconLink = null;
function setFavicon(slug){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="7" fill="${slugColor(slug)}"/>
    <text x="8" y="11.6" font-size="9.5" text-anchor="middle" fill="#fff"
      font-family="sans-serif" font-weight="700">${(slug[0] || 'i').toUpperCase()}</text></svg>`;
  if (!faviconLink) {
    faviconLink = document.createElement('link');
    faviconLink.rel = 'icon';
    document.head.appendChild(faviconLink);
  }
  faviconLink.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
}
setFavicon(SLUG);

let servers = SERVERS;

async function renderServers(){
  if (LIVE) {
    try {
      const rows = await api('/api/servers');
      servers = rows.map(r => ({
        name: r.project_name, slug: r.url_slug, port: r.port,
        current: String(r.port) === location.port,
      }));
    } catch (e) { servers = []; }
  }
  $('serverSwitch').innerHTML = servers.map(s => `
    <a href="#" class="srv ${s.current ? 'here' : ''}" data-server="${esc(s.slug)}"
       title="http://${esc(s.slug)}.localhost:${s.port}/">
      <span class="dot" style="background:${slugColor(s.slug)}"></span>
      ${esc(s.slug)}
      <small>:${s.port}</small></a>`).join('')
    || '<span style="color:var(--text-dim);font-size:11.5px;padding:2px 9px">only this one</span>';
}

$('serverSwitch').addEventListener('click', (e) => {
  const a = e.target.closest('[data-server]');
  if (!a) return;
  e.preventDefault();
  const s = servers.find(x => x.slug === a.dataset.server);
  if (!s || s.current) { toast('This server'); return; }
  if (LIVE) window.open(`http://localhost:${s.port}/`, '_blank');
  else toast(`(mock) would open http://${s.slug}.localhost:${s.port}/`);
});

render();
navTo(location.hash.replace(/^#\//,'') || 'workitems');
renderServers();
if (LIVE) {
  loadAll().then(refreshEngine);
  setInterval(refreshEngine, 5000);
  const es = new EventSource('/api/events');
  let debounce;
  es.onmessage = () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      loadAll().then(refreshEngine);
      if (document.getElementById('view-dashboard').classList.contains('active')) renderDashboard();
    }, 250);
  };
}
