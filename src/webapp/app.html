<title>pdy-dev · IterLoop</title>
<style>
  :root {
    --bg: #f2f4f7;
    --surface: #ffffff;
    --surface2: #eaedf2;
    --border: #d4d9e1;
    --text: #191d24;
    --text-dim: #5b6472;
    --accent: #4557d0;
    --accent-fg: #ffffff;
    --shadow: 0 8px 28px rgba(20, 26, 40, 0.16);
    --row-shadow: 0 1px 2px rgba(20, 26, 40, 0.07);

    --s-total-bg: #1b3358;   --s-total-fg: #ffffff; /* dark navy — distinct from Scheduled's purple */
    --s-complete-bg: #1a9a4a; --s-complete-fg: #ffffff;
    --s-progress-bg: #e8a71c; --s-progress-fg: #241a02;
    --s-queued-bg: #2f7fd6;  --s-queued-fg: #ffffff;
    --s-scheduled-bg: #7c4dbc; --s-scheduled-fg: #ffffff;
    --s-todo-bg: #d4589e;    --s-todo-fg: #ffffff;
    --s-question-bg: #0d8f9e; --s-question-fg: #ffffff; /* teal — blocked on a human answer */
    --s-failed-bg: #d43a3a;  --s-failed-fg: #ffffff;
    --s-paused-bg: #e07020;  --s-paused-fg: #ffffff;

    --pill-on-bg: #4557d0;   --pill-on-fg: #ffffff;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161b;
      --surface: #1d2027;
      --surface2: #262a33;
      --border: #363c48;
      --text: #e8eaef;
      --text-dim: #98a0ae;
      --accent: #7986e8;
      --accent-fg: #10121a;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      --row-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      --s-progress-bg: #d99a15; --s-progress-fg: #1c1400;
      --pill-on-bg: #6474e8; --pill-on-fg: #0e1118;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161b;
    --surface: #1d2027;
    --surface2: #262a33;
    --border: #363c48;
    --text: #e8eaef;
    --text-dim: #98a0ae;
    --accent: #7986e8;
    --accent-fg: #10121a;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    --row-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    --s-progress-bg: #d99a15; --s-progress-fg: #1c1400;
    --pill-on-bg: #6474e8; --pill-on-fg: #0e1118;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .app { display: grid; grid-template-columns: 190px 1fr; min-height: 100vh; }

  /* ---------- sidebar ---------- */
  .side {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 18px 14px;
  }
  .side h1 { font-size: 17px; margin: 0 0 6px; letter-spacing: 0.2px; }
  .side h1 .loop { color: var(--accent); }
  .projbrand { display: grid; gap: 1px; margin: 0 0 18px; }
  .projbrand b { font-size: 12px; }
  .projbrand span { font-size: 10.5px; color: var(--text-dim); font-family: var(--mono); }
  .nav .srv { display: flex; align-items: center; gap: 7px; }
  .nav .srv .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .nav .srv small { color: var(--text-dim); font-family: var(--mono); font-size: 10px; margin-left: auto; }
  .navgroup { margin-bottom: 22px; }
  .navgroup .navhead {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px;
  }
  .nav a {
    display: block; padding: 5px 9px; border-radius: 6px;
    color: var(--text-dim); text-decoration: none; margin-bottom: 1px;
  }
  .nav a:hover { background: var(--surface2); color: var(--text); }
  .nav a.here { background: var(--surface2); color: var(--text); font-weight: 600; }
  /* child row under a server entry (its per-server Settings page) */
  .nav a.srvchild {
    margin-left: 19px; padding: 3.5px 9px; font-size: 12px;
    border-left: 2px solid var(--border); border-radius: 0 6px 6px 0;
  }

  /* ---------- main ---------- */
  .main { padding: 16px 22px 60px; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .topbar h2 { font-size: 18px; margin: 0; flex: 1; }
  .enginechip {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); background: var(--surface);
    border-radius: 999px; padding: 5px 14px 5px 10px; font-weight: 600;
  }
  .enginechip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .enginechip[data-engine="running"] .dot { background: var(--s-complete-bg); box-shadow: 0 0 0 3px rgba(26,154,74,.22); }
  .enginechip[data-engine="paused"]  .dot { background: var(--s-paused-bg);  box-shadow: 0 0 0 3px rgba(224,112,32,.25); }
  .enginechip[data-engine="stopped"] .dot { background: var(--s-failed-bg);  box-shadow: 0 0 0 3px rgba(212,58,58,.25); }
  .enginechip .lbl { color: var(--text-dim); font-weight: 500; }

  /* ---------- summary strip ---------- */
  /* All nine chips on ONE row while the window is wide enough to hold them at
     full size (the count comes from the STATES table — renderSummary sets
     --sumcols). Below that the bar drops to a balanced 5+4 rather than
     squeezing labels to nothing; narrower still, the mobile rule takes over.
     minmax(0,1fr) keeps a long label from forcing its column wider. */
  .summary { display: grid; grid-template-columns: repeat(var(--sumcols, 9), minmax(0, 1fr)); gap: 8px; }
  .sumbtn {
    border: none; border-radius: 9px; padding: 9px 6px 7px;
    display: grid; justify-items: center; gap: 1px; min-width: 0;
    box-shadow: var(--row-shadow);
    transition: transform 60ms ease, filter 120ms ease, opacity 120ms ease;
  }
  .sumbtn .n { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .sumbtn .t {
    font-size: 11.5px; font-weight: 600; opacity: 0.92;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .sumbtn:hover { filter: brightness(1.06); }
  .sumbtn:active { transform: translateY(1px); }
  .summary.filtered .sumbtn:not(.on):not(.total) { opacity: 0.42; }
  .sumbtn.on { box-shadow: inset 0 0 0 3px rgba(255,255,255,0.85), 0 0 0 2px var(--text); }

  .toolrow { display: flex; justify-content: flex-end; gap: 8px; margin: 12px 0; align-items: center; }
  .toolrow .hint { margin-right: auto; color: var(--text-dim); font-size: 12.5px; }
  .sortlbl { display: inline-flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12.5px; font-weight: 600; }
  .sortlbl select {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 6px 8px; font: inherit; font-weight: 600;
  }
  .pathhint { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); margin-top: 5px; }
  .btn {
    border: 1px solid var(--border); background: var(--surface);
    border-radius: 7px; padding: 6px 14px; font-weight: 600;
  }
  .btn:hover { background: var(--surface2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger { color: var(--s-failed-bg); border-color: var(--s-failed-bg); }

  /* ---------- work item rows ---------- */
  .rows { display: grid; gap: 7px; }
  .item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; box-shadow: var(--row-shadow); overflow: visible;
  }
  .rowhead {
    display: grid; grid-template-columns: 46px 1fr auto; align-items: stretch;
    cursor: pointer; border-radius: 9px;
  }
  .item.open .rowhead { border-radius: 9px 9px 0 0; }
  .rowhead:hover { background: color-mix(in srgb, var(--surface2) 55%, var(--surface)); }
  .stateicon {
    display: grid; place-items: center; font-size: 21px; font-weight: 700;
    border-radius: 8px 0 0 8px; color: #fff;
  }
  .item.open .stateicon { border-radius: 8px 0 0 0; }
  .rowmid { padding: 7px 12px 7px 12px; min-width: 0; }
  .title {
    font-weight: 650; font-size: 13.5px; color: var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; align-items: center; }
  .chip {
    font-size: 11px; font-weight: 700; padding: 1.5px 8px; border-radius: 5px;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .chip.neutral { background: var(--surface2); color: var(--text); border: 1px solid var(--border); font-weight: 600; }
  .chip.kv { background: var(--surface2); border: 1px solid var(--border); }
  .chip.meta { background: none; border: none; color: var(--text-dim); font-weight: 500; padding: 1.5px 2px; }
  .chip.meta b { color: var(--text); font-weight: 600; }
  .chip.mono { font-family: var(--mono); font-weight: 500; }
  .actwrap { position: relative; display: grid; align-items: center; padding: 0 10px; }
  .actbtn {
    background: var(--accent); color: var(--accent-fg); border: none;
    border-radius: 7px; padding: 7px 12px; font-weight: 700; font-size: 12.5px;
  }
  .actmenu {
    position: absolute; right: 8px; top: calc(100% - 6px); z-index: 30;
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    box-shadow: var(--shadow); min-width: 210px; padding: 5px; display: none;
  }
  .actmenu.open { display: block; }
  .actmenu button {
    display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 7px 10px; border-radius: 6px; font-weight: 550;
  }
  .actmenu button:hover { background: var(--surface2); }
  .actmenu button.danger { color: var(--s-failed-bg); }
  .actmenu .sep { height: 1px; background: var(--border); margin: 4px 6px; }

  /* ---------- slide-down detail ---------- */
  .detailwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 200ms ease; }
  .item.open .detailwrap { grid-template-rows: 1fr; }
  @media (prefers-reduced-motion: reduce) { .detailwrap { transition: none; } }
  .detail { overflow: hidden; }
  .detail-inner {
    border-top: 1px solid var(--border); padding: 14px 16px 16px;
    display: grid; grid-template-columns: 92px 1fr; gap: 10px 14px; align-items: start;
  }
  .dlabel { color: var(--text-dim); font-size: 12px; font-weight: 650; padding-top: 4px; }
  .dvalrow { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .codepath {
    font-family: var(--mono); font-size: 12.5px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; flex: 1; min-width: 200px;
  }
  .fullid { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 3px 11px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
  }
  .pill.on { background: var(--pill-on-bg); border-color: var(--pill-on-bg); color: var(--pill-on-fg); }
  .pill.inline-lit { border-style: dashed; font-style: italic; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill.toggle:hover { border-color: var(--accent); color: var(--text); }
  .pill.toggle.on:hover { filter: brightness(1.1); color: var(--pill-on-fg); }
  .textblock {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 12px; font-size: 12.5px; max-height: 60vh; overflow: auto; white-space: pre-wrap;
  }
  .textblock.mono { font-family: var(--mono); font-size: 12px; }
  /* A question is aimed at a person, so it reads like a note, not like data:
     a teal left rule and a slightly larger line height set it apart from the
     request/output blocks around it. The answer echoes it in green. */
  .textblock.question { border-left: 4px solid var(--s-question-bg); line-height: 1.55; }
  .textblock.answer   { border-left: 4px solid var(--s-complete-bg); line-height: 1.55; }
  /* The Answer block holds prose, so it keeps a three-line floor whether it is
     filled or still empty: a one-line box reads as a label rather than a place
     an answer goes, and the panel stops jumping when one is written. */
  .textblock.answer, .textblock.unanswered { min-height: calc(3 * 1.55em + 20px); }
  .textblock.unanswered { color: var(--text-dim); font-style: italic; line-height: 1.55; }
  /* The answer is typed where it is read — in the row itself, no lightbox hop.
     Same box as .textblock.answer so an editable answer and a recorded one look
     like the same thing, because they are. */
  .answerbox {
    width: 100%; background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-left: 4px solid var(--s-complete-bg);
    border-radius: 7px; padding: 9px 12px; font: inherit; font-size: 12.5px;
    line-height: 1.55; resize: vertical; min-height: calc(3 * 1.55em + 20px);
  }
  .answerbox:focus { outline: none; border-color: var(--accent); border-left-color: var(--s-complete-bg); }
  .answerrow { display: flex; gap: 12px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .answerstat { color: var(--text-dim); font-size: 12px; }
  .answerstat.dirty { color: var(--s-question-bg); font-weight: 650; }
  .detailbtns { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- lightbox ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(12, 15, 22, 0.55); z-index: 100;
    display: none; align-items: flex-start; justify-content: center; padding: 5vh 16px;
  }
  .overlay.open { display: flex; }
  .lightbox {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    /* Wide enough that the ~90-char mono lines agents write don't soft-wrap. */
    box-shadow: var(--shadow); width: min(1000px, 100%); max-height: 88vh;
    display: flex; flex-direction: column;
  }
  .lb-head {
    display: flex; align-items: center; gap: 10px; padding: 13px 18px;
    border-bottom: 1px solid var(--border);
  }
  .lb-head h3 { margin: 0; font-size: 15px; flex: 1; }
  .lb-head .x { background: none; border: none; font-size: 18px; color: var(--text-dim); padding: 2px 8px; border-radius: 6px; }
  .lb-head .x:hover { background: var(--surface2); color: var(--text); }
  .lb-body { padding: 16px 18px; overflow: auto; }
  .lb-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
  .lb-foot select {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 6px 8px; font: inherit; font-weight: 600;
  }
  .savegroup { display: inline-flex; gap: 6px; align-items: center; }
  .actmenu .note { display: block; padding: 4px 10px 6px; font-size: 11.5px; color: var(--text-dim); }

  table.t { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.t th { text-align: left; color: var(--text-dim); font-weight: 650; padding: 5px 10px; border-bottom: 1px solid var(--border); }
  table.t td { padding: 6px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  table.t td.mono, .mono { font-family: var(--mono); }

  .timeline { display: grid; gap: 0; }
  .tl { display: grid; grid-template-columns: 130px 190px 1fr; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--border); font-size: 12.5px; align-items: baseline; }
  .tl .st { font-weight: 650; }
  .tl .ts { font-family: var(--mono); font-size: 12px; }
  .tl .du { color: var(--text-dim); }

  /* ---------- edit form ---------- */
  .form { display: grid; grid-template-columns: 110px 1fr; gap: 11px 14px; align-items: center; }
  .form .flabel { color: var(--text-dim); font-size: 12px; font-weight: 650; }
  .form .top-align { align-self: start; padding-top: 6px; }
  .form input[type="text"], .form textarea, .form select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 7px; padding: 7px 10px; font: inherit;
  }
  .form textarea { font-family: var(--mono); font-size: 12.5px; resize: vertical; }
  .form .inline { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .form .inline label { display: flex; gap: 7px; align-items: center; color: var(--text-dim); font-size: 12.5px; font-weight: 600; }
  .form input[type="range"] { accent-color: var(--accent); width: 130px; }
  .rangeval { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 2ch; color: var(--text); }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 9px 18px; border-radius: 999px;
    font-weight: 600; font-size: 13px; z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity 160ms ease;
  }
  .toast.show { opacity: 1; }

  .empty { text-align: center; color: var(--text-dim); padding: 46px 0 30px; }
  /* The foot of the list, where the archive says how much of itself is on
     screen. Centred and quiet: it is a boundary marker, not an action the
     reader is being pushed toward. */
  .loadolder { display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
               gap: 10px; padding: 16px 0 6px; }
  .loadolder .hint { color: var(--text-dim); font-size: 12px; }

  /* ---------- views / router ---------- */
  .view { display: none; }
  .view.active { display: block; }

  /* ---------- dashboard ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    box-shadow: var(--row-shadow); padding: 11px 14px 9px;
  }
  .tile .tn { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .tile .tn small { font-size: 13px; font-weight: 650; color: var(--text-dim); }
  .tile .tl2 { font-size: 11.5px; color: var(--text-dim); font-weight: 600; margin-top: 1px; }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    box-shadow: var(--row-shadow); padding: 13px 16px 8px; margin-bottom: 10px;
  }
  .panel h3 { margin: 0 0 2px; font-size: 13.5px; }
  .panel .sub { color: var(--text-dim); font-size: 11.5px; margin-bottom: 8px; }
  .panel svg { display: block; width: 100%; height: auto; }
  .panel details { margin: 4px 0 6px; }
  .panel summary { color: var(--text-dim); font-size: 11.5px; cursor: pointer; }
  .chartgrid line { stroke: var(--border); stroke-width: 1; }
  .chartaxis text { fill: var(--text-dim); font-size: 10px; font-family: var(--sans); font-variant-numeric: tabular-nums; }
  .bar { rx: 2; }
  .bar:hover { filter: brightness(1.15); }
  .charttip {
    position: fixed; z-index: 300; pointer-events: none; display: none;
    background: var(--text); color: var(--bg); font-size: 12px; font-weight: 600;
    padding: 4px 9px; border-radius: 6px; white-space: nowrap;
  }
  .dashsplit { display: grid; grid-template-columns: 3fr 2fr; gap: 10px; align-items: start; }
  @media (max-width: 1100px) { .dashsplit { grid-template-columns: 1fr; } }
  .hbar { display: grid; grid-template-columns: 90px 1fr 40px; gap: 9px; align-items: center; padding: 4px 0; }
  .hbar .hname { font-size: 12px; font-weight: 600; text-align: right; color: var(--text-dim); }
  .hbar .htrack { background: var(--surface2); border-radius: 4px; height: 14px; }
  .hbar .hfill { background: var(--accent); border-radius: 4px; height: 14px; min-width: 2px; }
  .hbar .hval { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---------- settings forms ---------- */
  .setform { max-width: 1000px; } /* fits ~90-char mono agent-file lines in the wide textareas */
  .setgroup {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    box-shadow: var(--row-shadow); padding: 14px 18px; margin-bottom: 10px;
  }
  .setgroup h3 { margin: 0 0 4px; font-size: 13.5px; }
  .setgroup .sub { color: var(--text-dim); font-size: 12px; margin-bottom: 12px; }
  .setrow { display: grid; grid-template-columns: 250px 160px 1fr; gap: 10px; align-items: center; padding: 4px 0; }
  .setrow label { font-size: 12.5px; font-weight: 600; font-family: var(--mono); }
  .setrow input, .setrow select, .setrow textarea {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 6px 10px; font: inherit; font-variant-numeric: tabular-nums;
  }
  .setrow .why { color: var(--text-dim); font-size: 11.5px; }
  .setrow.wide { grid-template-columns: 250px 1fr; }
  .setrow.wide textarea { font-family: var(--mono); font-size: 12px; }
  .setfoot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .pill.shellstep { border-style: dashed; }
  .pill.shellstep.on { background: var(--s-scheduled-bg); color: #fff; border-color: var(--s-scheduled-bg); }
  .setsearch { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 2px 0 10px; }
  .setsearch input {
    width: 100%; box-sizing: border-box; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 9px; padding: 9px 13px; font: inherit;
  }

<script>
'use strict';

/* ------------------------------------------------------------------ data */

/* LIVE mode: served by `iter start`, everything comes from /api/*.
   Opened as a file (mockup review), the page falls back to built-in mock data. */
const LIVE = location.protocol === 'http:' || location.protocol === 'https:';

async function api(path, opts = {}) {
  const r = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

const PREPOST = ['deploy','git-commit','git-pr','git-pull','git-push','iterloop-stop','iterloop-wait-for-stop']
  .map(n => ({ name: n, exec: 'agent' }));
const prepostNames = () => PREPOST.map(p => p.name);
const prepostExec = n => (PREPOST.find(p => p.name === n) || {}).exec || 'agent';
const AGENTS = ['plan','code','testwriter','usecase','refactor','ingest'];

/* Models a work item may name (features item 12c). Empty means "whatever the
   agent type's own definition says" — the normal case; an override is for work
   whose shape is known, e.g. a mechanical sweep that does not need opus. The
   engine refuses anything outside this set. */
const MODELS = ['opus','sonnet','haiku','fable'];

/* globalsettings.default_automation — what a user-filed item's automation means
   when the form leaves it unset. Read from /api/config at load; "auto" is the
   engine's own default. */
let DEFAULT_AUTOMATION = 'auto';

/* Live agent definitions (fetched at startup when LIVE, mock otherwise). The
   New WorkItem form reads default_codepath_resolved / default_codepath_ignore
   from here to pre-fill fields when an agent type is picked. */
let AGENT_DEFS = [];
const agentDefaults = (t) => {
  const a = AGENT_DEFS.find(x => x.type === t) || {};
  return {
    codepath: (a.default_codepath_resolved || '').trim(),
    ignore: (a.default_codepath_ignore_resolved || a.default_codepath_ignore || '')
      .split(',').map(s => s.trim()).filter(Boolean),
  };
};
let PROJECT_ROOT = '/Users/stephen.hilton/dev/iterapp/sample';   // replaced by /api/meta in LIVE mode
let HOME = '/Users/stephen.hilton';                              // replaced by /api/meta in LIVE mode
let MAINFILE = '';        // the main.iter.md project head (structureV2), from /api/meta in LIVE mode
let CONTEXT_FILES = [];   // resolved globalcontextfiles — always in agent context; from /api/meta

/* codepath is entered relative but always resolved and shown absolute */
function normPath(p){
  // collapse ., .., and duplicate slashes so "devops/.." reads as what it means
  const out = [];
  for (const part of p.split('/')) {
    if (part === '' && out.length) continue;
    if (part === '.') continue;
    if (part === '..') { if (out.length > 1) out.pop(); continue; }
    out.push(part);
  }
  return out.join('/') || '/';
}

/* Resolve one context/testfiles line for display, mirroring the engine:
   placeholders labeled, {codepath} substituted, ~ expanded, relative from the
   project root, globs kept as globs. */
function resolveLine(line, codepathAbs){
  line = line.trim();
  if (!line) return null;
  const placeholders = {
    '{marker}': '(this node’s own marker file)',
    '{ancestor_markers}': '(markers of the ancestor chain)',
    '{interfaces}': '(contract files for uses/provides)',
  };
  if (placeholders[line]) return placeholders[line];
  let p = line.split('{codepath}').join(codepathAbs || '(codepath)');
  p = p.split('{topdir}').join(PROJECT_ROOT || '(topdir)');
  if (p === '~') p = HOME;
  else if (p.startsWith('~/')) p = HOME + '/' + p.slice(2);
  if (!p.startsWith('/') && !p.startsWith('(')) p = PROJECT_ROOT + '/' + p;
  return normPath(p);
}

/* live "→ resolves to" hints under a multi-line path box */
function wirePathHints(textareaId, hintId, codepathInputId){
  const update = () => {
    // {codepath} anchors to the PRIMARY codepath — the first line of the
    // CodePaths box, which may now list several.
    const cp = codepathInputId ? absCodepath(($(codepathInputId).value.split('\n')[0] || '').trim()) : '';
    const lines = $(textareaId).value.split('\n')
      .map(l => resolveLine(l, cp)).filter(Boolean);
    $(hintId).innerHTML = lines.map(l => '→ ' + esc(l)).join('<br>');
  };
  $(textareaId).addEventListener('input', update);
  if (codepathInputId) $(codepathInputId).addEventListener('input', update);
  update();
}

function absCodepath(cp){
  cp = (cp || '.').trim();
  let abs;
  if (cp.startsWith('/')) abs = cp;
  else if (cp === '~') abs = HOME;
  else if (cp.startsWith('~/')) abs = HOME + '/' + cp.slice(2);
  else abs = PROJECT_ROOT + '/' + cp;
  return normPath(abs.replace(/\/+$/,''));
}

const STATES = {
  'in-progress': { label:'In-Progress', icon:'⟳', bg:'var(--s-progress-bg)', fg:'var(--s-progress-fg)', order:0 },
  'queued':      { label:'Queued',      icon:'◷', bg:'var(--s-queued-bg)',   fg:'var(--s-queued-fg)',   order:1 },
  'question':    { label:'Question',    icon:'?', bg:'var(--s-question-bg)', fg:'var(--s-question-fg)', order:1.5 },
  'todo':        { label:'ToDo',        icon:'☐', bg:'var(--s-todo-bg)',     fg:'var(--s-todo-fg)',     order:2 },
  'paused':      { label:'Paused',      icon:'❙❙', bg:'var(--s-paused-bg)',  fg:'var(--s-paused-fg)',   order:3 },
  'scheduled':   { label:'Scheduled',   icon:'⏱', bg:'var(--s-scheduled-bg)', fg:'var(--s-scheduled-fg)', order:3.5 },
  'failed':      { label:'Failed',      icon:'✕', bg:'var(--s-failed-bg)',   fg:'var(--s-failed-fg)',   order:4 },
  'complete':    { label:'Complete',    icon:'✓', bg:'var(--s-complete-bg)', fg:'var(--s-complete-fg)', order:5 },
};

let seq = 0;
function uuid() {
  seq += 1;
  const tail = (Date.now().toString(16) + Math.random().toString(16).slice(2)).slice(0, 12);
  return `${rnd8()}-${rnd4()}-4${rnd4().slice(1)}-8${rnd4().slice(1)}-${tail}`;
}
function rnd8(){ return Math.random().toString(16).slice(2,10); }
function rnd4(){ return Math.random().toString(16).slice(2,6); }
function nowIso(){ return new Date().toISOString().replace(/\.\d+Z$/, 'Z'); }

/* Display timezone: data stays UTC on disk; user_timezone (globalsettings) is
   applied only when rendering. IANA ids via Intl, so DST is handled for free. */
let USER_TZ = 'UTC';

/* Sidebar clock (#srvClock, under the server DNS line): wall time in the
   preferences timezone. Reads USER_TZ on every tick, so a timezone change
   takes effect on the next second without a reload. */
function tickClock(){
  const el = document.getElementById('srvClock');
  if (!el) return;
  try {
    el.textContent = new Intl.DateTimeFormat(undefined, {
      timeZone: USER_TZ, weekday: 'short', hour: '2-digit', minute: '2-digit',
      second: '2-digit', hour12: false, timeZoneName: 'short',
    }).format(new Date());
  } catch (e) {
    el.textContent = new Date().toLocaleTimeString(); // bad tz id: browser-local fallback
  }
}
setInterval(tickClock, 1000);
tickClock(); // first paint now, not a second from now
const TZ_COMMON = [
  ['UTC', 'UTC'],
  ['America/Los_Angeles', 'US Pacific'],
  ['America/Denver', 'US Mountain'],
  ['America/Phoenix', 'US Arizona (no DST)'],
  ['America/Chicago', 'US Central'],
  ['America/New_York', 'US Eastern'],
  ['America/Anchorage', 'US Alaska'],
  ['Pacific/Honolulu', 'US Hawaii'],
];
const _tzFmt = {};
function tzFormatter(tz, opts, key){
  const k = tz + '|' + key;
  if (!(k in _tzFmt)) {
    try { _tzFmt[k] = new Intl.DateTimeFormat('en-CA', Object.assign({ timeZone: tz, hourCycle: 'h23' }, opts)); }
    catch (e) { _tzFmt[k] = null; }   // unknown tz id → caller falls back to UTC
  }
  return _tzFmt[k];
}
function tzParts(iso, opts, key){
  if (!iso || !/^\d{4}-\d{2}-\d{2}T/.test(iso)) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const f = tzFormatter(USER_TZ, opts, key) || tzFormatter('UTC', opts, key);
  const parts = {};
  for (const p of f.formatToParts(d)) parts[p.type] = p.value;
  return parts;
}
function fmtTs(iso){
  const p = tzParts(iso, { year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', timeZoneName:'short' }, 'full');
  if (!p) return iso || '';
  return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}:${p.second} ${p.timeZoneName}`;
}
function fmtTimeOnly(iso){
  const p = tzParts(iso, { hour:'2-digit', minute:'2-digit', second:'2-digit' }, 'time');
  return p ? `${p.hour}:${p.minute}:${p.second}` : (iso || '').slice(11,19);
}
/* How long ago, coarsely — for "this question has been waiting on you for 3h". */
function ago(iso){
  if (!iso) return '';
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (!isFinite(s) || s < 0) return '';
  if (s < 90) return s + 's';
  if (s < 5400) return Math.round(s/60) + 'm';
  if (s < 172800) return Math.round(s/3600) + 'h';
  return Math.round(s/86400) + 'd';
}

/* THE PATH RULE (one rule, everywhere): every path may be a glob; relative paths
   start at the CODE ROOT (globalsettings.code_root — defaults to where .iter/
   lives); ~ = home; {codepath} anchors a line to the work item's own code;
   codepaths are always stored absolute. */

/* LIVE starts with NOTHING (issue 10). Every count, row, and chip on this page
   is derived from `items`, so an empty array is the only honest state until
   /api/workitems has answered — and `firstLoad` holds the first paint on a
   skeleton so the beat before that answer shows blanks, not the demo's 17. */
let items = LIVE ? [] : MOCK_ITEMS;
let firstLoad = LIVE;
let loadError = '';

let activeFilters = new Set();          // empty = all
let openIds = new Set(LIVE ? [] : [MOCK_ITEMS[1].workid]);
let engineRunning = true;
let sortBy = 'state';

/* The header's numbers as the SERVER counted them (SELECT state, COUNT(*) over
   the whole table), or null before it has answered — the offline demo never
   sets it and derives from the array instead. See summaryCounts(). */
let stateCounts = null;

/* ---------------------------------------------------- summaries and bodies

   /api/workitems ships SUMMARIES: everything a row and its chips need, with the
   bulk text left out (mainwork, output, context, testfiles, prework, postwork,
   and the question/answer bodies). On pdy-dev that is the difference between a
   ~2MB response and a few tens of KB, and it was paid on every refresh. The
   whole record for ONE item is fetched when its row is expanded.

   The fetched text is merged INTO the item already sitting in `items` rather
   than parked in a map beside it, so every reader downstream — the detail
   panel, the Context lightbox, Clone's prefill, the answer box — still sees one
   whole work item and never has to ask which half it is holding. */
const BODY_FIELDS = ['mainwork','output','context','testfiles','prework','postwork','question','answer'];
const bodyLoaded  = new Set();   // workids whose text on the item is real and current
const bodyPending = new Map();   // workid -> the in-flight GET, so two openers share one fetch
const bodyError   = new Map();   // workid -> why the fetch failed; shown in the row, cleared on re-open

/* A row that arrived without its text. `summary` is the server's own marker;
   the mainwork test is the fallback that keeps this page honest against a whole
   item — the offline demo's mocks, an archive page, an older `iter start`. */
function isSummary(it){ return it.summary === true || it.mainwork === undefined; }

/* Everything on this page was written against a complete work item and would
   throw on a missing array (`item.prework.map`, `item.context.map`). A row is
   normalized on arrival so the omitted fields read as empty rather than as
   undefined — and empty is the honest answer until the body lands. */
function normItem(it){
  if (!it || typeof it !== 'object') return it;
  it.times = it.times || {};
  for (const k of ['prework','postwork','context','testfiles','codepath_ignore','depends_on'])
    if (!Array.isArray(it[k])) it[k] = [];
  return it;
}

/* The chips ask "is there a question / an answer", never "what does it say", so
   a summary answers with a boolean and the row renders identically. */
function hasQuestion(it){ return !!(it.has_question || it.question); }
function hasAnswer(it){ return !!(it.has_answer || it.answer); }

/* One GET per expanded row, once, shared between concurrent callers. Only the
   fields the summary OMITS are copied across: the summary is the fresher record
   for state and timings — it comes from the same store but through the delta
   stream, and an optimistic click may have moved the row since — so a body
   arriving late must never roll a row back to what it said when it left. */
function ensureBody(id){
  if (!LIVE) return Promise.resolve(true);   // the demo has no server; its items are already whole
  if (bodyLoaded.has(id)) return Promise.resolve(true);
  if (bodyPending.has(id)) return bodyPending.get(id);
  const p = fetchBody(id).finally(() => { bodyPending.delete(id); render(); });
  bodyPending.set(id, p);
  return p;
}

async function fetchBody(id){
  try {
    const r = await api(`/api/workitems/${id}`);
    const full = normItem(r && r.item ? r.item : r);
    const cur = items.find(i => i.workid === id);
    if (!cur || !full || !full.workid) return false;
    for (const k of BODY_FIELDS) if (k in full) cur[k] = full[k];
    // Anything else the summary simply did not carry rides along too (a field
    // added to the item shape after BODY_FIELDS was written); a key the summary
    // DID send is the fresher of the two and is left alone.
    for (const k of Object.keys(full)) if (cur[k] === undefined) cur[k] = full[k];
    cur.summary = false;
    bodyError.delete(id);
    bodyLoaded.add(id);
    return true;
  } catch (e) {
    bodyError.set(id, e.message);
    return false;
  }
}

/* Called from render(): an expanded row needs its text, and this is the single
   place that decides so. A row opened by a click, a row left open while a delta
   invalidated its body, and a row opened by saving a new item all arrive here
   the same way, so no caller has to remember to fetch. A row whose fetch FAILED
   is skipped rather than retried on every repaint — collapsing and re-opening
   it clears the error and asks again. */
function syncBodies(){
  if (!LIVE) return;
  for (const id of openIds) {
    if (bodyLoaded.has(id) || bodyPending.has(id) || bodyError.has(id)) continue;
    if (items.some(i => i.workid === id)) ensureBody(id);
  }
}

/* ---- the archive is a window now ----------------------------------------
   The list response carries the OPEN queue; the closed archive is pulled a page
   at a time from /api/workitems?archived=1&offset=&limit=. `archiveOffset` is
   the CURSOR, not a count of what is on screen: an item that closes while you
   read shifts the whole window down by one, so the cursor advances by what each
   page asked for and the merge dedups by workid rather than re-reading rows. */
const ARCHIVE_PAGE = 50;
let archiveOffset = 0;    // how far into the archive the cursor has walked
let archiveTotal  = 0;    // T from the page response — the size of the whole archive
let archiveBusy   = false;

/* Archive pages are FULL items (closed_page returns whole rows), so their text
   is already in hand and the body cache records it: expanding an archived row
   costs no fetch at all. */
function mergeArchive(page){
  const rows = (page && page.closed) || [];
  for (const raw of rows) {
    const it = normItem(raw);
    if (!it || !it.workid) continue;
    const at = items.findIndex(i => i.workid === it.workid);
    if (at >= 0) items[at] = it; else items.push(it);
    if (isSummary(it)) bodyLoaded.delete(it.workid); else bodyLoaded.add(it.workid);
  }
  archiveOffset = (typeof page.offset === 'number' ? page.offset : archiveOffset) + rows.length;
  if (typeof page.total === 'number') archiveTotal = page.total;
  // An empty page is the end of the archive whatever the total says: without
  // this the button would survive its own last click and never advance again.
  if (!rows.length) archiveTotal = archiveOffset;
}

async function loadArchivePage(limit = ARCHIVE_PAGE){
  if (!LIVE || archiveBusy) return;
  archiveBusy = true; render();
  try {
    mergeArchive(await api(`/api/workitems?archived=1&offset=${archiveOffset}&limit=${limit}`));
  } catch (e) {
    toast('Archive: ' + e.message);
  } finally {
    archiveBusy = false; render();
  }
}

    <span class="hint">${esc(bulkResult)}</span>`;
  // Re-render so the Go button flips label/danger style with the selection.
  $('bulkState').addEventListener('change', e => { bulkTarget = e.target.value; renderBulkBar(); });
}

function confirmBulkMove(){
  const n = bulkSel.size;
  if (!n) return;
  if (bulkTarget === 'delete') {
    openLb('Delete work items?', `
      <p style="margin-top:0">This <b>permanently deletes ${n}</b> selected work item${n===1?'':'s'}
      from the queue. <b>The engine keeps no copy</b> — there is no undo.</p>
      <p style="color:var(--text-dim);font-size:12.5px">Archived and in-progress items cannot be deleted
      and stay checked so you can see which they were. Scheduled templates ARE deleted (their schedule
      is gone with them).</p>`,
      `<button class="btn" data-lbclose>Cancel</button>
       <button class="btn danger" id="bulkConfirm">Delete ${n} workitem${n===1?'':'s'}</button>`);
  } else {
    openLb('Move work items?', `
      <p style="margin-top:0">Move <b>${n}</b> selected work item${n===1?'':'s'} to
      <b>${STATES[bulkTarget].label}</b>?</p>
      <p style="color:var(--text-dim);font-size:12.5px">Archived, in-progress, and scheduled items cannot be
      moved and stay checked so you can see which they were. Moving to Queued makes items immediately
      eligible for dispatch.</p>`,
      `<button class="btn" data-lbclose>Cancel</button>
       <button class="btn primary" id="bulkConfirm">Move ${n} workitem${n===1?'':'s'}</button>`);
  }
  $('bulkConfirm').addEventListener('click', bulkMove);
}

/* Per-item results: moved (unchecked), cannot-move (rule refusal — archived /
   engine-owned / template, or a server 4xx; stays checked), failed
   (network/5xx; stays checked, shown only when nonzero). */
async function bulkMove(){
  const target = bulkTarget;
  const del = target === 'delete';
  const action = del ? 'delete' : { queued:'queue', todo:'todo', paused:'pause', complete:'complete' }[target];
  let ok = 0, cannot = 0, fail = 0;
  for (const id of [...bulkSel]) {
    const item = items.find(i => i.workid === id);
    if (!item) { bulkSel.delete(id); continue; }
    // Archived items are immutable and the engine owns in-progress items in
    // every mode; scheduled templates block state MOVES but may be deleted.
    if (item.times.closed || item.state === 'in-progress' || (!del && item.state === 'scheduled')) { cannot++; continue; }
    if (!del && item.state === target) { ok++; bulkSel.delete(id); continue; }
    if (!LIVE) {
      if (del) { items = items.filter(i => i.workid !== id); openIds.delete(id); }
      else {
        item.state = target;
        if (target === 'complete') item.times.closed = nowIso();
      }
      ok++; bulkSel.delete(id); continue;
    }
    try {
      const r = await fetch(`/api/workitems/${id}/action`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action }),
      });
      if (r.ok) { ok++; bulkSel.delete(id); }
      else if (r.status < 500) cannot++;
      else fail++;
    } catch (e) { fail++; }
  }
  bulkResult = del
    ? `Deleted: ${ok} · Cannot delete: ${cannot}` + (fail ? ` · FAILED: ${fail}` : '')
    : `Moved to ${STATES[target].label}: ${ok} · Cannot move: ${cannot}` + (fail ? ` · FAILED: ${fail}` : '');
  closeLb();
  if (LIVE) { await loadAll(); } else { render(); }
  renderBulkBar();
  toast(bulkResult);
}

/* ------------------------------------------------------------- live loading */

async function loadAll(){
  if (!LIVE) return;
  try {
    const [meta, list, cfg] = await Promise.all([
      api('/api/meta'), api('/api/workitems'), api('/api/config').catch(() => null)]);
    if (cfg && cfg.globalsettings && cfg.globalsettings.user_timezone) {
      USER_TZ = cfg.globalsettings.user_timezone;
    }
    if (cfg && cfg.globalsettings && cfg.globalsettings.default_automation) {
      DEFAULT_AUTOMATION = cfg.globalsettings.default_automation;
    }
    AGENTS.length = 0;
    meta.agents.forEach(a => AGENTS.push(a.type));
    PREPOST.length = 0;
    meta.prepostwork.forEach(p => PREPOST.push(typeof p === 'string' ? { name: p, exec: 'agent' } : p));
    PROJECT_ROOT = meta.code_root || meta.project_root;
    if (meta.home) HOME = meta.home;
    if (meta.mainfile) MAINFILE = meta.mainfile;
    if (meta.context_files) CONTEXT_FILES = meta.context_files;
    if (Array.isArray(meta.default_context) && meta.default_context.length) {
      DEFAULT_CONTEXT = meta.default_context;
    }
    // Keep the reader where they paged to: a structural event fires a full
    // reload, and yanking five pages of archive out from under someone who
    // walked back through it would make "Load older" feel broken.
    const depth = Math.max(ARCHIVE_PAGE, archiveOffset);
    archiveOffset = 0; archiveTotal = 0;
    // Every row is a summary again, so every cached body is stale by
    // construction — the open rows refetch through render()'s syncBodies().
    bodyLoaded.clear(); bodyError.clear();
    items = (list.open || []).map(normItem);
    // A row that arrived WHOLE (an older server, or any future one that decides
    // an open item is small enough to ship entire) needs no per-row fetch —
    // record that its text is already in hand so syncBodies() leaves it alone.
    for (const it of items) if (!isSummary(it)) bodyLoaded.add(it.workid);
    stateCounts = list.counts || null;
    // An older `iter start` still answers the un-paginated shape and ships the
    // whole archive inline. Take it and there is nothing left to page.
    const inlineArchive = Array.isArray(list.closed);
    if (inlineArchive) mergeArchive({ closed: list.closed, offset: 0, total: list.closed.length });
    firstLoad = false; loadError = '';
    const brand = document.querySelector('.projbrand');
    brand.querySelector('b').textContent = meta.project_name;
    brand.querySelector('span').textContent = `${meta.url_slug}.localhost:${location.port || 80}`;
    document.title = `${meta.url_slug} · IterLoop`;
    setFavicon(meta.url_slug || 'iter');
    render();
    // The queue paints first and the archive follows: the open items are what
    // anyone came here for, and they should not wait on history.
    if (!inlineArchive) await loadArchivePage(depth);
  } catch (e) {
    // A failed first load still releases the skeleton — held forever it reads
    // as a hung page, and the row area says what actually went wrong.
    firstLoad = false;
    loadError = e.message;
    render();
    toast('API error: ' + e.message);
  }
}

/* issue 13b — apply a change feed event in place.
   `/api/events` used to say only "something changed", and the handler answered
   by refetching the entire queue — every item, open and archived, with all its
   mainwork and output text (~2MB on pdy-dev) — for what is usually one field on
   one row. Several agents running means events arrive continuously, so the UI
   spent its life re-downloading its own screen. The event now carries the
   changed items themselves and this patches them into `items`, with no fetch of
   any kind. render() is the same call it always was, so the rule that a focused
   answer box holds the rebuild holds for deltas too.
   The event's `counts` block IS the summary bar now. It used to be refused, and
   rightly: it tallies the whole table while the list shipped a truncated
   archive, so the header and the rows underneath told different stories. The
   archive is explicitly paginated today — the list is a declared window with its
   own "N older still in the archive" line — so the SQL tally is the only one
   that can be right, and deriving from `items` would under-report every closed
   state by however many pages the reader has not asked for.
   Resolves false when the delta cannot be completed and the caller must fall
   back to the full load. */
const DELTA_MAX_FETCHES = 10;

async function applyDelta(msg){
  const put = (fresh) => {
    if (!fresh || !fresh.workid) return;
    normItem(fresh);
    const at = items.findIndex(i => i.workid === fresh.workid);
    if (at < 0) { items.unshift(fresh); if (!isSummary(fresh)) bodyLoaded.add(fresh.workid); return; }
    if (isSummary(fresh)) {
      /* The delta is a summary, so it carries no mainwork or output. Hand the
         body we already fetched across, so an expanded row does not blink empty
         while it reloads — then drop it from the cache, because the change may
         well have BEEN the output, and stale text under a fresh state is worse
         than a moment of "loading". render() sees an open row with no valid
         body and refetches exactly that one item. */
      for (const k of BODY_FIELDS) if (!(k in fresh) && k in items[at]) fresh[k] = items[at][k];
      bodyLoaded.delete(fresh.workid);
    } else {
      bodyLoaded.add(fresh.workid);
    }
    items[at] = fresh;
  };

  (msg.changed || []).forEach(put);
  for (const id of (msg.removed || [])) {
    items = items.filter(i => i.workid !== id);
    openIds.delete(id);
    gatedCounts.delete(id);
    bodyLoaded.delete(id); bodyError.delete(id);
  }
  if (msg.counts) stateCounts = msg.counts;
  /* `changed` carries OPEN rows only, so an item that just moved to the archive
     arrives as a bare id: we know it closed but not with what state, output, or
     close stamp, and guessing any of those would put a fiction on screen.
     Fetching that ONE item is a few hundred bytes — reloading the whole queue to
     learn one row's ending is the megabyte this mechanism exists to avoid. Past
     a handful of them the full load is the cheaper answer again. */
  const needBody = (msg.closed || []).filter(id => {
    const have = items.find(i => i.workid === id);
    return !have || !have.times || !have.times.closed;
  });
  if (needBody.length > DELTA_MAX_FETCHES) return false;
  if (needBody.length) {
    try {
      const got = await Promise.all(needBody.map(id => api(`/api/workitems/${id}`)));
      got.forEach(r => put(r && r.item));
    } catch (e) {
      return false;                       // the item is gone or the API is down: reload and see
    }
  }
  render();
  return true;
}

async function refreshEngine(){
  if (!LIVE) return;
  try {
    const s = await api('/api/state');
    const chip = $('engineChip');
    const label = s.engine[0].toUpperCase() + s.engine.slice(1);
    chip.dataset.engine = s.engine === 'running' ? 'running' : (s.engine === 'stopped' ? 'stopped' : 'paused');
    $('engineState').textContent = label;
    engineRunning = s.engine === 'running';
    const u = s.usage;
    if (u) {
      const stale = u.age_sec > 900;
      $('usageInfo').textContent = `acct 5h ${Math.round(u.five_hour_pct)}% · 7d ${Math.round(u.seven_day_pct)}%${stale ? ' (stale)' : ''}`;
      $('usageInfo').title = `account usage from statusline snapshot, ${u.age_sec}s old — throttle tiers use ${Math.round(u.effective_pct)}%`;
    } else {
      $('usageInfo').textContent = '';
    }
  } catch (e) { /* server going away is fine */ }
}

/* ------------------------------------------------------------------ render */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function shortId(item){ return item.workid.split('-').pop(); }
function pct(t){ return t && t.total ? Math.round(100 * t.passed / t.total) : null; }

function testChip(item){
  const t = item.tests;
  if (!t) return '<span class="chip kv mono" title="No test results recorded yet">T:–</span>';
  const p = pct(t);
  const bg = p === 100 ? 'var(--s-complete-bg)' : (p >= 60 ? 'var(--s-progress-bg)' : 'var(--s-failed-bg)');
  const fg = p >= 60 && p < 100 ? 'var(--s-progress-fg)' : '#fff';
  return `<span class="chip mono" style="background:${bg};color:${fg}" title="Tests passed / total">T:${t.passed}/${t.total} · ${p}%</span>`;
}

/* Dependency chain chips (workitem_dependency.md). The header is what gets
   scanned, so gated items name their blocker there: `dep_status` is computed
   server-side (open queue + full closed archive, descendants included) and
   injected by /api/workitems on items that have depends_on. */
function id12(id){ return String(id).slice(-12); }
function depChip(item){
  const deps = item.depends_on || [];
  if (!deps.length) return '';
  const ids = deps.map(id12).join(', ');
  const shallow = item.depends_on_shallow ? ' (shallow: dependency completion only, descendants ignored)' : '';
  const ds = item.dep_status;
  if (ds && ds.state === 'failed')
    return `<span class="chip" style="background:var(--s-failed-bg);color:#fff" title="${esc(ds.by || 'dependency failed')} — flips to todo for human review">⛓ dep failed</span>`;
  if (ds && ds.state === 'blocked')
    return `<span class="chip" style="background:var(--s-todo-bg);color:#fff" title="Not dispatchable until dependencies close complete${shallow} — waits for: ${esc(ids)}">⛓ blocked-by: ${esc(id12(ds.by))}</span>`;
  return `<span class="chip kv mono" title="Dependencies${ds ? ' satisfied' : ''}${shallow}: ${esc(ids)}">⛓ after: ${esc(ids)}</span>`;
}
/* features/Question_state.md — the header is what gets scanned, so an item
   waiting on a human says so there, with how long it has been waiting. Once
   answered the chip flips to the decision, so the record stays visible on the
   item long after it has run. */
function questionChip(item){
  if (!hasQuestion(item)) return '';
  // The list ships `has_question`/`has_answer` and leaves the text behind, so
  // the chip is drawn from the boolean and the hover shows the words only once
  // the row has been opened and its body fetched.
  if (item.state === 'question') {
    const waited = ago(item.times.asked || item.times.added);
    const preview = item.question
      ? '\n\n' + esc(item.question.slice(0,400))
      : '';
    return `<span class="chip" style="background:var(--s-question-bg);color:var(--s-question-fg)"
      title="Blocked on your answer — open the row and press Answer…${preview}">
      ? awaiting your answer${waited ? ' · ' + waited : ''}</span>`;
  }
  const answered = item.times.answered ? fmtTs(item.times.answered) : '';
  const body = item.answer ? ': ' + esc(item.answer.slice(0,300)) : ' — open the row to read it';
  return `<span class="chip kv mono" title="Answered ${esc(answered)}${body}">✓ answered</span>`;
}
/* A queued item can be perfectly runnable and still never start because another
   item holds a lock covering its codepath. The dependency gate always had a
   chip; this is the same courtesy for the LOCK gate — the engine publishes its
   own skip reasons (.iter/.engine/blocked.json) and /api/workitems injects them
   as lock_status, so the chip reports what the picker actually decided rather
   than re-deriving it. */
function lockChip(item){
  const ls = item.lock_status;
  if (!ls) return '';
  const who = ls.by ? id12(ls.by) : 'another engine';
  const kind = ls.kind === 'running'
    ? 'a work item running right now'
    : 'an .iter.lock on disk (another engine, or left by a crash)';
  return `<span class="chip" style="background:var(--s-paused-bg);color:#fff"
    title="The engine skipped this item: its codepath sits inside a locked scope held by ${esc(who)} — ${esc(kind)}.\nLocked scope: ${esc(ls.path)}">🔒 lock-blocked by ${esc(who)}</span>`;
}

/* The other half of the story: the item everyone is waiting ON. A scope equal to
   the code root serializes the whole engine, which is sometimes intended and
   always worth seeing. */
function wholeTreeChip(item){
  // Only where the lock is imminent or held. A parked item with codepath "."
  // is a warning for creation time (which already fires), not a badge on every
  // row — the point of this chip is explaining a serialized engine.
  if (!['in-progress', 'queued'].includes(item.state)) return '';
  const root = normPath(PROJECT_ROOT);
  const paths = (item.codepaths && item.codepaths.length) ? item.codepaths : [item.codepath];
  if (!paths.some(p => absCodepath(p) === root)) return '';
  if ((item.codepath_ignore || []).includes('**')) return '';
  return `<span class="chip" style="background:var(--s-failed-bg);color:#fff"
    title="This item's lock scope IS the code root (${esc(root)}) — while it runs, no other work item can start.\nIf it only READS across the tree, codepath_ignore ['**'] makes it lockless.">🌳 locks the whole tree</span>`;
}

function blocksChip(item){
  const n = items.filter(o => (o.depends_on || []).includes(item.workid) && !o.times.closed).length;
  return n ? `<span class="chip kv mono" title="Open work items gated on this one finishing">blocks: ${n}</span>` : '';
}

/* An item in the ARCHIVE. times.closed is the queue's own marker for it — the
   engine stamps it as it flips the row's `archived` column — and the list is
   the open queue plus however many pages of the archive have been pulled. */
function isClosed(item){ return !!(item.times && item.times.closed); }

/* issue 7b — `todo` conflates three different situations, and they need three
   different things from the reader:
     unset   a review gate. Nothing is wrong; it wants a click.
     guard   iter reject, non-convergence, a failed dependency, a user stop.
             Something went sideways and a person has to judge it — so it wears
             the same orange the lock/paused warnings wear.
     config  dispatch validation refused it (a missing codepath &c). Retrying
             cannot fix it; the configuration has to change. Red, like a failure,
             because that is what it is — just caught before the retry budget died.
   lasterror carries the specifics, so it rides in the hover text. */
function todoReasonChip(item){
  if (item.state !== 'todo') return '';
  const why = item.lasterror ? '\n\n' + item.lasterror : '';
  if (item.todo_reason === 'guard')
    return `<span class="chip" style="background:var(--s-paused-bg);color:#fff"
      title="A guard parked this item — iter reject, the non-convergence guard, a failed dependency, or a stop you asked for. It needs your judgment, not just your click: read the output, then queue, edit, or complete it.${esc(why)}">⚠ guard parked this</span>`;
  if (item.todo_reason === 'config')
    return `<span class="chip" style="background:var(--s-failed-bg);color:#fff"
      title="Dispatch validation refused this item before any agent ran — a codepath that does not exist, or a file where a directory belongs. No attempt was burned and none will help: fix the configuration named below, then queue it.${esc(why)}">⚙ broken configuration</span>`;
  return `<span class="chip neutral"
    title="Waiting for your approval to run — this item was born under review-mode automation and nothing is wrong with it. Queue it when you want it to go.">☐ awaiting your approval</span>`;
}

/* issue 12c — a per-item model override is invisible everywhere else (it only
   shows up in what the run costs), so it says so on the row. */
function modelChip(item){
  if (!item.model) return '';
  return `<span class="chip kv mono"
    title="Per-item model override: this run uses ${esc(item.model)} instead of the ${esc(item.type)} agent's default model.">model: ${esc(item.model)}</span>`;
}

/* issue 7c — descendants of this item that were born ToDo under review-mode
   automation and are still sitting there. The count is only known once
   something has asked /api/workitems/<id>/gated (the Actions menu, or a save
   that flipped automation to auto), so the chip appears when the answer is in
   hand and never costs a fetch of its own. */
const gatedCounts = new Map();   // workid -> gated descendant count, as last measured
function gatedChip(item){
  const n = gatedCounts.get(item.workid);
  if (!n) return '';
  return `<span class="chip" style="background:var(--s-todo-bg);color:#fff"
    title="${n} work item${n===1?'':'s'} descended from this one ${n===1?'is':'are'} parked in ToDo purely by the review gate. Actions → Release gated items queues them all.">☐ ${n} gated</span>`;
}

function sourceLabel(src){
  if (src === 'user') return 'User';
  if (src === 'error') return 'Error';
  const m = src.match(/^agent:\s*(\w+)/);
  return m ? m[1][0].toUpperCase() + m[1].slice(1) : src;
}

/* The header is fed by the server's SELECT state, COUNT(*) over the whole
   table, never by a count of `items`. `items` is a WINDOW — the open queue plus
   however many archive pages have been asked for — so counting it would report
   "complete: 50" on a project with five thousand finished items, and the number
   people glance at to see whether the day moved would be the number of rows
   that happened to be downloaded. Only the offline demo counts its own array,
   because there the array genuinely IS the whole queue. */
function summaryCounts(){
  if (!stateCounts) {
    const c = { total: items.length };
    for (const s of Object.keys(STATES)) c[s] = items.filter(i => i.state === s).length;
    return c;
  }
  const c = {};
  let sum = 0;
  for (const s of Object.keys(STATES)) { c[s] = stateCounts[s] || 0; sum += c[s]; }
  // A state this build does not know about still belongs in Total, so the
  // fallback adds up what the server sent rather than what STATES lists.
  c.total = typeof stateCounts.total === 'number' ? stateCounts.total : sum;
  return c;
}

/* The nine chips of the summary bar, in display order. One list, so the live
   bar and the loading skeleton always have the same shape and the same column
   math — the bar must not reflow when the first response lands. */
const SUMMARY_DEFS = [
  ['total','Total','var(--s-total-bg)','var(--s-total-fg)'],
  ['complete','✓ Complete','var(--s-complete-bg)','var(--s-complete-fg)'],
  ['in-progress','⟳ In-Progress','var(--s-progress-bg)','var(--s-progress-fg)'],
  ['queued','◷ Queued','var(--s-queued-bg)','var(--s-queued-fg)'],
  ['question','? Question','var(--s-question-bg)','var(--s-question-fg)'],
  ['todo','☐ ToDo','var(--s-todo-bg)','var(--s-todo-fg)'],
  ['failed','✕ Failed','var(--s-failed-bg)','var(--s-failed-fg)'],
  ['paused','❙❙ Paused','var(--s-paused-bg)','var(--s-paused-fg)'],
  ['scheduled','⏱ Scheduled','var(--s-scheduled-bg)','var(--s-scheduled-fg)'],
];

// Keep the bar one row wide as states are added: the count drives the grid,
// and half of it (rounded up) is the two-row fallback on narrow windows.
function sizeSummaryGrid(){
  $('summary').style.setProperty('--sumcols', SUMMARY_DEFS.length);
  $('summary').style.setProperty('--sumcols-half', Math.ceil(SUMMARY_DEFS.length / 2));
}

/* The beat before the first /api/workitems answer: the real bar, dimmed, with
   no numbers in it. Anything else on screen here would be the demo dataset. */
function renderSkeleton(){
  sizeSummaryGrid();
  $('summary').className = 'summary';
  // Same classes as the real bar, not just the same shape: anything keying off
  // `.sumbtn.total` (styling, tests) must see the skeleton as the same element
  // in a loading state rather than as a different widget.
  $('summary').innerHTML = SUMMARY_DEFS.map(([key,label,bg,fg]) =>
    `<button class="sumbtn ${key==='total'?'total':''}" disabled style="background:${bg};color:${fg};opacity:.45"
      title="Loading this project's queue…">
      <span class="n">·</span><span class="t">${label}</span></button>`).join('');
  $('filterHint').textContent = 'Loading work items…';
  $('rows').innerHTML = `<div class="empty">Loading this project's queue…</div>`;
}

function renderSummary(){
  const c = summaryCounts();
  const defs = SUMMARY_DEFS;
  $('summary').className = 'summary' + (activeFilters.size ? ' filtered' : '');
  sizeSummaryGrid();
  $('summary').innerHTML = defs.map(([key,label,bg,fg]) => {
    const on = key !== 'total' && activeFilters.has(key);
    const n = key === 'total' ? c.total : c[key];
    return `<button class="sumbtn ${on?'on':''} ${key==='total'?'total':''}" data-filter="${key}"
      style="background:${bg};color:${fg}" aria-pressed="${on}"
      title="${key==='total' ? 'Show all work items' : 'Filter to ' + label.replace(/^\S+ /,'') + ' items'}">
      <span class="n">${n}</span><span class="t">${label}</span></button>`;
  }).join('');
  $('filterHint').textContent = activeFilters.size
    ? `Filtered: ${[...activeFilters].map(s => STATES[s].label).join(' + ')} — click Total to clear`
    : `${c.total} work items · click a summary button to filter`;
}

/* Priorities are lower-is-sooner (P0 most urgent); error source gets a -2 boost. */
function effPrio(i){ return i.priority - (i.source==='error' ? 2 : 0); }
function byState(a,b){
  return STATES[a.state].order - STATES[b.state].order
    || effPrio(b) - effPrio(a)
    || a.times.added.localeCompare(b.times.added);
}

function visibleItems(){
  const list = activeFilters.size ? items.filter(i => activeFilters.has(i.state)) : items.slice();
  const cmp = {
    state: byState,
    requested: (a,b) => b.times.added.localeCompare(a.times.added),
    completed: (a,b) => {
      const ac = a.times.closed, bc = b.times.closed;
      if (!ac && !bc) return byState(a,b);          // both incomplete: on top, state order
      if (!ac) return -1;
      if (!bc) return 1;
      return bc.localeCompare(ac);                  // newest completion first
    },
    priority: (a,b) => effPrio(a) - effPrio(b) || a.times.added.localeCompare(b.times.added),
    agent: (a,b) => a.type.localeCompare(b.type) || byState(a,b),
    source: (a,b) => sourceLabel(a.source).localeCompare(sourceLabel(b.source)) || byState(a,b),
  }[sortBy] || byState;
  return list.sort(cmp);
}

function schedDesc(sc){
  if (!sc || !sc.kind) return '';
  if (sc.kind === 'every') return `every ${sc.every_min}m`;
  if (sc.kind === 'stale') return `if idle ${sc.every_min}m`;
  if (sc.kind === 'daily') return `daily ${sc.at}${sc.tz ? ' ' + sc.tz : ''}`;
  return `${sc.day} ${sc.at}${sc.tz ? ' ' + sc.tz : ''}`;
}

function pillRow(assigned, editable, phase){
  const names = prepostNames();
  const inlineLits = assigned.filter(x => !names.includes(x));
  const pool = PREPOST.map(({ name, exec }) => {
    const on = assigned.includes(name);
    const shell = exec === 'shell';
    const why = shell
      ? `engine-run shell script (.iter/prepostwork/${name}.sh) — runs deterministically, no LLM; its output feeds the next step`
      : `prompt step (.iter/prepostwork/${name}.md) — runs as an agent turn`;
    return `<button class="pill ${on?'on':''} ${shell?'shellstep':''} ${editable?'toggle':''}" title="${esc(why)}" ${editable?`data-toggle="${phase}" data-name="${esc(name)}"`:'disabled tabindex="-1" style="cursor:default"'}>${shell?'⚙ ':''}${esc(name)}</button>`;
  });
  const lits = inlineLits.map(t =>
    `<span class="pill on inline-lit" title="Inline literal step: ${esc(t)}">“${esc(t)}”</span>`);
  return `<div class="pills">${pool.join('')}${lits.join('')}</div>`;
}

/* The foot of the list. The archive is a window, and a window has to say so:
   with three thousand finished items and fifty on screen, a bare "No work items
   match this filter" under the Completed chip reads as "this project has never
   finished anything". The numbers come from the page cursor and the total the
   server sent with it, so they describe the ARCHIVE rather than guessing from
   what happens to be downloaded. */
function archiveFooter(){
  const rest = archiveTotal - archiveOffset;
  if (!LIVE || (rest <= 0 && !archiveBusy)) return '';
  const n = Math.max(0, Math.min(rest, ARCHIVE_PAGE));
  return `<div class="loadolder">
    <button class="btn" id="loadOlder" ${archiveBusy ? 'disabled' : ''}
      title="The open queue above is always complete. Only the closed archive is paged, oldest last.">
      ${archiveBusy ? 'Loading…' : `Load ${n} older archived item${n === 1 ? '' : 's'}`}</button>
    ${archiveTotal ? `<span class="hint">${archiveOffset} of ${archiveTotal} archived items loaded · ${rest} older not shown</span>` : ''}
  </div>`;
}

function renderRows(){
  const list = visibleItems();
  const foot = archiveFooter();
  if (!list.length) {
    // An empty list after a FAILED load is not an empty queue — say which it is
    // rather than letting a network error read as "nothing to do" (issue 4's
    // lesson, on the webapp side). And an empty list with archive left to page
    // is neither: it is a filter whose matches are all older than the window.
    $('rows').innerHTML = (loadError
      ? `<div class="empty">Could not read the queue: ${esc(loadError)}<br>
           <span style="font-size:12.5px">This is the API talking, not your queue — the page retries on the next engine event.</span></div>`
      : foot
        ? `<div class="empty">Nothing loaded matches this filter — the archive is paged, and older entries may still match.</div>`
        : `<div class="empty">No work items match this filter.</div>`) + foot;
    return;
  }
  $('rows').innerHTML = list.map(item => {
    const st = STATES[item.state];
    const open = openIds.has(item.workid);
    return `
    <div class="item ${open?'open':''}" data-id="${item.workid}">
      <div class="rowhead ${bulkMode?'bulk':''}" data-rowclick="${item.workid}" role="button" tabindex="0"
           aria-expanded="${open}" aria-label="Toggle detail for: ${esc(item.title)}">
        ${bulkMode ? `<input type="checkbox" data-bulksel="${item.workid}" ${bulkSel.has(item.workid)?'checked':''} aria-label="Select for bulk state change">` : ''}
        <div class="stateicon" style="background:${st.bg};color:${st.fg}">${st.icon}</div>
        <div class="rowmid">
          <div class="title">${esc(item.title)}</div>
          <div class="badges">
            <span class="chip" style="background:${st.bg};color:${st.fg}">${st.label}</span>
            <span class="chip neutral" title="Agent type that does the work">${esc(item.type[0].toUpperCase()+item.type.slice(1))}</span>
            <span class="chip mono" style="background:var(--s-paused-bg);color:#fff" title="Priority 0–10 — lower runs sooner (P0 most urgent)">P:${item.priority}</span>
            <span class="chip kv mono" title="Risk 0–10">R:${item.risk}</span>
            <span class="chip" style="background:var(--s-queued-bg);color:#fff" title="Requested by">${esc(sourceLabel(item.source))}</span>
            ${testChip(item)}
            ${item.source_testgroup ? `<span class="chip" style="background:var(--s-todo-bg);color:#fff" title="Born from this testgroup (sweep provenance)${(item.source_tests||[]).length ? ' — red at birth: ' + esc(item.source_tests.join(', ')) : ''}">TG: ${esc(item.source_testgroup)}</span>` : ''}
            ${todoReasonChip(item)}${questionChip(item)}${depChip(item)}${lockChip(item)}${wholeTreeChip(item)}${blocksChip(item)}${gatedChip(item)}${modelChip(item)}
            ${item.sched && item.sched.kind ? `<span class="chip mono" style="background:var(--s-scheduled-bg);color:#fff" title="Schedule — last fired: ${esc(item.sched.last_fired || 'never')}">⏱ ${esc(schedDesc(item.sched))}</span>` : ''}
            ${item.source_schedule ? `<span class="chip" style="background:var(--s-scheduled-bg);color:#fff" title="Born from schedule ${esc(item.source_schedule)}">SCHED RUN</span>` : ''}
            ${item.exec === 'shell' ? `<span class="chip mono" style="background:var(--s-paused-bg);color:#fff" title="exec: shell — the engine runs the steps as shell commands; no LLM">⚙ shell</span>` : ''}
            ${item.automation === 'auto' ? `<span class="chip" style="background:var(--s-complete-bg);color:#fff" title="Fully automated lineage — items this one creates are born QUEUED (inherited by descendants); guards still land in ToDo">AUTO</span>` : ''}
            <span class="chip kv mono" title="Attempts">A:${item.attempts}</span>
            <span class="chip meta mono" title="Stored UTC: ${esc(item.times.added)}">Requested: <b>${esc(fmtTs(item.times.added))}</b></span>
            <span class="chip meta mono">ID: <b>${esc(shortId(item))}</b></span>
          </div>
        </div>
        <div class="actwrap">
          <button class="actbtn" data-actions="${item.workid}" aria-haspopup="menu">Actions ▾</button>
          <div class="actmenu" data-menu="${item.workid}" role="menu">${actionButtons(item)}</div>
        </div>
      </div>
      <div class="detailwrap"><div class="detail"><div class="detail-inner">
        <div class="dlabel">CodePath</div>
        <div class="dvalrow"><span class="codepath" title="Lock scope and agent working directory">${esc(absCodepath(item.codepath))}</span>${
          (item.codepath_ignore||[]).length ? `<span class="codepath" title="Subtrees carved out of the lock scope — parallel items may own them" style="opacity:.75">ignoring: ${esc(item.codepath_ignore.join(', '))}</span>` : ''}
          <span class="fullid">ID: ${esc(item.workid)}</span></div>
        ${parkedBlock(item)}
        ${questionBlocks(item)}
        ${bodyBlocks(item)}
        <div class="dlabel">Details</div>
        <div class="detailbtns">
          <button class="btn" data-lb="tests" data-id="${item.workid}">View Test Details</button>
          <button class="btn" data-lb="times" data-id="${item.workid}">View Time Records</button>
          <button class="btn" data-lb="context" data-id="${item.workid}"${bodyReady(item) ? '' : ' disabled'}>View Context and Prompts</button>
          <button class="btn" data-lb="logs" data-id="${item.workid}">View Logs</button>
        </div>
      </div></div></div>
    </div>`;
  }).join('') + foot;
}

/* Has this row's text arrived? Offline the mock items are whole from the start,
   so the demo never waits and never fetches. */
function bodyReady(item){ return !LIVE || bodyLoaded.has(item.workid); }

/* Everything the summary left out. Until GET /api/workitems/<id> answers, the
   panel says it is loading rather than painting "Request: —" beside a running
   agent's row, which would read as an item dispatched with no instructions. */
function bodyBlocks(item){
  if (!bodyReady(item)) {
    const err = bodyError.get(item.workid);
    return `<div class="dlabel">Request</div>
      <div class="textblock" style="color:var(--text-dim)">${err
        ? `Could not load this item's text: ${esc(err)} — close the row and open it again to retry.`
        : 'Loading this item’s request and output…'}</div>`;
  }
  return `<div class="dlabel">Prework</div><div>${pillRow(item.prework,false,'prework')}</div>
    <div class="dlabel">Request</div><div class="textblock">${esc(item.mainwork || '')||'<i>—</i>'}</div>
    <div class="dlabel">Postwork</div><div>${pillRow(item.postwork,false,'postwork')}</div>
    <div class="dlabel">Output</div><div class="textblock mono">${esc(item.output || '')||'<i>no output yet</i>'}</div>`;
}

/* Why a guard or the dispatch validator parked this item — the one thing its
   reader has to act on, and it is written in lasterror. It gets a block of its
   own beside the request rather than living only in the hover text and the Time
   Records lightbox, because "codepath does not exist: <path>" is the fix. */
function parkedBlock(item){
  if (item.state !== 'todo' || !item.todo_reason || !item.lasterror) return '';
  const cfg = item.todo_reason === 'config';
  return `<div class="dlabel">${cfg ? 'Configuration' : 'Guard'}</div>
    <div class="textblock" style="border-left:4px solid ${cfg ? 'var(--s-failed-bg)' : 'var(--s-paused-bg)'}">${esc(item.lasterror)}</div>`;
}

/* features/Question_state.md — the Question and the Answer are two separate
   blocks ABOVE the request, because they are the reason the item is sitting
   here. They stay after the item runs: the pair is the durable record of what
   was asked and what was decided, and nothing rewrites the request to bury it.

   The answer is typed right here, in the row. The states where the server
   accepts an edit (question/todo/paused) get a live textarea that autosaves;
   everywhere else the same box is the read-only record. */
const ANSWERABLE = ['question', 'todo', 'paused'];

function questionBlocks(item){
  if (!hasQuestion(item)) return '';
  /* The question and the answer are body fields: the summary says only THAT
     there is one. Until the fetch lands there is a question but not yet its
     words — and an empty answer box here would invite someone to answer a
     question they cannot read, then autosave that over the real answer. */
  if (!bodyReady(item)) {
    return `<div class="dlabel">Question</div>
      <div class="textblock question" style="color:var(--text-dim)">Loading the question…</div>`;
  }
  const stamp = (label, ts, extra) => ts
    ? `<span style="color:var(--text-dim);font-weight:500;font-size:11.5px"> — ${label} ${esc(fmtTs(ts))}${extra||''}</span>`
    : '';
  const asked = stamp('asked', item.times.asked, ago(item.times.asked) ? ` (${ago(item.times.asked)} ago)` : '');
  const answered = stamp('answered', item.times.answered);
  const head = `<div class="dlabel">Question${asked}</div>
    <div class="textblock question">${esc(item.question)}</div>
    <div class="dlabel">Answer${answered}</div>`;

  if (!ANSWERABLE.includes(item.state)) {
    return head + (item.answer
      ? `<div class="textblock answer">${esc(item.answer)}</div>`
      : `<div class="textblock unanswered">No answer recorded.</div>`);
  }
  const val = answerDrafts.has(item.workid) ? answerDrafts.get(item.workid) : (item.answer || '');
  return head + `<div>
      <textarea class="answerbox" data-answer="${item.workid}" rows="3" spellcheck="true"
        placeholder="Name one of the recommendations, or give a different direction. The agent gets this text verbatim at the top of its request.">${esc(val)}</textarea>
      <div class="answerrow">
        <button class="btn primary" data-act="answerqueue" data-id="${item.workid}">Answer and Queue</button>
        <span class="answerstat" data-astat="${item.workid}">${esc(answerStatus(item))}</span>
      </div>
    </div>`;
}

/* ---- the inline answer editor: type, it saves itself -------------------
   Typing marks the item dirty; a single 5-second ticker flushes every dirty
   draft, and leaving the box flushes it immediately. Nothing to press to keep
   an answer — "Answer and Queue" is only for when you are DONE. */
const answerDrafts = new Map();   // workid -> what is in the textarea right now
const answerState  = new Map();   // workid -> 'dirty' | 'saving' | 'saved' | error text
let answerTicker = null;
const AUTOSAVE_MS = 5000;

function answerStatus(item){
  const st = answerState.get(item.workid);
  if (st === 'dirty')  return 'unsaved — autosaves every 5s';
  if (st === 'saving') return 'saving…';
  if (st === 'saved')  return 'saved';
  if (st) return st;
  return item.answer ? 'saved' : 'autosaves as you type';
}

/* Status is written straight to the DOM: while the box has focus the row is
   deliberately NOT re-rendered (that would eat the caret mid-sentence).

   ALL of them, not the first: one item can have two answer boxes on the page at
   once — the one in its expanded row and the one in the Answer lightbox — and
   the row's comes first in document order, so writing only to the first match
   would leave the box actually being typed in permanently reading "autosaves as
   you type" while the hidden one behind the modal did the reporting. */
function setAnswerState(id, st){
  answerState.set(id, st);
  const els = document.querySelectorAll(`[data-astat="${id}"]`);
  if (!els.length) return;
  const item = items.find(i => i.workid === id);
  const text = item ? answerStatus(item) : '';
  els.forEach(el => { el.textContent = text; el.classList.toggle('dirty', st === 'dirty'); });
}

/* Which of those boxes holds the text the user means. An open lightbox is the
   one they are looking at and typing into, so it wins over the row's copy
   underneath — which may be several keystrokes behind, or from a repaint that
   happened before the modal opened. */
function answerBoxFor(id){
  const ov = $('overlay');
  if (ov.classList.contains('open')) {
    const inLb = ov.querySelector(`[data-answer="${id}"]`);
    if (inLb) return inLb;
  }
  return document.querySelector(`[data-answer="${id}"]`);
}

function answerDirty(id){
  const item = items.find(i => i.workid === id);
  return item && answerDrafts.has(id) && answerDrafts.get(id) !== (item.answer || '');
}

/* PATCH the answer field alone — no state change. The item stays parked in
   Question until you decide it is finished. */
async function flushAnswer(id){
  if (!answerDirty(id)) return;
  const item = items.find(i => i.workid === id);
  // Blurring the box to press "Answer and Queue" flushes first and queues
  // second; once queued the server rightly refuses edits, so don't chase it.
  if (!ANSWERABLE.includes(item.state)) { answerDrafts.delete(id); return; }
  const text = answerDrafts.get(id);
  setAnswerState(id, 'saving');
  try {
    if (LIVE) await api(`/api/workitems/${id}`, { method:'PATCH', body: JSON.stringify({ answer: text }) });
    item.answer = text;                 // keep the local copy in step with the row on disk
    item.has_answer = !!text;           // …and the summary's boolean with the text, so the chip agrees
    setAnswerState(id, 'saved');
  } catch (e) {
    setAnswerState(id, 'not saved: ' + e.message);
  }
}

function noteAnswerEdit(id, text){
  answerDrafts.set(id, text);
  /* Keep the OTHER box for this item in step — the row's, while the Answer
     lightbox has the caret. Leave it stale and closing the modal would put a
     box holding older words back in front of the user, and the next blur of it
     would autosave those older words over what was just typed. */
  document.querySelectorAll(`[data-answer="${id}"]`).forEach(b => {
    if (b !== document.activeElement && b.value !== text) b.value = text;
  });
  setAnswerState(id, answerDirty(id) ? 'dirty' : 'saved');
  if (answerTicker) return;
  answerTicker = setInterval(() => {
    const dirty = [...answerDrafts.keys()].filter(answerDirty);
    if (!dirty.length && !document.querySelector('.answerbox:focus')) {
      clearInterval(answerTicker); answerTicker = null; return;
    }
    dirty.forEach(flushAnswer);
  }, AUTOSAVE_MS);
}
