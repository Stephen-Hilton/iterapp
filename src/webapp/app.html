<title>pdy-dev · IterLoop</title>
<style>
  :root {
    --bg: #f2f4f7;
    --surface: #ffffff;
    --surface2: #eaedf2;
    --border: #d4d9e1;
    --text: #191d24;
    --text-dim: #5b6472;
    --accent: #4557d0;
    --accent-fg: #ffffff;
    --shadow: 0 8px 28px rgba(20, 26, 40, 0.16);
    --row-shadow: 0 1px 2px rgba(20, 26, 40, 0.07);

    --s-total-bg: #7c3aed;   --s-total-fg: #ffffff;
    --s-complete-bg: #1a9a4a; --s-complete-fg: #ffffff;
    --s-progress-bg: #e8a71c; --s-progress-fg: #241a02;
    --s-queued-bg: #2f7fd6;  --s-queued-fg: #ffffff;
    --s-scheduled-bg: #7c4dbc; --s-scheduled-fg: #ffffff;
    --s-todo-bg: #d4589e;    --s-todo-fg: #ffffff;
    --s-failed-bg: #d43a3a;  --s-failed-fg: #ffffff;
    --s-paused-bg: #e07020;  --s-paused-fg: #ffffff;

    --pill-on-bg: #4557d0;   --pill-on-fg: #ffffff;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161b;
      --surface: #1d2027;
      --surface2: #262a33;
      --border: #363c48;
      --text: #e8eaef;
      --text-dim: #98a0ae;
      --accent: #7986e8;
      --accent-fg: #10121a;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      --row-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      --s-progress-bg: #d99a15; --s-progress-fg: #1c1400;
      --pill-on-bg: #6474e8; --pill-on-fg: #0e1118;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161b;
    --surface: #1d2027;
    --surface2: #262a33;
    --border: #363c48;
    --text: #e8eaef;
    --text-dim: #98a0ae;
    --accent: #7986e8;
    --accent-fg: #10121a;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    --row-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    --s-progress-bg: #d99a15; --s-progress-fg: #1c1400;
    --pill-on-bg: #6474e8; --pill-on-fg: #0e1118;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .app { display: grid; grid-template-columns: 190px 1fr; min-height: 100vh; }

  /* ---------- sidebar ---------- */
  .side {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 18px 14px;
  }
  .side h1 { font-size: 17px; margin: 0 0 6px; letter-spacing: 0.2px; }
  .side h1 .loop { color: var(--accent); }
  .projbrand { display: grid; gap: 1px; margin: 0 0 18px; }
  .projbrand b { font-size: 12px; }
  .projbrand span { font-size: 10.5px; color: var(--text-dim); font-family: var(--mono); }
  .nav .srv { display: flex; align-items: center; gap: 7px; }
  .nav .srv .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .nav .srv small { color: var(--text-dim); font-family: var(--mono); font-size: 10px; margin-left: auto; }
  .navgroup { margin-bottom: 22px; }
  .navgroup .navhead {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px;
  }
  .nav a {
    display: block; padding: 5px 9px; border-radius: 6px;
    color: var(--text-dim); text-decoration: none; margin-bottom: 1px;
  }
  .nav a:hover { background: var(--surface2); color: var(--text); }
  .nav a.here { background: var(--surface2); color: var(--text); font-weight: 600; }

  /* ---------- main ---------- */
  .main { padding: 16px 22px 60px; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .topbar h2 { font-size: 18px; margin: 0; flex: 1; }
  .enginechip {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); background: var(--surface);
    border-radius: 999px; padding: 5px 14px 5px 10px; font-weight: 600;
  }
  .enginechip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .enginechip[data-engine="running"] .dot { background: var(--s-complete-bg); box-shadow: 0 0 0 3px rgba(26,154,74,.22); }
  .enginechip[data-engine="paused"]  .dot { background: var(--s-paused-bg);  box-shadow: 0 0 0 3px rgba(224,112,32,.25); }
  .enginechip[data-engine="stopped"] .dot { background: var(--s-failed-bg);  box-shadow: 0 0 0 3px rgba(212,58,58,.25); }
  .enginechip .lbl { color: var(--text-dim); font-weight: 500; }

  /* ---------- summary strip ---------- */
  .summary { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .sumbtn {
    border: none; border-radius: 9px; padding: 9px 6px 7px;
    display: grid; justify-items: center; gap: 1px;
    box-shadow: var(--row-shadow);
    transition: transform 60ms ease, filter 120ms ease, opacity 120ms ease;
  }
  .sumbtn .n { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .sumbtn .t { font-size: 11.5px; font-weight: 600; opacity: 0.92; }
  .sumbtn:hover { filter: brightness(1.06); }
  .sumbtn:active { transform: translateY(1px); }
  .summary.filtered .sumbtn:not(.on):not(.total) { opacity: 0.42; }
  .sumbtn.on { box-shadow: inset 0 0 0 3px rgba(255,255,255,0.85), 0 0 0 2px var(--text); }

  .toolrow { display: flex; justify-content: flex-end; gap: 8px; margin: 12px 0; align-items: center; }
  .toolrow .hint { margin-right: auto; color: var(--text-dim); font-size: 12.5px; }
  .sortlbl { display: inline-flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 12.5px; font-weight: 600; }
  .sortlbl select {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 6px 8px; font: inherit; font-weight: 600;
  }
  .pathhint { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); margin-top: 5px; }
  .btn {
    border: 1px solid var(--border); background: var(--surface);
    border-radius: 7px; padding: 6px 14px; font-weight: 600;
  }
  .btn:hover { background: var(--surface2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger { color: var(--s-failed-bg); border-color: var(--s-failed-bg); }

  /* ---------- work item rows ---------- */
  .rows { display: grid; gap: 7px; }
  .item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; box-shadow: var(--row-shadow); overflow: visible;
  }
  .rowhead {
    display: grid; grid-template-columns: 46px 1fr auto; align-items: stretch;
    cursor: pointer; border-radius: 9px;
  }
  .item.open .rowhead { border-radius: 9px 9px 0 0; }
  .rowhead:hover { background: color-mix(in srgb, var(--surface2) 55%, var(--surface)); }
  .stateicon {
    display: grid; place-items: center; font-size: 21px; font-weight: 700;
    border-radius: 8px 0 0 8px; color: #fff;
  }
  .item.open .stateicon { border-radius: 8px 0 0 0; }
  .rowmid { padding: 7px 12px 7px 12px; min-width: 0; }
  .title {
    font-weight: 650; font-size: 13.5px; color: var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; align-items: center; }
  .chip {
    font-size: 11px; font-weight: 700; padding: 1.5px 8px; border-radius: 5px;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .chip.neutral { background: var(--surface2); color: var(--text); border: 1px solid var(--border); font-weight: 600; }
  .chip.kv { background: var(--surface2); border: 1px solid var(--border); }
  .chip.meta { background: none; border: none; color: var(--text-dim); font-weight: 500; padding: 1.5px 2px; }
  .chip.meta b { color: var(--text); font-weight: 600; }
  .chip.mono { font-family: var(--mono); font-weight: 500; }
  .actwrap { position: relative; display: grid; align-items: center; padding: 0 10px; }
  .actbtn {
    background: var(--accent); color: var(--accent-fg); border: none;
    border-radius: 7px; padding: 7px 12px; font-weight: 700; font-size: 12.5px;
  }
  .actmenu {
    position: absolute; right: 8px; top: calc(100% - 6px); z-index: 30;
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    box-shadow: var(--shadow); min-width: 210px; padding: 5px; display: none;
  }
  .actmenu.open { display: block; }
  .actmenu button {
    display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 7px 10px; border-radius: 6px; font-weight: 550;
  }
  .actmenu button:hover { background: var(--surface2); }
  .actmenu button.danger { color: var(--s-failed-bg); }
  .actmenu .sep { height: 1px; background: var(--border); margin: 4px 6px; }

  /* ---------- slide-down detail ---------- */
  .detailwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 200ms ease; }
  .item.open .detailwrap { grid-template-rows: 1fr; }
  @media (prefers-reduced-motion: reduce) { .detailwrap { transition: none; } }
  .detail { overflow: hidden; }
  .detail-inner {
    border-top: 1px solid var(--border); padding: 14px 16px 16px;
    display: grid; grid-template-columns: 92px 1fr; gap: 10px 14px; align-items: start;
  }
  .dlabel { color: var(--text-dim); font-size: 12px; font-weight: 650; padding-top: 4px; }
  .dvalrow { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .codepath {
    font-family: var(--mono); font-size: 12.5px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; flex: 1; min-width: 200px;
  }
  .fullid { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 3px 11px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
  }
  .pill.on { background: var(--pill-on-bg); border-color: var(--pill-on-bg); color: var(--pill-on-fg); }
  .pill.inline-lit { border-style: dashed; font-style: italic; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill.toggle:hover { border-color: var(--accent); color: var(--text); }
  .pill.toggle.on:hover { filter: brightness(1.1); color: var(--pill-on-fg); }
  .textblock {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 12px; font-size: 12.5px; max-height: 60vh; overflow: auto; white-space: pre-wrap;
  }
  .textblock.mono { font-family: var(--mono); font-size: 12px; }
  .detailbtns { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- lightbox ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(12, 15, 22, 0.55); z-index: 100;
    display: none; align-items: flex-start; justify-content: center; padding: 5vh 16px;
  }
  .overlay.open { display: flex; }
  .lightbox {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    /* Wide enough that the ~90-char mono lines agents write don't soft-wrap. */
    box-shadow: var(--shadow); width: min(1000px, 100%); max-height: 88vh;
    display: flex; flex-direction: column;
  }
  .lb-head {
    display: flex; align-items: center; gap: 10px; padding: 13px 18px;
    border-bottom: 1px solid var(--border);
  }
  .lb-head h3 { margin: 0; font-size: 15px; flex: 1; }
  .lb-head .x { background: none; border: none; font-size: 18px; color: var(--text-dim); padding: 2px 8px; border-radius: 6px; }
  .lb-head .x:hover { background: var(--surface2); color: var(--text); }
  .lb-body { padding: 16px 18px; overflow: auto; }
  .lb-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
  .lb-foot select {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 6px 8px; font: inherit; font-weight: 600;
  }
  .savegroup { display: inline-flex; gap: 6px; align-items: center; }
  .actmenu .note { display: block; padding: 4px 10px 6px; font-size: 11.5px; color: var(--text-dim); }

  table.t { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.t th { text-align: left; color: var(--text-dim); font-weight: 650; padding: 5px 10px; border-bottom: 1px solid var(--border); }
  table.t td { padding: 6px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  table.t td.mono, .mono { font-family: var(--mono); }

  .timeline { display: grid; gap: 0; }
  .tl { display: grid; grid-template-columns: 130px 190px 1fr; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--border); font-size: 12.5px; align-items: baseline; }
  .tl .st { font-weight: 650; }
  .tl .ts { font-family: var(--mono); font-size: 12px; }
  .tl .du { color: var(--text-dim); }

  /* ---------- edit form ---------- */
  .form { display: grid; grid-template-columns: 110px 1fr; gap: 11px 14px; align-items: center; }
  .form .flabel { color: var(--text-dim); font-size: 12px; font-weight: 650; }
  .form .top-align { align-self: start; padding-top: 6px; }
  .form input[type="text"], .form textarea, .form select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 7px; padding: 7px 10px; font: inherit;
  }
  .form textarea { font-family: var(--mono); font-size: 12.5px; resize: vertical; }
  .form .inline { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .form .inline label { display: flex; gap: 7px; align-items: center; color: var(--text-dim); font-size: 12.5px; font-weight: 600; }
  .form input[type="range"] { accent-color: var(--accent); width: 130px; }
  .rangeval { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 2ch; color: var(--text); }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 9px 18px; border-radius: 999px;
    font-weight: 600; font-size: 13px; z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity 160ms ease;
  }
  .toast.show { opacity: 1; }

  .empty { text-align: center; color: var(--text-dim); padding: 46px 0 30px; }

  /* ---------- views / router ---------- */
  .view { display: none; }
  .view.active { display: block; }

  /* ---------- dashboard ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    box-shadow: var(--row-shadow); padding: 11px 14px 9px;
  }
  .tile .tn { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .tile .tn small { font-size: 13px; font-weight: 650; color: var(--text-dim); }
  .tile .tl2 { font-size: 11.5px; color: var(--text-dim); font-weight: 600; margin-top: 1px; }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    box-shadow: var(--row-shadow); padding: 13px 16px 8px; margin-bottom: 10px;
  }
  .panel h3 { margin: 0 0 2px; font-size: 13.5px; }
  .panel .sub { color: var(--text-dim); font-size: 11.5px; margin-bottom: 8px; }
  .panel svg { display: block; width: 100%; height: auto; }
  .panel details { margin: 4px 0 6px; }
  .panel summary { color: var(--text-dim); font-size: 11.5px; cursor: pointer; }
  .chartgrid line { stroke: var(--border); stroke-width: 1; }
  .chartaxis text { fill: var(--text-dim); font-size: 10px; font-family: var(--sans); font-variant-numeric: tabular-nums; }
  .bar { rx: 2; }
  .bar:hover { filter: brightness(1.15); }
  .charttip {
    position: fixed; z-index: 300; pointer-events: none; display: none;
    background: var(--text); color: var(--bg); font-size: 12px; font-weight: 600;
    padding: 4px 9px; border-radius: 6px; white-space: nowrap;
  }
  .dashsplit { display: grid; grid-template-columns: 3fr 2fr; gap: 10px; align-items: start; }
  @media (max-width: 1100px) { .dashsplit { grid-template-columns: 1fr; } }
  .hbar { display: grid; grid-template-columns: 90px 1fr 40px; gap: 9px; align-items: center; padding: 4px 0; }
  .hbar .hname { font-size: 12px; font-weight: 600; text-align: right; color: var(--text-dim); }
  .hbar .htrack { background: var(--surface2); border-radius: 4px; height: 14px; }
  .hbar .hfill { background: var(--accent); border-radius: 4px; height: 14px; min-width: 2px; }
  .hbar .hval { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---------- settings forms ---------- */
  .setform { max-width: 1000px; } /* fits ~90-char mono agent-file lines in the wide textareas */
  .setgroup {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    box-shadow: var(--row-shadow); padding: 14px 18px; margin-bottom: 10px;
  }
  .setgroup h3 { margin: 0 0 4px; font-size: 13.5px; }
  .setgroup .sub { color: var(--text-dim); font-size: 12px; margin-bottom: 12px; }
  .setrow { display: grid; grid-template-columns: 250px 160px 1fr; gap: 10px; align-items: center; padding: 4px 0; }
  .setrow label { font-size: 12.5px; font-weight: 600; font-family: var(--mono); }
  .setrow input, .setrow select, .setrow textarea {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 6px 10px; font: inherit; font-variant-numeric: tabular-nums;
  }
  .setrow .why { color: var(--text-dim); font-size: 11.5px; }
  .setrow.wide { grid-template-columns: 250px 1fr; }
  .setrow.wide textarea { font-family: var(--mono); font-size: 12px; }
  .setfoot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .pill.shellstep { border-style: dashed; }
  .pill.shellstep.on { background: var(--s-scheduled-bg); color: #fff; border-color: var(--s-scheduled-bg); }
  .setsearch { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 2px 0 10px; }
  .setsearch input {
    width: 100%; box-sizing: border-box; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 9px; padding: 9px 13px; font: inherit;
  }
  .sethead { margin: 18px 0 8px; font-size: 15px; }
  .sethead small { color: var(--text-dim); font-weight: 500; font-size: 12px; margin-left: 8px; }

  /* ---------- projects ---------- */
  :root {
    --lvl-project-bg: #cdedd6; --lvl-project-fg: #14532d;
    --lvl-context-bg: #d5e6fa; --lvl-context-fg: #1e3a8a;
    --lvl-container-bg: #f9d8ea; --lvl-container-fg: #831858;
    --lvl-component-bg: #fde3c8; --lvl-component-fg: #7c3d05;
    --thread: #c22a2e; --thread-bg: #fdf0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --lvl-project-bg: #1e3a28; --lvl-project-fg: #9fdcb4;
      --lvl-context-bg: #1e3050; --lvl-context-fg: #a9c6f5;
      --lvl-container-bg: #46203a; --lvl-container-fg: #f0aed3;
      --lvl-component-bg: #4a3418; --lvl-component-fg: #f5c893;
      --thread: #e05a5e; --thread-bg: #2a1b1b;
    }
  }
  :root[data-theme="dark"] {
    --lvl-project-bg: #1e3a28; --lvl-project-fg: #9fdcb4;
    --lvl-context-bg: #1e3050; --lvl-context-fg: #a9c6f5;
    --lvl-container-bg: #46203a; --lvl-container-fg: #f0aed3;
    --lvl-component-bg: #4a3418; --lvl-component-fg: #f5c893;
    --thread: #e05a5e; --thread-bg: #2a1b1b;
  }
  .projtools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .projtools label { display: inline-flex; gap: 7px; align-items: center; color: var(--text-dim); font-size: 12.5px; font-weight: 600; }
  .projtools select {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 6px 8px; font: inherit; font-weight: 600; max-width: 340px;
  }
  .legendbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .lvlchip {
    font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 999px;
    border: 1px solid transparent; cursor: pointer;
  }
  .lvlchip:hover { border-color: var(--text-dim); }
  .lvlchip.active { border-color: var(--thread); box-shadow: 0 0 0 1px var(--thread); }
  .legendbar .lhint { color: var(--text-dim); font-size: 11.5px; }
  .ptree { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; box-shadow: var(--row-shadow); overflow: hidden; }

/* LIVE mode: served by `iter start`, everything comes from /api/*.
   Opened as a file (mockup review), the page falls back to built-in mock data. */
const LIVE = location.protocol === 'http:' || location.protocol === 'https:';

async function api(path, opts = {}) {
  const r = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

const PREPOST = ['deploy','git-commit','git-pr','git-pull','git-push','iterloop-stop','iterloop-wait-for-stop']
  .map(n => ({ name: n, exec: 'agent' }));
const prepostNames = () => PREPOST.map(p => p.name);
const prepostExec = n => (PREPOST.find(p => p.name === n) || {}).exec || 'agent';
const AGENTS = ['plan','code','testwriter','refactor','ingest'];
let PROJECT_ROOT = '/Users/stephen.hilton/dev/iterapp/sample';   // replaced by /api/meta in LIVE mode
let HOME = '/Users/stephen.hilton';                              // replaced by /api/meta in LIVE mode
let REQS_DIR = '';   // project-wide reqs dir (global bizreq/techreq) — replaced by /api/meta in LIVE mode

/* codepath is entered relative but always resolved and shown absolute */
function normPath(p){
  // collapse ., .., and duplicate slashes so "devops/.." reads as what it means
  const out = [];
  for (const part of p.split('/')) {
    if (part === '' && out.length) continue;
    if (part === '.') continue;
    if (part === '..') { if (out.length > 1) out.pop(); continue; }
    out.push(part);
  }
  return out.join('/') || '/';
}

/* Resolve one context/testfiles line for display, mirroring the engine:
   placeholders labeled, {codepath} substituted, ~ expanded, relative from the
   project root, globs kept as globs. */
function resolveLine(line, codepathAbs){
  line = line.trim();
  if (!line) return null;
  const placeholders = {
    '{marker}': '(this node’s own marker file)',
    '{ancestor_markers}': '(markers of the ancestor chain)',
    '{interfaces}': '(contract files for uses/provides)',
  };
  if (placeholders[line]) return placeholders[line];
  let p = line.split('{codepath}').join(codepathAbs || '(codepath)');
  p = p.split('{reqs}').join(REQS_DIR || '(project-wide reqs dir)');
  if (p === '~') p = HOME;
  else if (p.startsWith('~/')) p = HOME + '/' + p.slice(2);
  if (!p.startsWith('/') && !p.startsWith('(')) p = PROJECT_ROOT + '/' + p;
  return normPath(p);
}

/* live "→ resolves to" hints under a multi-line path box */
function wirePathHints(textareaId, hintId, codepathInputId){
  const update = () => {
    const cp = codepathInputId ? absCodepath($(codepathInputId).value) : '';
    const lines = $(textareaId).value.split('\n')
      .map(l => resolveLine(l, cp)).filter(Boolean);
    $(hintId).innerHTML = lines.map(l => '→ ' + esc(l)).join('<br>');
  };
  $(textareaId).addEventListener('input', update);
  if (codepathInputId) $(codepathInputId).addEventListener('input', update);
  update();
}

function absCodepath(cp){
  cp = (cp || '.').trim();
  let abs;
  if (cp.startsWith('/')) abs = cp;
  else if (cp === '~') abs = HOME;
  else if (cp.startsWith('~/')) abs = HOME + '/' + cp.slice(2);
  else abs = PROJECT_ROOT + '/' + cp;
  return normPath(abs.replace(/\/+$/,''));
}

function uuid() {
  seq += 1;

function rnd4(){ return Math.random().toString(16).slice(2,6); }
function nowIso(){ return new Date().toISOString().replace(/\.\d+Z$/, 'Z'); }

/* Display timezone: data stays UTC on disk; user_timezone (globalsettings) is
   applied only when rendering. IANA ids via Intl, so DST is handled for free. */
let USER_TZ = 'UTC';

/* Sidebar clock (#srvClock, under the server DNS line): wall time in the
   preferences timezone. Reads USER_TZ on every tick, so a timezone change
   takes effect on the next second without a reload. */
function tickClock(){
  const el = document.getElementById('srvClock');
  if (!el) return;
  try {
    el.textContent = new Intl.DateTimeFormat(undefined, {
      timeZone: USER_TZ, weekday: 'short', hour: '2-digit', minute: '2-digit',
      second: '2-digit', hour12: false, timeZoneName: 'short',
    }).format(new Date());
  } catch (e) {
    el.textContent = new Date().toLocaleTimeString(); // bad tz id: browser-local fallback
  }
}
setInterval(tickClock, 1000);
tickClock(); // first paint now, not a second from now
const TZ_COMMON = [
  ['UTC', 'UTC'],
  ['America/Los_Angeles', 'US Pacific'],
  ['America/Denver', 'US Mountain'],
  ['America/Phoenix', 'US Arizona (no DST)'],
  ['America/Chicago', 'US Central'],
  ['America/New_York', 'US Eastern'],
  ['America/Anchorage', 'US Alaska'],
  ['Pacific/Honolulu', 'US Hawaii'],
];
const _tzFmt = {};
function tzFormatter(tz, opts, key){
  const k = tz + '|' + key;
  if (!(k in _tzFmt)) {
    try { _tzFmt[k] = new Intl.DateTimeFormat('en-CA', Object.assign({ timeZone: tz, hourCycle: 'h23' }, opts)); }
    catch (e) { _tzFmt[k] = null; }   // unknown tz id → caller falls back to UTC
  }
  return _tzFmt[k];
}
function tzParts(iso, opts, key){
  if (!iso || !/^\d{4}-\d{2}-\d{2}T/.test(iso)) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const f = tzFormatter(USER_TZ, opts, key) || tzFormatter('UTC', opts, key);
  const parts = {};
  for (const p of f.formatToParts(d)) parts[p.type] = p.value;
  return parts;
}
function fmtTs(iso){
  const p = tzParts(iso, { year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', timeZoneName:'short' }, 'full');
  if (!p) return iso || '';
  return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}:${p.second} ${p.timeZoneName}`;
}
function fmtTimeOnly(iso){
  const p = tzParts(iso, { hour:'2-digit', minute:'2-digit', second:'2-digit' }, 'time');
  return p ? `${p.hour}:${p.minute}:${p.second}` : (iso || '').slice(11,19);
}

/* ------------------------------------------------------------------ state */

let activeFilters = new Set();          // empty = all
let openIds = new Set(LIVE ? [] : [items[1].workid]);
let engineRunning = true;
let sortBy = 'state';

/* ------------------------------------------------------------- live loading */

async function loadAll(){
  if (!LIVE) return;
  try {
    const [meta, list, cfg] = await Promise.all([
      api('/api/meta'), api('/api/workitems'), api('/api/config').catch(() => null)]);
    if (cfg && cfg.globalsettings && cfg.globalsettings.user_timezone) {
      USER_TZ = cfg.globalsettings.user_timezone;
    }
    AGENTS.length = 0;
    meta.agents.forEach(a => AGENTS.push(a.type));
    PREPOST.length = 0;
    meta.prepostwork.forEach(p => PREPOST.push(typeof p === 'string' ? { name: p, exec: 'agent' } : p));
    PROJECT_ROOT = meta.code_root || meta.project_root;
    if (meta.home) HOME = meta.home;
    if (meta.reqs_dir) REQS_DIR = meta.reqs_dir;
    if (Array.isArray(meta.default_context) && meta.default_context.length) {
      DEFAULT_CONTEXT = meta.default_context;
    }
    items = [...list.open, ...list.closed.slice().reverse()];
    const brand = document.querySelector('.projbrand');
    brand.querySelector('b').textContent = meta.project_name;
    brand.querySelector('span').textContent = `${meta.url_slug}.localhost:${location.port || 80}`;
    document.title = `${meta.url_slug} · IterLoop`;
    setFavicon(meta.url_slug || 'iter');
    render();
  } catch (e) {
    toast('API error: ' + e.message);
  }
}

async function refreshEngine(){
  if (!LIVE) return;
  try {
    const s = await api('/api/state');
    const chip = $('engineChip');
    const label = s.engine[0].toUpperCase() + s.engine.slice(1);
    chip.dataset.engine = s.engine === 'running' ? 'running' : (s.engine === 'stopped' ? 'stopped' : 'paused');
    $('engineState').textContent = label;
    engineRunning = s.engine === 'running';
    const u = s.usage;
    if (u) {
      const stale = u.age_sec > 900;
      $('usageInfo').textContent = `acct 5h ${Math.round(u.five_hour_pct)}% · 7d ${Math.round(u.seven_day_pct)}%${stale ? ' (stale)' : ''}`;
      $('usageInfo').title = `account usage from statusline snapshot, ${u.age_sec}s old — throttle tiers use ${Math.round(u.effective_pct)}%`;
    } else {
      $('usageInfo').textContent = '';
    }
  } catch (e) { /* server going away is fine */ }
}

/* ------------------------------------------------------------------ render */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function shortId(item){ return item.workid.split('-').pop(); }
function pct(t){ return t && t.total ? Math.round(100 * t.passed / t.total) : null; }

function testChip(item){
  const t = item.tests;
  if (!t) return '<span class="chip kv mono" title="No test results recorded yet">T:–</span>';
  const p = pct(t);
  const bg = p === 100 ? 'var(--s-complete-bg)' : (p >= 60 ? 'var(--s-progress-bg)' : 'var(--s-failed-bg)');
  const fg = p >= 60 && p < 100 ? 'var(--s-progress-fg)' : '#fff';
  return `<span class="chip mono" style="background:${bg};color:${fg}" title="Tests passed / total">T:${t.passed}/${t.total} · ${p}%</span>`;
}

function sourceLabel(src){
  if (src === 'user') return 'User';
  if (src === 'error') return 'Error';
  const m = src.match(/^agent:\s*(\w+)/);
  return m ? m[1][0].toUpperCase() + m[1].slice(1) : src;
}

function summaryCounts(){
  const c = { total: items.length };
  for (const s of Object.keys(STATES)) c[s] = items.filter(i => i.state === s).length;
  return c;
}

function renderSummary(){
  const c = summaryCounts();
  const defs = [
    ['total','Total','var(--s-total-bg)','var(--s-total-fg)'],
    ['complete','✓ Complete','var(--s-complete-bg)','var(--s-complete-fg)'],
    ['in-progress','⟳ In-Progress','var(--s-progress-bg)','var(--s-progress-fg)'],
    ['queued','◷ Queued','var(--s-queued-bg)','var(--s-queued-fg)'],
    ['todo','☐ ToDo','var(--s-todo-bg)','var(--s-todo-fg)'],
    ['failed','✕ Failed','var(--s-failed-bg)','var(--s-failed-fg)'],
    ['paused','❙❙ Paused','var(--s-paused-bg)','var(--s-paused-fg)'],
  ];
  $('summary').className = 'summary' + (activeFilters.size ? ' filtered' : '');
  $('summary').innerHTML = defs.map(([key,label,bg,fg]) => {
    const on = key !== 'total' && activeFilters.has(key);
    const n = key === 'total' ? c.total : c[key];
    return `<button class="sumbtn ${on?'on':''} ${key==='total'?'total':''}" data-filter="${key}"
      style="background:${bg};color:${fg}" aria-pressed="${on}"
      title="${key==='total' ? 'Show all work items' : 'Filter to ' + label.replace(/^\S+ /,'') + ' items'}">
      <span class="n">${n}</span><span class="t">${label}</span></button>`;
  }).join('');
  $('filterHint').textContent = activeFilters.size
    ? `Filtered: ${[...activeFilters].map(s => STATES[s].label).join(' + ')} — click Total to clear`
    : `${c.total} work items · click a summary button to filter`;
}

function effPrio(i){ return i.priority + (i.source==='error' ? 2 : 0); }
function byState(a,b){
  return STATES[a.state].order - STATES[b.state].order
    || effPrio(b) - effPrio(a)
    || a.times.added.localeCompare(b.times.added);
}

function visibleItems(){
  const list = activeFilters.size ? items.filter(i => activeFilters.has(i.state)) : items.slice();
  const cmp = {
    state: byState,
    requested: (a,b) => b.times.added.localeCompare(a.times.added),
    completed: (a,b) => {
      const ac = a.times.closed, bc = b.times.closed;
      if (!ac && !bc) return byState(a,b);          // both incomplete: on top, state order
      if (!ac) return -1;
      if (!bc) return 1;
      return bc.localeCompare(ac);                  // newest completion first
    },
    priority: (a,b) => effPrio(b) - effPrio(a) || a.times.added.localeCompare(b.times.added),
    agent: (a,b) => a.type.localeCompare(b.type) || byState(a,b),
    source: (a,b) => sourceLabel(a.source).localeCompare(sourceLabel(b.source)) || byState(a,b),
  }[sortBy] || byState;
  return list.sort(cmp);
}

function schedDesc(sc){
  if (!sc || !sc.kind) return '';
  if (sc.kind === 'every') return `every ${sc.every_min}m`;
  if (sc.kind === 'stale') return `if idle ${sc.every_min}m`;
  if (sc.kind === 'daily') return `daily ${sc.at}${sc.tz ? ' ' + sc.tz : ''}`;
  return `${sc.day} ${sc.at}${sc.tz ? ' ' + sc.tz : ''}`;
}

function pillRow(assigned, editable, phase){
  const names = prepostNames();
  const inlineLits = assigned.filter(x => !names.includes(x));
  const pool = PREPOST.map(({ name, exec }) => {
    const on = assigned.includes(name);
    const shell = exec === 'shell';
    const why = shell
      ? `engine-run shell script (.iter/prepostwork/${name}.sh) — runs deterministically, no LLM; its output feeds the next step`
      : `prompt step (.iter/prepostwork/${name}.md) — runs as an agent turn`;
    return `<button class="pill ${on?'on':''} ${shell?'shellstep':''} ${editable?'toggle':''}" title="${esc(why)}" ${editable?`data-toggle="${phase}" data-name="${esc(name)}"`:'disabled tabindex="-1" style="cursor:default"'}>${shell?'⚙ ':''}${esc(name)}</button>`;
  });
  const lits = inlineLits.map(t =>
    `<span class="pill on inline-lit" title="Inline literal step: ${esc(t)}">“${esc(t)}”</span>`);
  return `<div class="pills">${pool.join('')}${lits.join('')}</div>`;
}

function renderRows(){
  const list = visibleItems();
  if (!list.length) {
    $('rows').innerHTML = `<div class="empty">No work items match this filter.</div>`;
    return;
  }
  $('rows').innerHTML = list.map(item => {
    const st = STATES[item.state];
    const open = openIds.has(item.workid);
    return `
    <div class="item ${open?'open':''}" data-id="${item.workid}">
      <div class="rowhead" data-rowclick="${item.workid}" role="button" tabindex="0"
           aria-expanded="${open}" aria-label="Toggle detail for: ${esc(item.title)}">
        <div class="stateicon" style="background:${st.bg};color:${st.fg}">${st.icon}</div>
        <div class="rowmid">
          <div class="title">${esc(item.title)}</div>
          <div class="badges">
            <span class="chip" style="background:${st.bg};color:${st.fg}">${st.label}</span>
            <span class="chip neutral" title="Agent type that does the work">${esc(item.type[0].toUpperCase()+item.type.slice(1))}</span>
            <span class="chip mono" style="background:var(--s-paused-bg);color:#fff" title="Priority 0–10">P:${item.priority}</span>
            <span class="chip kv mono" title="Risk 0–10">R:${item.risk}</span>
            <span class="chip" style="background:var(--s-queued-bg);color:#fff" title="Requested by">${esc(sourceLabel(item.source))}</span>
            ${testChip(item)}
            ${item.source_testgroup ? `<span class="chip" style="background:var(--s-todo-bg);color:#fff" title="Born from this testgroup (sweep provenance)${(item.source_tests||[]).length ? ' — red at birth: ' + esc(item.source_tests.join(', ')) : ''}">TG: ${esc(item.source_testgroup)}</span>` : ''}
            ${item.sched && item.sched.kind ? `<span class="chip mono" style="background:var(--s-scheduled-bg);color:#fff" title="Schedule — last fired: ${esc(item.sched.last_fired || 'never')}">⏱ ${esc(schedDesc(item.sched))}</span>` : ''}
            ${item.source_schedule ? `<span class="chip" style="background:var(--s-scheduled-bg);color:#fff" title="Born from schedule ${esc(item.source_schedule)}">SCHED RUN</span>` : ''}
            ${item.exec === 'shell' ? `<span class="chip mono" style="background:var(--s-paused-bg);color:#fff" title="exec: shell — the engine runs the steps as shell commands; no LLM">⚙ shell</span>` : ''}
            <span class="chip kv mono" title="Attempts">A:${item.attempts}</span>
            <span class="chip meta mono" title="Stored UTC: ${esc(item.times.added)}">Requested: <b>${esc(fmtTs(item.times.added))}</b></span>
            <span class="chip meta mono">ID: <b>${esc(shortId(item))}</b></span>
          </div>
        </div>
        <div class="actwrap">
          <button class="actbtn" data-actions="${item.workid}" aria-haspopup="menu">Actions ▾</button>
          <div class="actmenu" data-menu="${item.workid}" role="menu">${actionButtons(item)}</div>
        </div>
      </div>
      <div class="detailwrap"><div class="detail"><div class="detail-inner">
        <div class="dlabel">CodePath</div>
        <div class="dvalrow"><span class="codepath" title="Lock scope and agent working directory">${esc(absCodepath(item.codepath))}</span>${
          (item.codepath_ignore||[]).length ? `<span class="codepath" title="Subtrees carved out of the lock scope — parallel items may own them" style="opacity:.75">ignoring: ${esc(item.codepath_ignore.join(', '))}</span>` : ''}
          <span class="fullid">ID: ${esc(item.workid)}</span></div>
        <div class="dlabel">Prework</div><div>${pillRow(item.prework,false,'prework')}</div>
        <div class="dlabel">Request</div><div class="textblock">${esc(item.mainwork)||'<i>—</i>'}</div>
        <div class="dlabel">Postwork</div><div>${pillRow(item.postwork,false,'postwork')}</div>
        <div class="dlabel">Output</div><div class="textblock mono">${esc(item.output)||'<i>no output yet</i>'}</div>
        <div class="dlabel">Details</div>
        <div class="detailbtns">
          <button class="btn" data-lb="tests" data-id="${item.workid}">View Test Details</button>
          <button class="btn" data-lb="times" data-id="${item.workid}">View Time Records</button>
          <button class="btn" data-lb="context" data-id="${item.workid}">View Context and Prompts</button>
          <button class="btn" data-lb="logs" data-id="${item.workid}">View Logs</button>
        </div>
      </div></div></div>
    </div>`;
  }).join('');
}

function actionButtons(item){
  const s = item.state;
  if (s === 'in-progress') {
    // The engine is loosely coupled to the queue: while an agent is running this item,
    // queue-side state changes wouldn't alter engine behavior — so only Clone is real.
    return `<button data-act="clone" data-id="${item.workid}" role="menuitem">Clone</button>
      <div class="sep"></div>
      <span class="note">Agent is running — the engine owns this item until it finishes.</span>`;
  }
  if (s === 'scheduled') {
    // Engine-owned semantics: queueing a schedule clones a run into the queue;
    // the template itself never queues. Complete retires the schedule.
    return `<button data-act="queue" data-id="${item.workid}" role="menuitem">Run Now</button>
      <button data-act="pause" data-id="${item.workid}" role="menuitem">Pause Schedule</button>
      <button data-act="pauseedit" data-id="${item.workid}" role="menuitem">Pause &amp; Edit</button>
      <button data-act="complete" data-id="${item.workid}" role="menuitem">Complete (retire schedule)</button>
      <button data-act="clone" data-id="${item.workid}" role="menuitem">Clone</button>
      <div class="sep"></div>
      <span class="note">Run Now clones this schedule into a queued run (skipped if one is still open).</span>
      <button class="danger" data-act="delete" data-id="${item.workid}" role="menuitem">Delete</button>`;
  }
  const b = [];
  if (s === 'todo' || s === 'paused') b.push(['queue','Queue']);
  if ((s === 'todo' || s === 'paused') && item.sched && item.sched.kind) b.push(['schedule','Resume Schedule']);
  if (s === 'failed') b.push(['queue','Requeue (Retry)']);
  if (s !== 'complete') { b.push(['complete','Complete']); b.push(['pauseedit','Pause &amp; Edit']); }
  if (s === 'complete') b.push(['followup','Create Follow-up Request']);
  b.push(['clone','Clone']);
  const rows = b.map(([a,l]) => `<button data-act="${a}" data-id="${item.workid}" role="menuitem">${l}</button>`);
  rows.push('<div class="sep"></div>');
  rows.push(`<button class="danger" data-act="delete" data-id="${item.workid}" role="menuitem">Delete</button>`);
  return rows.join('');
}

function render(){ renderSummary(); renderRows(); }

/* ------------------------------------------------------------------ toast */
let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ------------------------------------------------------------------ lightboxes */

function openLb(title, bodyHtml, footHtml){
  $('lbTitle').textContent = title;
  $('lbBody').innerHTML = bodyHtml;
  $('lbFoot').innerHTML = footHtml || '<button class="btn" data-lbclose>Close</button>';
  $('overlay').classList.add('open');
}
function closeLb(){ $('overlay').classList.remove('open'); if (typeof lbStack !== 'undefined') lbStack = []; }

function fakeGroups(item){
  if (!item.tests) return [];
  const half = Math.floor(item.tests.total/2);
  return [
    { label:'default greeting', lastrun:item.times.mainworkdone||item.times.added, result:'passed', counts:'2/2', testlist:['testscript01.sh'] },
    { label:'named greeting', lastrun:item.times.mainworkdone||item.times.added, result:'passed', counts:'3/3', testlist:['testscript02.sh'] },
    { label:'contract', lastrun:item.times.mainworkdone||item.times.added,
      result: item.tests.passed === item.tests.total ? 'passed' : 'failed',
      counts:`${item.tests.passed - 5}/${item.tests.total - 5}`, testlist:['testscript03.sh','testscript05.sh'] },
    { label:'shout', lastrun:item.times.mainworkdone||item.times.added, result:'passed', counts:`${Math.min(half,20)}/${Math.min(half,20)}`, testlist:['testscript04.sh'] },
  ];
}

function lbTests(item){
  if (LIVE) {
    api(`/api/workitems/${item.workid}/tests`).then(data => {
      const files = data.testfiles || [];
      if (!files.length || files.every(f => !f.groups.length)) {
        return openLb('Test Details — ' + shortId(item),
          `<p style="color:var(--text-dim)">No test groups found for this work item's testfiles. Groups live in <span class="mono">*testgroup.iter.md</span> files declared by each marker file.</p>`);
      }
      const rows = files.flatMap(f => f.groups.map(g => {
        const ok = g.result === 'passed';
        return `<tr><td><b>${esc(g.label)}</b></td>
          <td><span class="chip" style="background:${ok?'var(--s-complete-bg)':(g.result?'var(--s-failed-bg)':'var(--surface2)')};color:${g.result?'#fff':'var(--text-dim)'}">${esc(g.result || 'never run')}</span></td>
          <td class="mono">${esc(g.counts || '–')}</td><td class="mono">${esc(g.lastrun ? fmtTs(g.lastrun) : '–')}</td>
          <td class="mono">${(g.testlist||[]).map(t => esc(typeof t === 'string' ? t : t.shell || t.id)).join(', ')}</td></tr>`;
      })).join('');
      openLb('Test Details — ' + shortId(item),
        `<table class="t"><thead><tr><th>Group</th><th>Result</th><th>Counts</th><th>Last run</th><th>Scripts</th></tr></thead><tbody>${rows}</tbody></table>
         <p style="color:var(--text-dim);font-size:12px;margin-bottom:0">Source: <span class="mono">${files.map(f=>esc(f.file)).join(' · ')}</span></p>`);
    }).catch(e => toast('Tests: ' + e.message));
    return;
  }
  const groups = fakeGroups(item);
  if (!groups.length) return openLb('Test Details — ' + shortId(item),
    `<p style="color:var(--text-dim)">No test results recorded for this work item yet. The engine stamps results from <span class="mono">*testgroup.iter.md</span> files at close-out.</p>`);
  const rows = groups.map(g => {
    const ok = g.result === 'passed';
    return `<tr>
      <td><b>${esc(g.label)}</b></td>
      <td><span class="chip" style="background:${ok?'var(--s-complete-bg)':'var(--s-failed-bg)'};color:#fff">${g.result}</span></td>
      <td class="mono">${esc(g.counts)}</td>
      <td class="mono">${esc(fmtTs(g.lastrun))}</td>
      <td class="mono">${g.testlist.map(esc).join(', ')}</td></tr>`;
  }).join('');
  openLb('Test Details — ' + shortId(item),
    `<table class="t"><thead><tr><th>Group</th><th>Result</th><th>Counts</th><th>Last run</th><th>Scripts</th></tr></thead><tbody>${rows}</tbody></table>
     <p style="color:var(--text-dim);font-size:12px;margin-bottom:0">Source: <span class="mono">${item.testfiles.map(esc).join(' · ')}</span></p>`);
}

function dur(a,b){
  if (!a || !b) return '';
  const ms = new Date(b) - new Date(a);
  if (ms < 0) return '';
  const s = Math.round(ms/1000);
  if (s < 90) return s + 's';
  if (s < 5400) return Math.round(s/60) + 'm ' + (s%60) + 's';
  return (s/3600).toFixed(1) + 'h';
}

function lbTimes(item){
  const t = item.times;
  const steps = [
    ['Added', t.added, ''],
    ['Started', t.start, dur(t.added, t.start) && `waited ${dur(t.added,t.start)} in queue`],
    ['Prework done', t.preworkdone, dur(t.start,t.preworkdone) && `prework ${dur(t.start,t.preworkdone)}`],
    ['Mainwork done', t.mainworkdone, dur(t.preworkdone,t.mainworkdone) && `mainwork ${dur(t.preworkdone,t.mainworkdone)}`],
    ['Postwork done', t.postworkdone, dur(t.mainworkdone,t.postworkdone) && `postwork ${dur(t.mainworkdone,t.postworkdone)}`],
    ['Closed', t.closed, dur(t.added,t.closed) && `total ${dur(t.added,t.closed)}`],
  ];
  const rows = steps.map(([label, ts, note]) =>
    `<div class="tl"><span class="st">${label}</span><span class="ts" title="${ts ? `Stored UTC: ${esc(ts)}` : ''}">${ts ? esc(fmtTs(ts)) : '—'}</span><span class="du">${note||''}</span></div>`).join('');
  openLb('Time Records — ' + shortId(item),
    `<div class="timeline">${rows}</div>
     <p style="color:var(--text-dim);font-size:12px;margin-bottom:0">Attempts: <b>${item.attempts}</b>${item.lasterror ? ` · last error: <span class="mono">${esc(item.lasterror)}</span>` : ''}</p>`);
}

function lbContext(item){
  const resolved = item.context.map(p => p.replace('./', PROJECT_ROOT + '/').replace('~/', HOME + '/'));
  openLb('Context and Prompts — ' + shortId(item), `
    <h4 style="margin:0 0 6px">Context patterns → resolved files</h4>
    <table class="t"><tbody>${item.context.map((p,i) =>
      `<tr><td class="mono">${esc(p)}</td><td class="mono" style="color:var(--text-dim)">${esc(resolved[i])}</td></tr>`).join('')}</tbody></table>
    <h4 style="margin:16px 0 6px">Source instructions applied</h4>
    <p style="margin:0" class="mono" style="font-size:12px">.iter/source/${item.source==='user'?'user':(item.source==='error'?'error':'agent')}.md${item.source.startsWith('agent') ? ` <span style="color:var(--text-dim)">({type} = ${esc(sourceLabel(item.source).toLowerCase())})</span>`:''}</p>
    <h4 style="margin:16px 0 6px">Composed turn sequence</h4>
    <table class="t"><thead><tr><th>#</th><th>Turn</th><th>Prompt source</th></tr></thead><tbody>
      ${[
        ...item.prework.map((p,i)=>[`${i+1}`, prepostNames().includes(p)?`prework:${p}`:'prework:inline', prepostNames().includes(p)?`.iter/prepostwork/${p}.${prepostExec(p)==='shell'?'sh':'md'}`:'inline literal from work item']),
        [`${item.prework.length+1}`, 'mainwork (+ spin-up on first turn)', 'work item request + agent definition + source instructions + context list'],
        ...item.postwork.map((p,i)=>[`${item.prework.length+2+i}`, `postwork:${p}`, `.iter/prepostwork/${p}.${prepostExec(p)==='shell'?'sh':'md'}`]),
        [`${item.prework.length+item.postwork.length+2}`, 'selfcheck', 'engine-composed: re-read agent definition, confirm completion'],
      ].map(([n,t2,s]) => `<tr><td class="mono">${n}</td><td><b>${esc(t2)}</b></td><td style="color:var(--text-dim)">${esc(s)}</td></tr>`).join('')}
    </tbody></table>`);
}

function lbLogs(item){
  if (LIVE) {
    api(`/api/workitems/${item.workid}/logs`).then(data => {
      const text = (data.lines && data.lines.length)
        ? data.lines.join('\n')
        : '(no engine log lines for this item yet — logging may be disabled, or it has not been picked up)';
      openLb('Engine Logs — ' + shortId(item),
        `<div class="textblock mono" style="max-height:52vh">${esc(text)}</div>`);
    }).catch(e => toast('Logs: ' + e.message));
    return;
  }
  const tag = `${item.type}#${(seq % 7) + 1}`;
  const lines = [];
  const push = (ts, lvl, msg) => ts && lines.push(`${fmtTimeOnly(ts)} ${lvl}  [${tag}]  ${msg}`);
  push(item.times.start, 'INFO ', `picked ${shortId(item)} "${item.title.slice(0,44)}…" (prio ${item.priority}, source ${item.source}, attempt ${item.attempts||1})`);
  push(item.times.start, 'INFO ', `codepath lock acquired: ${item.codepath}`);
  item.prework.forEach(p => push(item.times.preworkdone, 'INFO ', `prework:${prepostNames().includes(p)?p:'inline(…)'} done`));
  push(item.times.mainworkdone, 'INFO ', 'mainwork done');
  item.postwork.forEach(p => push(item.times.postworkdone, 'INFO ', `postwork:${p} done`));
  if (item.state === 'failed') push(item.times.start, 'ERROR', item.lasterror || 'mainwork failed');
  if (item.state === 'complete') push(item.times.closed, 'INFO ', `complete → workitems_closed.jsonl; lock released (${shortId(item)})`);
  if (!lines.length) lines.push('(no engine activity yet — item has not been picked up)');
  openLb('Engine Logs — ' + shortId(item),
    `<div class="textblock mono" style="max-height:52vh">${esc(lines.join('\n'))}</div>`);
}

/* ------------------------------------------------------------------ edit / create form */

let draft = null;   // { mode:'create'|'edit'|'clone'|'followup', base:workid|null, data:{...} }

function openForm(mode, source, priorState){
  // create with a source = prefilled create (e.g. Create WorkItem from a Projects node)
  const d = source ? JSON.parse(JSON.stringify(source)) : mk({});
  if (mode === 'create' && !source) d.context = literalContextLines();
  if (mode === 'clone') { d.workid = uuid(); d.state='todo'; d.attempts=0; d.output=''; d.tests=null; d.lasterror='';
    d.times = { added:nowIso(), start:'', preworkdone:'', mainworkdone:'', postworkdone:'', closed:'' }; }
  if (mode === 'followup') {
    const parent = source;
    Object.assign(d, mk({ title:'Follow-up: ' + parent.title.slice(0,60), type:parent.type,
      codepath:parent.codepath, codepath_ignore:(parent.codepath_ignore||[]).slice(),
      context:parent.context.slice(), testfiles:parent.testfiles.slice(),
      mainwork:`Follow-up to ${shortId(parent)} ("${parent.title.slice(0,60)}").\n\n` , source:'user' }));
  }
  draft = { mode, base: mode==='edit' ? source.workid : null, data: d };
  const titleMap = { create:'New WorkItem', edit:'Edit WorkItem — ' + shortId(d), clone:'Clone WorkItem', followup:'Create Follow-up Request' };

  const agentOpts = AGENTS.map(a => `<option value="${a}" ${d.type===a?'selected':''}>${a}</option>`).join('');
  const srcOpts = ['user','error','scheduler',...AGENTS.map(a=>'agent: '+a)]
    .map(s => `<option value="${esc(s)}" ${d.source===s?'selected':''}>${esc(s)}</option>`).join('');

  openLb(titleMap[mode], `
    <div class="form" id="editForm">
      <span class="flabel">Title</span>
      <input type="text" id="f_title" value="${esc(d.title)}" placeholder="Short description, 20–40 chars">
      <span class="flabel">Agent</span>
      <div class="inline">
        <select id="f_type">${agentOpts}</select>
        <select id="f_exec" title="Executor — agent: a claude session does the work (LLM). shell: the engine runs prework/mainwork/postwork as shell commands directly, no LLM.">
          <option value="agent" ${(d.exec||'agent')!=='shell'?'selected':''}>exec: agent (LLM)</option>
          <option value="shell" ${d.exec==='shell'?'selected':''}>exec: shell (engine-run)</option>
        </select>
        <label>Priority <input type="range" id="f_priority" min="0" max="10" value="${d.priority}"
          oninput="document.getElementById('pv').textContent=this.value"><span class="rangeval" id="pv">${d.priority}</span></label>
        <label>Risk <input type="range" id="f_risk" min="0" max="10" value="${d.risk}"
          oninput="document.getElementById('rv').textContent=this.value"><span class="rangeval" id="rv">${d.risk}</span></label>
      </div>
      <span class="flabel">Source</span>
      <div class="inline"><select id="f_source">${srcOpts}</select>
        <span style="color:var(--text-dim);font-size:12px">who requested this work — <b>scheduler</b> makes this a schedule template</span></div>
      <span class="flabel" id="f_schedlabel" style="display:none">Schedule</span>
      <div id="f_schedrow" style="display:none">
        <div class="inline">
          <select id="f_sk">
            <option value="every" ${(d.sched&&d.sched.kind)==='every'?'selected':''}>every NN minutes</option>
            <option value="daily" ${(d.sched&&d.sched.kind)==='daily'?'selected':''}>every day at HH:MM</option>
            <option value="weekly" ${(d.sched&&d.sched.kind)==='weekly'?'selected':''}>weekly on a day at HH:MM</option>
            <option value="stale" ${(d.sched&&d.sched.kind)==='stale'?'selected':''}>when not run in NN minutes</option>
          </select>
          <label id="f_sk_every">NN <input type="number" id="f_severy" min="1" style="width:80px" value="${(d.sched&&d.sched.every_min)||60}"> min</label>
          <label id="f_sk_day" style="display:none">on <select id="f_sday">${['mon','tue','wed','thu','fri','sat','sun'].map(x=>`<option ${(d.sched&&d.sched.day)===x?'selected':''}>${x}</option>`).join('')}</select></label>
          <label id="f_sk_at" style="display:none">at <input type="text" id="f_sat" class="mono" style="width:70px" placeholder="HH:MM" value="${esc((d.sched&&d.sched.at)||'02:00')}"></label>
          <label id="f_sk_tz" style="display:none">tz <input type="text" id="f_stz" class="mono" style="width:180px" placeholder="${esc(USER_TZ)} (preferences)" value="${esc((d.sched&&d.sched.tz)||'')}"></label>
        </div>
        <div class="pathhint" style="opacity:.75">minute granularity (itersched checks every 59s) · daily/weekly occurrences missed while the server was down are skipped, never backfilled · each run is a CLONE queued at this item’s priority · one open run at a time — a still-open run suppresses the next fire</div>
      </div>
      <span class="flabel">CodePath</span>
      <div>
        <input type="text" id="f_codepath" class="mono" value="${esc(d.codepath)}"
          placeholder="relative (./src) or absolute — resolved to absolute on save">
        <div class="pathhint" id="f_pathhint">→ ${esc(absCodepath(d.codepath))}</div>
      </div>
      <span class="flabel top-align">CodePath ignore</span>
      <div>
        <textarea id="f_codepath_ignore" rows="1" style="width:100%" class="mono"
          placeholder="subtrees carved OUT of the lock scope — one .gitignore-style pattern per line, relative to CodePath (e.g. test/)">${esc((d.codepath_ignore||[]).join('\n'))}</textarea>
        <div class="pathhint" style="opacity:.75">this item won’t lock or touch these subtrees, so another work item can own them in parallel (e.g. code ignores <span class="mono">test/</span> while a testwriter locks it)</div>
      </div>
      <span class="flabel top-align">Context</span>
      <div>
        <textarea id="f_context" rows="2" style="width:100%" placeholder="one path or glob per line">${esc(d.context.join('\n'))}</textarea>
        <div class="pathhint" id="f_ctxhint"></div>
        <div class="pathhint" style="opacity:.75">one rule: globs ok anywhere · relative = from code_root (Settings; default = where .iter lives) · ~ = home · {codepath} = this work item’s code</div>
      </div>
      <span class="flabel top-align">Test files</span>
      <div>
        <textarea id="f_testfiles" rows="1" style="width:100%">${esc(d.testfiles.join('\n'))}</textarea>
        <div class="pathhint" id="f_tfhint"></div>
      </div>
      <span class="flabel top-align">Prework</span>
      <div>${pillRow(d.prework, true, 'prework')}
        <input type="text" id="f_prelit" class="mono" style="margin-top:7px;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--text)"
          placeholder="…or type an inline literal prework step and press Enter"></div>
      <span class="flabel top-align">Request</span>
      <textarea id="f_mainwork" rows="7" placeholder="The mainwork prompt: exactly what needs to be done, acceptance criteria included.">${esc(d.mainwork)}</textarea>
      <span class="flabel top-align">Postwork</span>
      <div>${pillRow(d.postwork, true, 'postwork')}
        <input type="text" id="f_postlit" class="mono" style="margin-top:7px;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--text)"
          placeholder="…or type an inline literal postwork step and press Enter"></div>
    </div>`,
    (() => {
      // Default target state: new items default to queued; pause & edit defaults to the
      // item's state before pausing. Scheduler-sourced items can only land in
      // scheduled|paused (syncSched below rewrites the options live).
      const SAVE_STATES = [['queued','Queued'],['todo','ToDo'],['paused','Paused']];
      const def = mode === 'edit'
        ? (SAVE_STATES.some(([v]) => v === priorState) ? priorState : 'queued')
        : 'queued';
      const opts = SAVE_STATES.map(([v,l]) => `<option value="${v}" ${v===def?'selected':''}>${l}</option>`).join('');
      return `<span style="margin-right:auto;color:var(--text-dim);font-size:12.5px">Saves the work item into the selected state — <b>Queued</b> is immediately eligible.</span>
         <button class="btn" data-lbclose>Cancel</button>
         <span class="savegroup">
           <button class="btn primary" id="saveGo">${mode === 'edit' ? 'Save and set to' : 'Create and set to'}</button>
           <select id="f_savestate" aria-label="State to save the work item into">${opts}</select>
         </span>`;
    })());

  $('f_prelit').addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); addLit('prework', e.target); }});
  $('f_postlit').addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); addLit('postwork', e.target); }});
  $('f_codepath').addEventListener('input', e => { $('f_pathhint').textContent = '→ ' + absCodepath(e.target.value); });
  // Scheduler source: reveal the schedule fields, restrict the save-state options
  // to scheduled|paused, and nudge default priority to 8 ("run soon after the
  // scheduled time"). All reversible by switching Source back.
  const syncSched = () => {
    const isSched = $('f_source').value === 'scheduler';
    $('f_schedlabel').style.display = isSched ? '' : 'none';
    $('f_schedrow').style.display = isSched ? '' : 'none';
    const kind = $('f_sk').value;
    $('f_sk_every').style.display = (kind === 'every' || kind === 'stale') ? '' : 'none';
    $('f_sk_day').style.display = kind === 'weekly' ? '' : 'none';
    $('f_sk_at').style.display = (kind === 'daily' || kind === 'weekly') ? '' : 'none';
    $('f_sk_tz').style.display = (kind === 'daily' || kind === 'weekly') ? '' : 'none';
    const cur = $('f_savestate').value;
    const opts = isSched ? [['scheduled','Scheduled'],['paused','Paused']]
                         : [['queued','Queued'],['todo','ToDo'],['paused','Paused']];
    const def = opts.some(([v]) => v === cur) ? cur
      : isSched ? (priorState === 'paused' ? 'paused' : 'scheduled')
      : (mode === 'edit' && opts.some(([v]) => v === priorState) ? priorState : 'queued');
    $('f_savestate').innerHTML = opts.map(([v,l]) => `<option value="${v}" ${v===def?'selected':''}>${l}</option>`).join('');
    if (isSched && +$('f_priority').value === 5) { $('f_priority').value = 8; document.getElementById('pv').textContent = '8'; }
  };
  $('f_source').addEventListener('change', syncSched);
  $('f_sk').addEventListener('change', syncSched);
  syncSched();
  wirePathHints('f_context', 'f_ctxhint', 'f_codepath');
  wirePathHints('f_testfiles', 'f_tfhint', 'f_codepath');
  $('saveGo').addEventListener('click', () => saveDraft($('f_savestate').value));
}

function addLit(phase, input){
  const v = input.value.trim();
  if (!v) return;
  draft.data[phase].push(v);
  input.closest('div').querySelector('.pills').insertAdjacentHTML('beforeend',
    `<span class="pill on inline-lit" title="Inline literal step: ${esc(v)}">“${esc(v)}”</span>`);
  input.value = '';
}

function saveDraft(targetState){
  const d = draft.data;
  d.title = $('f_title').value.trim() || '(untitled work item)';
  d.type = $('f_type').value;
  d.priority = +$('f_priority').value;
  d.risk = +$('f_risk').value;
  d.source = $('f_source').value;
  d.codepath = absCodepath($('f_codepath').value);   // entered relative, stored absolute
  d.codepath_ignore = $('f_codepath_ignore').value.split('\n').map(s=>s.trim()).filter(Boolean);
  d.context = $('f_context').value.split('\n').map(s=>s.trim()).filter(Boolean);
  d.testfiles = $('f_testfiles').value.split('\n').map(s=>s.trim()).filter(Boolean);
  d.mainwork = $('f_mainwork').value;
  d.exec = $('f_exec').value;
  if ($('f_source').value === 'scheduler') {
    d.sched = { kind: $('f_sk').value, every_min: +$('f_severy').value || 0,
      at: $('f_sat').value.trim(), day: $('f_sday').value, tz: $('f_stz').value.trim(),
      last_fired: (d.sched && d.sched.last_fired) || '' };
  } else {
    d.sched = { kind:'', every_min:0, at:'', day:'', tz:'', last_fired:'' };
  }

  if (LIVE) {
    const mode = draft.mode;
    const done = () => { draft = null; closeLb(); return loadAll(); };
    if (mode === 'edit') {
      const fields = { title: d.title, type: d.type, priority: d.priority, risk: d.risk,
        source: d.source, codepath: d.codepath, codepath_ignore: d.codepath_ignore,
        context: d.context, testfiles: d.testfiles,
        prework: d.prework, postwork: d.postwork, mainwork: d.mainwork,
        exec: d.exec, sched: d.sched };
      const stateAction = targetState === 'queued' ? 'queue' : targetState === 'todo' ? 'todo'
        : targetState === 'scheduled' ? 'schedule' : 'pause';
      api(`/api/workitems/${draft.base}`, { method: 'PATCH', body: JSON.stringify(fields) })
        .then(() => postAction(draft.base, stateAction))
        .then(() => { toast(`Saved as ${targetState}`); return done(); })
        .catch(e => toast('Save failed: ' + e.message));
    } else {
      d.state = targetState;
      const what = mode === 'followup' ? 'Follow-up' : mode === 'clone' ? 'Clone' : 'WorkItem';
      api('/api/workitems', { method: 'POST', body: JSON.stringify(d) })
        .then(r => {
          toast(r.warning ? `${what} created — warning: ${r.warning}` : `${what} created as ${targetState}`);
          return done();
        })
        .catch(e => toast('Create failed: ' + e.message));
    }
    return;
  }

  d.state = targetState;
  if (draft.mode === 'edit') {
    const idx = items.findIndex(i => i.workid === draft.base);
    items[idx] = d;
    toast(`Saved as ${targetState}`);
  } else {
    items.unshift(d);
    openIds.add(d.workid);
    const what = draft.mode === 'followup' ? 'Follow-up' : draft.mode === 'clone' ? 'Clone' : 'WorkItem';
    toast(`${what} created as ${targetState}`);
  }
  draft = null;
  closeLb(); render();
}

/* ------------------------------------------------------------------ actions */

async function postAction(id, action){
  return api(`/api/workitems/${id}/action`, { method: 'POST', body: JSON.stringify({ action }) });
}

function doAction(act, id){
  const item = items.find(i => i.workid === id);
  if (!item) return;
  if (LIVE) {
    // Clone and follow-up stay client-side (they open the prefilled form; the POST
    // happens on save). Everything else is a server action + reload.
    if (act === 'clone') { openForm('clone', item); return; }
    if (act === 'followup') { openForm('followup', item); return; }
    if (act === 'delete') {
      openLb('Delete work item?', `
        <p style="margin-top:0">This permanently removes <b>${esc(item.title)}</b>
        <span class="mono">(${shortId(item)})</span> from the queue. The engine keeps no copy.</p>`,
        `<button class="btn" data-lbclose>Cancel</button>
         <button class="btn danger" id="confirmDelete">Delete</button>`);
      $('confirmDelete').addEventListener('click', () => {
        postAction(id, 'delete').then(() => { closeLb(); toast('Deleted'); return loadAll(); })
          .catch(e => toast('Delete failed: ' + e.message));
      });
      return;
    }
    if (act === 'pauseedit') {
      const prior = item.state;
      postAction(id, 'pause')
        .then(() => loadAll())
        .then(() => {
          const fresh = items.find(i => i.workid === id);
          if (fresh) openForm('edit', fresh, prior);
        })
        .catch(e => toast('Pause failed: ' + e.message));
      return;
    }
    const serverAction = act === 'queue' ? 'queue' : act === 'complete' ? 'complete' : act;
    postAction(id, serverAction)
      .then(r => { toast(r.fired ? `Run queued (${String(r.workid).slice(0,8)}) — schedule unchanged` : `${shortId(item)} → ${r.state}`); return loadAll(); })
      .catch(e => toast('Action failed: ' + e.message));
    return;
  }
  switch (act) {
    case 'queue':
      if (item.state === 'scheduled') {
        // mock of the engine's clone-and-queue semantics
        const c = JSON.parse(JSON.stringify(item));
        c.workid = uuid(); c.state = 'queued'; c.source = 'scheduler';
        c.source_schedule = item.workid; c.sched = null; c.attempts = 0; c.output = '';
        c.times = { added: nowIso(), start:'', preworkdone:'', mainworkdone:'', postworkdone:'', closed:'' };
        item.sched.last_fired = nowIso();
        items.unshift(c);
        toast(`Run queued (${shortId(c)}) — schedule unchanged`); break;
      }
      item.state = 'queued'; item.lasterror = '';
      toast(`Queued ${shortId(item)}`); break;
    case 'pause':
      item.state = 'paused';
      toast(`Paused ${shortId(item)}`); break;
    case 'schedule':
      item.state = 'scheduled';
      toast(`Schedule resumed for ${shortId(item)}`); break;
    case 'complete':
      item.state = 'complete'; item.times.closed = nowIso();
      toast(`Marked ${shortId(item)} complete`); break;
    case 'pauseedit': {
      const prior = item.state;
      item.state = 'paused'; render();
      openForm('edit', item, prior);
      toast(`Paused ${shortId(item)} for editing`); return;
    }
    case 'clone':
      openForm('clone', item); return;
    case 'followup':
      openForm('followup', item); return;
    case 'delete':
      openLb('Delete work item?', `
        <p style="margin-top:0">This permanently removes <b>${esc(item.title)}</b>
        <span class="mono">(${shortId(item)})</span> from the queue. The engine keeps no copy.</p>`,
        `<button class="btn" data-lbclose>Cancel</button>
         <button class="btn danger" id="confirmDelete">Delete</button>`);
      $('confirmDelete').addEventListener('click', () => {
        items = items.filter(i => i.workid !== id);
        openIds.delete(id);
        closeLb(); render(); toast('Deleted');

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-rowclick]');

  // close any open action menu when clicking elsewhere
  if (!e.target.closest('.actmenu') && !e.target.closest('[data-actions]')) {
    document.querySelectorAll('.actmenu.open').forEach(m => m.classList.remove('open'));
  }
  if (!t) return;

  if (t.dataset.filter) {
    const f = t.dataset.filter;
    if (f === 'total') activeFilters.clear();
    else activeFilters.has(f) ? activeFilters.delete(f) : activeFilters.add(f);
    render(); return;
  }
  if (t.dataset.actions) {
    const menu = document.querySelector(`[data-menu="${t.dataset.actions}"]`);
    const was = menu.classList.contains('open');
    document.querySelectorAll('.actmenu.open').forEach(m => m.classList.remove('open'));
    if (!was) menu.classList.add('open');
    return;
  }
  if (t.dataset.act) { doAction(t.dataset.act, t.dataset.id); return; }
  if (t.dataset.lb) {
    const item = items.find(i => i.workid === t.dataset.id);
    ({tests:lbTests, times:lbTimes, context:lbContext, logs:lbLogs})[t.dataset.lb](item);
    return;
  }
  if (t.dataset.toggle && draft) {
    const list = draft.data[t.dataset.toggle];
    const name = t.dataset.name;
    const i = list.indexOf(name);
    i >= 0 ? list.splice(i,1) : list.push(name);
    t.classList.toggle('on', i < 0);
    return;
  }
  if (t.hasAttribute('data-lbclose') || t.id === 'lbClose') { draft = null; closeLb(); return; }
  if (t.id === 'collapseAll') { openIds.clear(); render(); return; }
  if (t.id === 'newItem') { openForm('create', null); return; }
  if (t.id === 'engineChip' || t.closest('#engineChip')) {
    if (LIVE) {
      const action = engineRunning ? 'pause' : 'resume';
      api('/api/engine', { method: 'POST', body: JSON.stringify({ action }) })
        .then(() => { toast(action === 'pause' ? 'Engine draining: finishing in-flight work' : 'Engine resumed'); refreshEngine(); })
        .catch(e => toast('Engine: ' + e.message));
      return;
    }
    engineRunning = !engineRunning;
    const chip = $('engineChip');
    chip.dataset.engine = engineRunning ? 'running' : 'paused';
    $('engineState').textContent = engineRunning ? 'Running' : 'Paused';
    toast(engineRunning ? 'Engine resumed (stop.signal cleared)' : 'Engine pausing (drain): finishing in-flight work');
    return;
  }

  const rowId = t.dataset.rowclick;
  if (rowId && !e.target.closest('.actwrap')) {
    openIds.has(rowId) ? openIds.delete(rowId) : openIds.add(rowId);
    render(); return;
  }
});

/* Fake 14-day history — in the wired version this is GET /api/history?days=14,
   computed server-side from workitems_closed.jsonl. */
const HIST = {
  comp: [18,22,25,19,28,31,24,27,33,29,35,38,32,41],
  fail: [ 2, 1, 0, 3, 1, 2, 1, 0, 2, 1, 1, 3, 0, 1],

function histLabels(){
  const out = [];

/* single-series bar panel: thin marks, faint grid, hover tooltip, table view */
function barPanel(title, sub, data, labels, color, height){
  const W = 640, H = height, padL = 30, padB = 18, padT = 8;
  const max = Math.max(...data, 1);
  const step = (W - padL) / data.length;
  const bw = Math.min(step * 0.66, 34);
  const ticks = [0, Math.round(max/2), max];
  const gy = v => padT + (H - padT - padB) * (1 - v / max);
  const grid = ticks.map(v => `<line x1="${padL}" x2="${W}" y1="${gy(v)}" y2="${gy(v)}"/>`).join('');
  const ylab = ticks.map(v => `<text x="${padL-6}" y="${gy(v)+3}" text-anchor="end">${v}</text>`).join('');
  const bars = data.map((v,i) => {
    const x = padL + i*step + (step-bw)/2, y = gy(v);
    return `<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}"
      height="${Math.max(H - padB - y, 1).toFixed(1)}" rx="2" fill="${color}"
      data-tip="${labels[i]}: ${v}"></rect>`;
  }).join('');
  const xlab = labels.map((l,i) => i % 2 ? '' :
    `<text x="${(padL + i*step + step/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${l}</text>`).join('');
  const tableRows = labels.map((l,i) => `<tr><td>${l}</td><td class="mono">${data[i]}</td></tr>`).join('');
  return `<div class="panel"><h3>${title}</h3><div class="sub">${sub}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">
      <g class="chartgrid">${grid}</g><g class="chartaxis">${ylab}${xlab}</g>${bars}
    </svg>
    <details><summary>View as table</summary>
      <table class="t"><thead><tr><th>Day</th><th>Count</th></tr></thead><tbody>${tableRows}</tbody></table>
    </details></div>`;
}

let dashWindow = { days: 14, start: '', end: '' };

function mockHistory(){
  const labels = histLabels();
  return {
    days: HIST.comp.map((c, i) => ({ date: '2026-08-' + labels[i].split('/')[1], complete: c, failed: HIST.fail[i] })),
    by_agent: Object.fromEntries(HIST.byAgent),
    tiles: { spend_today_usd: 12.34, budget_usd_per_day: 50, success_pct: 97, per_hour: 1.4, median_cycle_sec: 1440, running: items.filter(i => i.state === 'in-progress').length, open: items.length, handoff_pct: 38 },
  };
}

function fmtCycle(sec){
  if (!sec) return '–';
  if (sec < 120) return `${sec}<small>s</small>`;
  if (sec < 7200) return `${Math.round(sec/60)}<small>m</small>`;
  return `${(sec/3600).toFixed(1)}<small>h</small>`;
}

async function renderDashboard(){
  let data;
  if (LIVE) {
    try {
      const q = dashWindow.start && dashWindow.end
        ? `start=${dashWindow.start}&end=${dashWindow.end}` : `days=${dashWindow.days}`;
      data = await api('/api/history?' + q);
    } catch (e) {
      $('view-dashboard').innerHTML = `<div class="empty">API error: ${esc(e.message)}</div>`;
      return;
    }
  } else {
    data = mockHistory();
  }
  const comp = data.days.map(d => d.complete);
  const fail = data.days.map(d => d.failed);
  const labels = data.days.map(d => { const p = d.date.split('-'); return `${+p[1]}/${p[2]}`; });
  const t = data.tiles;
  const cAll = comp.reduce((a,b)=>a+b,0), fAll = fail.reduce((a,b)=>a+b,0);
  const windowLabel = `${data.days.length} days`;
  const tiles = [
    [`$${(t.spend_today_usd ?? 0).toFixed(2)}`,
      t.budget_usd_per_day > 0
        ? `Spend today · auto-drains at $${t.budget_usd_per_day.toFixed(0)}`
        : 'Spend today · no budget set (Settings → max_cost_usd_per_day)'],
    [`${t.success_pct}<small>%</small>`, `Success rate · window`],
    [`${t.per_hour < 0.1 && t.per_hour > 0 ? t.per_hour.toFixed(2) : t.per_hour.toFixed(1)}<small>/hr</small>`, 'Completions per hour · window avg'],
    [fmtCycle(t.median_cycle_sec), 'Median cycle time · added → closed'],
    [`${t.running}`, 'Agents running now'],
    [`${t.open}`, 'Open work items'],
    [`${t.handoff_pct}<small>%</small>`, 'Agent-created handoffs · share of closed'],
  ];
  const byAgent = Object.entries(data.by_agent).sort((a,b) => b[1]-a[1]);
  const agentMax = Math.max(1, ...byAgent.map(a => a[1]));
  $('view-dashboard').innerHTML = `
    <div class="projtools" style="margin-bottom:10px">
      <label>Window:
        <select id="dashDays">
          ${[7,14,30].map(d => `<option value="${d}" ${dashWindow.days===d && !dashWindow.start ? 'selected':''}>${d} days</option>`).join('')}
        </select></label>
      <label>or <input type="date" id="dashStart" value="${dashWindow.start}"> – <input type="date" id="dashEnd" value="${dashWindow.end}"></label>
      <button class="btn" id="dashApply">Apply range</button>
    </div>
    <div class="tiles">${tiles.map(([n,l]) => `<div class="tile"><div class="tn">${n}</div><div class="tl2">${l}</div></div>`).join('')}</div>
    <div class="dashsplit">
      <div>
        ${barPanel('Completions per day', `${windowLabel} · ${cAll} closed complete`, comp, labels, 'var(--s-complete-bg)', 170)}
        ${barPanel('Failures per day', `${windowLabel} · ${fAll} closed failed (kept separate from completions — the pair isn't colorblind-safe stacked)`, fail, labels, 'var(--s-failed-bg)', 96)}
      </div>
      <div class="panel"><h3>Completions by agent</h3><div class="sub">${windowLabel}</div>
        ${byAgent.length ? byAgent.map(([name,v]) =>
          `<div class="hbar"><span class="hname">${esc(name)}</span><div class="htrack"><div class="hfill" style="width:${Math.round(100*v/agentMax)}%"></div></div><span class="hval">${v}</span></div>`).join('')
          : '<div class="empty" style="padding:14px 0">no completions in this window</div>'}
      </div>
    </div>`;
  $('dashDays').addEventListener('change', e => { dashWindow = { days: +e.target.value, start: '', end: '' }; renderDashboard(); });
  $('dashApply').addEventListener('click', () => {
    const s = $('dashStart').value, en = $('dashEnd').value;
    if (s && en) { dashWindow = { days: 0, start: s, end: en }; renderDashboard(); }
    else toast('Pick both start and end dates');
  });
}

function tzSelectHtml(cfgKey, current){
  const all = typeof Intl.supportedValuesOf === 'function' ? Intl.supportedValuesOf('timeZone') : [];
  const commonIds = TZ_COMMON.map(([id]) => id);
  const opt = (id, label) => `<option value="${esc(id)}"${id === current ? ' selected' : ''}>${esc(label || id)}</option>`;
  const common = TZ_COMMON.map(([id, label]) => opt(id, id === 'UTC' ? 'UTC' : `${label} — ${id}`)).join('');
  const rest = all.filter(z => !commonIds.includes(z)).map(z => opt(z)).join('');
  // a saved value the browser doesn't list (or a typo) still shows up as selected
  const stray = current && !commonIds.includes(current) && !all.includes(current) ? opt(current) : '';
  return `<select data-cfg="${cfgKey}" data-num="false">${stray}
    <optgroup label="Common">${common}</optgroup>
    ${rest ? `<optgroup label="All timezones (IANA)">${rest}</optgroup>` : ''}</select>`;
}

  const cfgVal = (section, key, fallback) =>
    live && live[section] && live[section][key] !== undefined ? live[section][key] : fallback;

    return PS_MULTILINE.includes(key)
      ? `<div class="setrow wide"><label>${key}</label>
           <div><textarea rows="${value.split('\n').length + 1}" style="width:100%" data-ps="${key}" id="ps_${key}">${esc(value)}</textarea>
