      ? `<select data-ag="${k}"><option${v === 'true' ? ' selected' : ''}>true</option><option${v === 'false' ? ' selected' : ''}>false</option></select>`
      : `<input type="text" data-ag="${k}" data-num="${kind === 'num'}" value="${esc(v)}">`;
    return `<div class="setrow"><label>${k}</label>${input}<span class="why">${why}</span></div>`;
  }).join('');
  return rows + `
    <div class="setrow wide"><label>prompt body</label>
      <textarea rows="14" style="width:100%" data-ag="body">${esc(a.body || '')}</textarea></div>
    <div class="setrow wide"><span></span><span class="why">the markdown below the frontmatter — this agent's instructions</span></div>`;
}

function tzSelectHtml(cfgKey, current){
  const all = typeof Intl.supportedValuesOf === 'function' ? Intl.supportedValuesOf('timeZone') : [];
  const commonIds = TZ_COMMON.map(([id]) => id);
  const opt = (id, label) => `<option value="${esc(id)}"${id === current ? ' selected' : ''}>${esc(label || id)}</option>`;
  const common = TZ_COMMON.map(([id, label]) => opt(id, id === 'UTC' ? 'UTC' : `${label} — ${id}`)).join('');
  const rest = all.filter(z => !commonIds.includes(z)).map(z => opt(z)).join('');
  // a saved value the browser doesn't list (or a typo) still shows up as selected
  const stray = current && !commonIds.includes(current) && !all.includes(current) ? opt(current) : '';
  return `<select data-cfg="${cfgKey}" data-num="false">${stray}
    <optgroup label="Common">${common}</optgroup>
    ${rest ? `<optgroup label="All timezones (IANA)">${rest}</optgroup>` : ''}</select>`;
}

/* One running server per project; iterloop and iterapp are its two halves,
   and ONE Settings page serves both. Groups are organized by the QUESTION a
   user arrives with (identity, layout, context, automation, budget, testing,
   logging), never by which file stores a setting: data-cfg inputs save to
   .iter/.engine/config.json, data-ps inputs to the two head files. Save All
   writes everything. The last group is Advanced — engine internals, collapsed.
   Built lazily so CONFIG and PROJSET (declared elsewhere) are in scope. */
function settingsLayout(){
  const cfg = (section, key) => ({ src: 'cfg', section, key });
  const psi = (key) => ({ src: 'ps', key });
  return [
    ['Project', 'Identity and display: how this project names itself and shows timestamps',
      [psi('projectname'), psi('projectdescription'), cfg('globalsettings','user_timezone')]],
    ['Layout & discovery', 'Where everything lives: the head files, what gets scanned, and the directory conventions ({interfaces} / {usecases} / the per-component test dir)',
      [psi('topdir'), psi('mainfile'), psi('globalscandirs'), psi('globalinterfacedir'), psi('globalusecasedir'), cfg('globalsettings','test_dir')]],
    ['Agent context', 'What agents see and where they scratch: globalcontextfiles is ALWAYS loaded into every agent; default_context only prefills the Context field when a work item is created from a node (editable per item before filing)',
      [psi('globalcontextfiles'), psi('default_context'), cfg('globalsettings','temp_dir'), cfg('globalsettings','temp_file_ttl_days')]],
    ['Automation & queue', 'How work flows: automation default for new lineages, the critical-review budget, and queue caps/retries',
      ['default_automation','critreview_max_rounds'].map(k => cfg('globalsettings', k))
        .concat(['max_open_workitems','max_attempts','retry_backoff_sec'].map(k => cfg('engine', k)))],
    ['Budgets & throttling', 'Every "how much at once / how much money" knob: the daily spend cap, the agent ladder (base cap below 80% account usage, then the 80/90/95% rungs — usage is the max of the 5h and 7d windows, re-read every tick), shell workers, and the usage probe',
      [cfg('engine','max_cost_usd_per_day')]
        .concat(['max_total_agents','max_agents_at_80','max_agents_at_90','max_agents_at_95'].map(k => cfg('limits', k)))
        .concat([cfg('engine','max_shell_workers'), cfg('limits','probe_enabled'), cfg('limits','snapshot_path')])],
    ['Testing', 'Testwriter output bounds. The deterministic test loop itself runs as a "Test Loop" scheduled workitem whose command carries every knob as a visible flag — create it below, tune/pause it in WorkItems — see features/TDD.md',
      [{ src: 'range', section: 'globalsettings', min: 'testwriter_min_tests_per_group', max: 'testwriter_max_tests_per_group',
         label: 'tests per group', why: 'how many tests a testwriter agent produces per testgroup (min–max)' }]],
    ['Logging', 'Engine log output and rotation',
      ['log_default_path','log_level','log_max_size_mb','log_max_files'].map(k => cfg('globalsettings', k))],
    ['Advanced', 'Engine internals — set-once values with working defaults; expand only when debugging lock contention or shell runs',
      ['codepath_lock_timeout_sec','codepath_conflict_backoff_sec','shell_timeout_sec'].map(k => cfg('engine', k))],
  ];
}

async function renderSettings(){
  let live = null, ps = null;
  let agents = MOCK_AGENT_DEFS;
  if (LIVE) {
    try { live = await api('/api/config'); } catch (e) { toast('Config: ' + e.message); }
    try { ps = await api('/api/projectsettings'); } catch (e) { toast('Settings: ' + e.message); }
    try { agents = (await api('/api/agents')).agents || []; } catch (e) { toast('Agents: ' + e.message); }
  }
  const cfgVal = (section, key, fallback) =>
    live && live[section] && live[section][key] !== undefined ? live[section][key] : fallback;
  const psVal = (k, fallback) => {
    // structureV2 head-file view: {server: {...}, project: {...}} (+ legacy aliases).
    let v;
    if (ps) {
      if (ps.server && ps.server[k] !== undefined) v = ps.server[k];
      else if (ps.project && ps.project[k] !== undefined) v = ps.project[k];
      else if (ps[k] !== undefined) v = ps[k];
    }
    if (v === undefined || v === null || v === '') return fallback;
    return Array.isArray(v) ? v.join('\n') : String(v);
  };
  const cfgRow = ({ section, key }) => {
    const [v, why] = CONFIG[section][key];
    const cur = String(cfgVal(section, key, v));
    let control;
    if (key === 'user_timezone') control = tzSelectHtml(`${section}.${key}`, cur);
    // Two values, and a typo in a free-text box would mean "review" silently.
    else if (key === 'default_automation') control = `<select data-cfg="${section}.${key}">
      <option value="auto"${cur === 'auto' ? ' selected' : ''}>auto</option>
      <option value="review"${cur === 'review' ? ' selected' : ''}>review</option></select>`;
    else if (typeof v === 'boolean') control = `<select data-cfg="${section}.${key}" data-bool="true">
      <option${cur === 'true' ? ' selected' : ''}>true</option><option${cur !== 'true' ? ' selected' : ''}>false</option></select>`;
    else control = `<input type="text" data-cfg="${section}.${key}" data-num="${typeof v === 'number'}" value="${esc(cur)}">`;
    return `<div class="setrow"><label>${CFG_LABELS[key] || key}</label>${control}<span class="why">${why}</span></div>`;
  };
  // Two keys, one row: a min–max pair reads as a range, not two settings.
  const rangeRow = ({ section, min, max, label, why }) => {
    const input = (key) => {
      const cur = String(cfgVal(section, key, CONFIG[section][key][0]));
      return `<input type="text" data-cfg="${section}.${key}" data-num="true" value="${esc(cur)}">`;
    };
    return `<div class="setrow"><label>${label}</label><span class="range">${input(min)} – ${input(max)}</span><span class="why">${why}</span></div>`;
  };
  const psRow = ({ key }) => {
    const [v, why] = PROJSET[key];
    const value = psVal(key, v);
    return PS_MULTILINE.includes(key)
      ? `<div class="setrow wide"><label>${key}</label>
           <div><textarea rows="${value.split('\n').length + 1}" style="width:100%" data-ps="${key}" id="ps_${key}">${esc(value)}</textarea>
           <div class="pathhint" id="ps_hint_${key}"></div>
           <div class="why" style="margin-top:4px">${why}</div></div></div>`
      : `<div class="setrow"><label>${key}</label><input type="text" data-ps="${key}" value="${esc(value)}"><span class="why">${why}</span></div>`;
  };
  const row = (item) => item.src === 'cfg' ? cfgRow(item) : item.src === 'range' ? rangeRow(item) : psRow(item);
  const legend = `<div class="sub" style="border:1px solid var(--border);border-radius:7px;padding:10px 12px;line-height:1.7">
      <b>How iter files work (structureV2):</b> any file matching <span class="mono">**/*.iter.md</span> is iterapp-meaningful;
      its <b>FILENAME declares its nodetype</b> via the dot rule — <span class="mono">*.nodetype.iter.md</span>
      (a dot before the nodetype unless the file has no prefix; lowercase):
      <span class="mono">*.main.iter.md</span> → THE project head ·
      <span class="mono">*.code.iter.md</span> → a code node (frontmatter <span class="mono">level:</span> = context | container | component) ·
      <span class="mono">*.interface.iter.md</span> → a global interface contract ·
      <span class="mono">*.usecase.iter.md</span> → a global use-case ·
      <span class="mono">*.testgroup.iter.md</span> → test definitions (linked via <span class="mono">children.testgroups</span>) ·
      <span class="mono">*.bizreq.iter.md</span> / <span class="mono">*.techreq.iter.md</span> → requirement docs ·
      any other name → a plain context doc.<br>
      <b>Nodes join the structure ONLY through explicit <span class="mono">children</span> links</b> (paths or globs;
      directory nesting alone links nothing) — unlinked files land in the <b>Orphanage</b> on the Projects page.<br>
      <b>Placeholders in default_context:</b>
      <span class="mono">{marker}</span> = the clicked node’s own .iter.md file ·
      <span class="mono">{ancestor_markers}</span> = the node files of its parent chain ·
      <span class="mono">{interfaces}</span> = the contract files for the node’s inputs/outputs ·
      <span class="mono">{codepath}</span> = the node’s primary codedir ·
      <span class="mono">{topdir}</span> = the project top directory.
    </div>`;
  // The Test group's one-click setup: a "Test Loop" scheduled workitem replaces
  // the old in-engine sweep loop and its config.json section. The knobs travel as
  // flags on the workitem's own command line, so editing the workitem IS the config.
  const testLoopSetup = `<div class="setrow wide"><label></label><div>
      <button class="btn primary" id="mkTestLoop">Create TestLoop Schedule</button>
      <div class="why" style="margin-top:6px">Creates the "Test Loop" scheduled workitem (exec: shell, every 120 min) whose
        command runs <span class="mono">iter testsweep</span> with concurrency, fix-item priorities, staleness, and
        timeout as visible flags. Tune it by editing the workitem's command; stop sweeping by pausing the schedule.
        One per project — the button refuses a duplicate.</div>
    </div></div>`;
  const groupHtml = ([name, sub, items]) => {
    const inner = `<div class="sub">${sub}</div>
      ${name === 'Layout & discovery' ? legend : ''}
      ${name === 'Testing' ? testLoopSetup : ''}
      ${items.map(row).join('')}`;
    return name === 'Advanced'
      ? `<details class="setgroup"><summary><h3>${name}</h3></summary>${inner}</details>`
      : `<div class="setgroup"><h3>${name}</h3>${inner}</div>`;
  };
  const agentOptions = agents.map((a, i) =>
    `<option value="${esc(a.type)}"${i === 0 ? ' selected' : ''}>${esc(a.type)}</option>`).join('');
  const agentsGroup = `<div class="setgroup">
      <h3>Agents Settings</h3>
      <div class="sub">Per-agent settings and prompt — <span class="mono">.iter/agents/&lt;name&gt;.md</span>.
        Add an agent by adding a new .md file there; the engine and this list pick it up automatically.
        Instructions for ALL agents live in <span class="mono">.iter/agents/_shared.md</span> (appended to every agent's context; edit on disk).</div>
      ${agents.length ? `
      <div class="setrow"><label>agent</label>
        <select id="agSel">${agentOptions}</select>
        <span class="why">which agent file to edit</span></div>
      <div id="agFields">${agentFieldsHtml(agents[0])}</div>
      <div class="setfoot">
        <button class="btn" id="agReset">Reload</button>
        <button class="btn primary" id="agSave">Save agent file</button>
      </div>` : '<div class="sub">No agent files found in .iter/agents/.</div>'}
    </div>`;
  // One flat run of groups, ordered by how often each is visited; the agent
  // editor sits between Logging and Advanced, and Advanced renders collapsed.
  const layout = settingsLayout();
  $('view-settings').innerHTML = `<div class="setform">
    <div class="setsearch"><input type="search" id="setSearch"
      placeholder="Search settings — any part of a name, group, or description"
      autocomplete="off" spellcheck="false"></div>
    ${layout.slice(0, -1).map(groupHtml).join('')}
    ${agentsGroup}
    ${groupHtml(layout[layout.length - 1])}
    <div class="setfoot">
      <button class="btn" id="cfgReload">Reload from disk</button>
      <button class="btn" id="cfgReset">Reset engine config to defaults</button>
      <button class="btn primary" id="cfgSave">Save All</button>
    </div>
  </div>`;
  wirePathHints('ps_globalscandirs', 'ps_hint_globalscandirs', null);
  wirePathHints('ps_globalcontextfiles', 'ps_hint_globalcontextfiles', null);
  wirePathHints('ps_default_context', 'ps_hint_default_context', null);
  $('setSearch').addEventListener('input', () => {
    const q = $('setSearch').value.trim().toLowerCase();
    document.querySelectorAll('#view-settings .setgroup').forEach(g => {
      const titleHit = q && g.querySelector('h3').textContent.toLowerCase().includes(q);
      let any = false;
      g.querySelectorAll('.setrow').forEach(r => {
        const hit = !q || titleHit || r.textContent.toLowerCase().includes(q);
        r.style.display = hit ? '' : 'none';
        if (hit) any = true;
      });
      g.style.display = (any || titleHit) ? '' : 'none';
      // A hit inside the collapsed Advanced group must be visible, not hidden
      // behind a closed summary.
      if (g.tagName === 'DETAILS' && q && (any || titleHit)) g.open = true;
    });
  });
  $('mkTestLoop').addEventListener('click', async () => {
    // Everything configurable about the loop lives HERE, on the command line —
    // by design there is no config.json section for it anymore.
    const template = {
      title: 'Test Loop',
      type: 'shell',
      exec: 'shell',
      state: 'scheduled',
      source: 'scheduler',
      priority: 2,
      codepath: '.',
      codepath_ignore: ['**'],   // carve everything out: the sweep needs no lock (it skips busy C4 objects itself)
      sched: { kind: 'every', every_min: 120 },
      mainwork: '"$ITER_BIN" testsweep --project "$ITER_PROJECT" \\\n'
        + '  --concurrency 3 \\\n'
        + '  --priority-red 6 \\\n'
        + '  --priority-green 8 \\\n'
        + '  --green-stale-hours 24 \\\n'
        + '  --group-timeout-min 20',
    };
    if (!LIVE) { toast('Created the "Test Loop" scheduled workitem (mock)'); return; }
    try {
      const items = await api('/api/workitems');
      const existing = (items.open || []).find(i => i.title === 'Test Loop' && i.sched && i.sched.kind);
      if (existing) { toast(`A "Test Loop" schedule already exists (state: ${existing.state})`); return; }
      await api('/api/workitems', { method: 'POST', body: JSON.stringify(template) });
      toast('Created the "Test Loop" scheduled workitem — edit or pause it in WorkItems');
    } catch (e) { toast('Create failed: ' + e.message); }
  });
  $('cfgSave').addEventListener('click', () => {
    const cfgOut = {};
    document.querySelectorAll('[data-cfg]').forEach(input => {
      const [section, key] = input.dataset.cfg.split('.');
      const raw = input.value.trim();
      (cfgOut[section] = cfgOut[section] || {})[key] =
        input.dataset.bool === 'true' ? raw === 'true'
        : input.dataset.num === 'true' ? (Number(raw) || 0) : raw;
    });
    const psOut = { server: {}, project: {} };
    document.querySelectorAll('[data-ps]').forEach(el => {
      const k = el.dataset.ps;
      const v = PS_MULTILINE.includes(k)
        ? el.value.split('\n').map(x => x.trim()).filter(Boolean)
        : el.value.trim();
      (PS_SERVER.includes(k) ? psOut.server : psOut.project)[k] = v;
    });
    const applyTz = () => {
      USER_TZ = (cfgOut.globalsettings && cfgOut.globalsettings.user_timezone) || 'UTC';
      render();
    };
    if (!LIVE) { applyTz(); toast('config.json + head files saved (mock) — engine applies config on its next tick'); return; }
    Promise.all([
      api('/api/config', { method: 'PUT', body: JSON.stringify(cfgOut) }),
      api('/api/projectsettings', { method: 'PUT', body: JSON.stringify(psOut) }),
    ]).then(() => {
        applyTz();
        projLoaded = false;
        toast('Saved — engine applies config on its next tick; rescan applies new globs');
      })
      .catch(e => toast('Save failed: ' + e.message));
  });
  $('cfgReload').addEventListener('click', () => { renderSettings(); toast('Reloaded from disk'); });
  $('cfgReset').addEventListener('click', () => {
    if (LIVE) {
      const defaults = {};
      for (const [section, obj] of Object.entries(CONFIG)) {
        for (const [k, [v]] of Object.entries(obj)) (defaults[section] = defaults[section] || {})[k] = v;
      }
      api('/api/config', { method: 'PUT', body: JSON.stringify(defaults) })
        .then(() => { toast('Engine config reset to defaults and saved — head files untouched'); USER_TZ = 'UTC'; render(); renderSettings(); })
        .catch(e => toast('Reset failed: ' + e.message));
      return;
    }
    renderSettings();
    toast('Reset to defaults (unsaved)');
  });
  if (agents.length) {
    $('agSel').addEventListener('change', () => {
      const picked = agents.find(a => a.type === $('agSel').value) || agents[0];
      $('agFields').innerHTML = agentFieldsHtml(picked);
    });
    $('agSave').addEventListener('click', () => {
      const name = $('agSel').value;
      if (!LIVE) { toast(`agents/${name}.md saved (mock) — engine reloads it on its next tick`); return; }
      const out = {};
      document.querySelectorAll('[data-ag]').forEach(el => {
        const k = el.dataset.ag;
        if (k === 'body') out[k] = el.value;
        else if (k === 'visible') out[k] = el.value === 'true';
        else if (el.dataset.num === 'true') out[k] = Number(el.value.trim()) || 0;
        else out[k] = el.value.trim();
      });
      api('/api/agents/' + encodeURIComponent(name), { method: 'PUT', body: JSON.stringify(out) })
        .then(saved => {
          Object.assign(agents.find(a => a.type === name) || {}, saved);
          toast(`agents/${name}.md saved — engine reloads it on its next tick`);
        })
        .catch(e => toast('Save failed: ' + e.message));
    });
    $('agReset').addEventListener('click', () => { renderSettings(); toast('Reloaded from disk'); });
  }
}

async function loadProjects(){
  if (!LIVE) return;
  const scan = await api('/api/markers');
  MARKERS = scan.nodes.map(n => ({
    key: n.key, level: n.level || 'node', name: n.name, desc: n.description,
    uses: n.inputs || [], provides: n.outputs || [], depth: n.depth,
    parent: n.parent || '', parents: n.parents || [],
    dir: n.dir, path: n.path, body: n.body || '',
    codedirs: n.codedirs || [], codenodes: n.codenodes || [],
    testgroups: n.testgroups || [], teststate: n.teststate || '',
    tsEff: n.teststate_effective || 'included',
    bizreqs: n.bizreqs || [], techreqs: n.techreqs || [],
  }));
  USECASES = scan.usecases.map(u => ({ name: u.name, desc: u.description, file: u.file,
    codenodes: u.codenodes || [], codenode_keys: u.codenode_keys || [],
    body: u.body || '', teststate: u.teststate || '' }));
  INTERFACES = scan.interfaces.map(i => ({ id: i.id, kind: i.kind, endpoint: i.endpoint, description: i.description, file: i.file, body: i.body || '', teststate: i.teststate || '' }));
  ORPHANS = scan.orphans || [];
  SCAN_NOTES = scan.notes || [];
  projLoaded = true;
  return scan;
}

/* Resolve a marker reference from a data attribute: PATH first (unique — two
   top-level markers can share key ""), key as a fallback for older callers. */
function markerByRef(v){
  return MARKERS.find(x => x.path === v) || MARKERS.find(x => x.key === v) || null;
}

function ifaceTouches(m, id){
  return (m.uses || []).includes(id) || (m.provides || []).includes(id);
}

/* teststate gate (structureV2) — the ENGINE resolves DAG ancestry and sends
   teststate_effective with every node; this just parses it. */
function effTestLoop(m){
  const eff = (m.tsEff || 'included').trim();
  if (eff === 'included' || eff === '') return { state: 'included' };
  const mm = eff.match(/^(\w+)\s+via\s+(.*)$/);
  return { state: 'omitted', value: mm ? mm[1] : eff, by: mm ? mm[2] : '' };
}

function tlBadge(tl){
  if (tl.state !== 'omitted') return '';
  const hard = tl.value === 'block' || tl.value === 'blocked';
  return `<span class="useb" style="background:var(--s-paused-bg);color:#fff"
    title="Omitted from the Test Loop (teststate: ${esc(tl.value)}${tl.by ? ' via ' + esc(tl.by) : ''})${hard ? ' — BLOCKED: outside/vendor setup missing; only editing the node file lifts it' : ' — the sweep skips this object; agents may re-include it'}">⛔ ${hard ? 'blocked' : 'no test loop'}</span>`;
}

/* The engine-owned edit: POST /api/teststate is the HUMAN surface, so any
   change is allowed here — including lifting a block (the CLI, the agents'
   path, still refuses to touch a block flag). */
async function tlApply(action, target){
  if (!LIVE) { toast(`Mock mode — would set teststate ${action} on ${target}`); return; }
  try {
    const r = await api('/api/teststate', { method: 'POST', body: JSON.stringify({ target, action }) });
    toast(r.summary || `teststate ${action} applied`);
    projLoaded = false;
    await renderProjects();
  } catch (e) { toast('Test loop: ' + e.message); }
}

/* ONE control: the file's OWN teststate flag as a selector. `inherit` is the
   default (do whatever the parent chain does); the badge beside the row shows
   the EFFECTIVE state after DAG resolution. Block is agent-proof, not
   human-proof: picking anything else here lifts it. */
function tlSelector(ref, own){
  own = (own || '').trim();
  if (own === 'blocked') own = 'block'; // V1 spelling
  if (own === '') own = 'inherit';
  const opt = (v, label, why) =>
    `<option value="${v}" ${own === v ? 'selected' : ''} title="${esc(why)}">${label}</option>`;
  return `<label class="useb" style="display:inline-flex;align-items:center;gap:6px;background:none;padding:0">teststate:
    <select data-tlsel data-tlref="${esc(ref)}" title="This file's own teststate flag. The effective state (after parents) shows in the row badge.">
      ${opt('inherit', 'inherit (default)', 'no opinion — do whatever the parent chain does')}
      ${opt('omit', 'omit', 'park this (and everything beneath it) out of the Test Loop; agents may re-include')}
      ${opt('include', 'include', 're-enter the Test Loop, even under an omitted ancestor (nearest flag wins)')}
      ${opt('block', 'block', 'hard park — outside/vendor setup missing; AGENTS cannot lift this, only this selector (or a file edit) can')}
    </select></label>`;
}

function orderedMarkers(){
  const list = MARKERS.slice();
  if (projOrder === 'level') list.sort((a,b) => LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level) || a.name.localeCompare(b.name));
  if (projOrder === 'name') list.sort((a,b) => a.name.localeCompare(b.name));
  return list;
}

    <div class="legendbar">

function markerAncestors(key){
  const out = [];
  let k = key;
  while (k) { k = k.includes('/') ? k.slice(0, k.lastIndexOf('/')) : ''; const a = MARKERS.find(m => m.key === k); if (a) out.push(a); }
  return out;
}

async function ucDelete(idx){
  const u = USECASES[idx];
  if (!u) return;
  if (!confirm(`Delete use-case "${u.name}"?\n\n${u.file}\n\nA foldered use-case (<name>/<name>.usecase.iter.md) loses its WHOLE folder — E2E tests and run history included. A flat file is removed alone.`)) return;

function projClick(e){
  const ol = e.target.closest('[data-orphanlink]');
  if (ol) {

    const sel = document.querySelector(`[data-orphansel="${oi}"]`);
    const o = ORPHANS[oi];
    if (!o || !sel) return true;
    if (!LIVE) { toast('Mock mode — nothing linked'); return true; }
    api('/api/orphans/link', { method:'POST', body: JSON.stringify({ orphan: o.path, parent: sel.value }) })
      .then(r => { toast(`Linked into ${r.key} of ${r.parent.split('/').pop()}`); projLoaded = false; renderProjects(); })
      .catch(err => toast('Link failed: ' + err.message));
    return true;
  }
  const ov = e.target.closest('[data-viewmarker-path]');
  if (ov) {
    if (!LIVE) { toast('Mock mode'); return true; }
    api('/api/file/read', { method:'POST', body: JSON.stringify({ path: ov.dataset.viewmarkerPath }) })
      .then(f => openLb('File — ' + f.path, `<div class="textblock mono" style="max-height:66vh">${esc(f.content)}</div>`))
      .catch(err => toast('Read failed: ' + err.message));
    return true;
  }
  const mk_ = e.target.closest('[data-mkworkitem]');
  if (mk_) {
    const m = markerByRef(mk_.dataset.mkworkitem);
    // Expand the default_context TEMPLATE from Project Settings — placeholders
    // resolve here; literal lines (and {codepath} lines) pass through for the engine.
    const ctx = [];
    for (const line of DEFAULT_CONTEXT) {
      if (line === '{marker}') ctx.push(m.path);
      else if (line === '{ancestor_markers}') markerAncestors(m.key).forEach(a => ctx.push(a.path));
      else if (line === '{interfaces}') INTERFACES
        .filter(i => m.uses.includes(i.id) || m.provides.includes(i.id))
        .forEach(i => ctx.push(i.file));
      else ctx.push(line);
    }
    openForm('create', mk({ codepath: (m.codedirs && m.codedirs[0]) || m.dir, context: [...new Set(ctx)],
      testfiles: (m.testgroups || []).slice(), title: '', mainwork: '', source: 'user' }));
    return true;
  }
  const ifr = e.target.closest('[data-ifacerow]');
  if (ifr && !e.target.closest('.pdetail')) {
    const idx = +ifr.dataset.ifacerow;
    if (openIface === idx) {
      openIface = -1;
      projIface = '';
    } else {
      openIface = idx;
      projIface = INTERFACES[idx].id;
      projUC = -1; openUC = -1;
    }
    renderProjects();
    return true;
  }
  const ucnew = e.target.closest('[data-ucnew]');
  if (ucnew) { ucForm(-1); return true; }
  const uced = e.target.closest('[data-ucedit]');
  if (uced) { ucForm(+uced.dataset.ucedit); return true; }
  const ucdel = e.target.closest('[data-ucdel]');
  if (ucdel) { ucDelete(+ucdel.dataset.ucdel); return true; }
  const ucr = e.target.closest('[data-ucrow]');
  if (ucr && !e.target.closest('.pdetail')) {
    const idx = +ucr.dataset.ucrow;
    if (openUC === idx) {
      openUC = -1;
      projUC = -1;
    } else {
      openUC = idx;
      projUC = idx;                    // expanding also threads the red line
      projIface = ''; openIface = -1;
    }
    renderProjects();
    return true;
  }
  const vm = e.target.closest('[data-viewmarker]');
  if (vm) {
    const m = markerByRef(vm.dataset.viewmarker);
    if (LIVE) {
      // The REAL file, verbatim — frontmatter (children links included) and body.
      api('/api/file/read', { method:'POST', body: JSON.stringify({ path: m.path }) })
        .then(f => openLb('Node — ' + f.path,
          `<div class="textblock mono" style="max-height:66vh">${esc(f.content)}</div>`))
        .catch(err => toast('Read failed: ' + err.message));
      return true;
    }
    openLb('Node — ' + m.path, `<div class="textblock mono" style="max-height:60vh">${esc(
`---
name: ${m.name}
level: ${m.level}
description: "${m.desc}"${m.uses.length ? `\nuses: [${m.uses.join(', ')}]` : ''}
---

# ${m.name}

${m.desc}.

## Requirements
- (the marker body IS the context handed to agents working under ${absCodepath(m.dir)})
- Interfaces, constraints, and conventions for this node live here, beside the code.

## Interfaces
- See parent context markers for shared contracts.`)}</div>`);
    return true;
  }
  const chip = e.target.closest('[data-depth]');
  if (chip) {
    const d = +chip.dataset.depth;
    projDepth = projDepth === d ? null : d;
    renderProjects();
    return true;
  }
  const row = e.target.closest('[data-marker]');
  if (row) {
    const key = row.dataset.marker;
    openMarker = openMarker === key ? null : key;
    renderProjects();
    return true;
  }
  return false;
}

/* Extract the "# Long Description" section from a marker body (any heading level
   1–3; ends at the next heading or EOF). */
function longDescOf(body){
  const m = (body || '').match(/(?:^|\n)#{1,3}\s*Long Description[^\n]*\n([\s\S]*?)(?=\n#{1,3}\s|$)/i);
  return m ? m[1].trim() : '';
}
function replaceLongDescSection(content, text){
  const re = /((?:^|\n)#{1,3}\s*Long Description[^\n]*\n)[\s\S]*?(?=\n#{1,3}\s|$)/i;
  if (re.test(content)) return content.replace(re, (_, head) => head + text + '\n');
  return content.trimEnd() + '\n\n# Long Description\n' + text + '\n';
}

/* uses/provides as two clickable listboxes: interfaces open their contract,
   C4 nodes open their detail — drill through dependencies infinitely, with a
   breadcrumb trail to walk back. */
function refBtn(name){
  const iface = INTERFACES.find(i => i.id === name);
  const node = !iface && MARKERS.find(x => x.key === name || x.name === name);
  if (iface) return `<button class="refbtn linked" data-refiface="${esc(name)}" title="interface — click for the contract">${esc(name)}</button>`;
  if (node) return `<button class="refbtn linked" data-refnode="${esc(node.key)}" title="C4 object — click for detail">${esc(name)}</button>`;
  return `<button class="refbtn plain" disabled title="no interface or C4 object declared with this id">${esc(name)}</button>`;
}
function upBoxesHtml(m){
  const none = '<span style="color:var(--text-dim);font-size:12px">—</span>';
  return `<div class="upgrid">
    <div class="upbox"><div class="uphead">inputs</div>${(m.uses||[]).map(refBtn).join('') || none}</div>
    <div class="upbox"><div class="uphead">outputs</div>${(m.provides||[]).map(refBtn).join('') || none}</div>
  </div>`;
}

/* Shared detail rows: the tree's expanded section and the drill-down lightbox
   render the same fields from the same data. */
function c4DetailRows(m){
  const ld = longDescOf(m.body);
  return `
    <div class="dlabel">Short desc</div><div>${esc(m.desc) || '<span style="color:var(--text-dim)">—</span>'}</div>
    <div class="dlabel">Long desc</div>
    <div><div class="longdesc ${ld?'':'tbd'}">${esc(ld || 'TBD — this marker has no Long Description yet. Click Edit to write one: plain language, no jargon, acronyms defined on first use ("three letter acronym (TLA)").')}</div>
      <button class="btn" style="margin-top:6px" data-editlong="${esc(m.path)}">Edit Long Description</button></div>
    <div class="dlabel">Node file</div><div class="mono">${esc(m.path)}</div>
    <div class="dlabel">CodeDirs</div><div class="mono">${esc((m.codedirs && m.codedirs.length ? m.codedirs : [absCodepath(m.dir)]).join(' · '))}</div>
    <div class="dlabel">Inputs / Outputs</div><div>${upBoxesHtml(m)}</div>`;
}

let lbStack = [];   // [{label, title, build:()=>html, wire?:()=>void}]
function crumbsHtml(){
  if (lbStack.length < 2) return '';
  return `<div class="crumbs">${lbStack.map((s,i) => i === lbStack.length-1
    ? `<span class="chere">${esc(s.label)}</span>`
    : `<button data-crumb="${i}">${esc(s.label)}</button><span class="csep">›</span>`).join('')}</div>`;
}
function lbRenderTop(){

async function reqLb(ref, kind){
  const m = markerByRef(ref);
  if (!m) return;
  const label = kind === 'bizreq' ? 'Business Requirements' : 'Technical Requirements';
  // The node's children links resolve its requirement files; fall back to the
  // conventional default beside the node file.
  const declaredList = kind === 'bizreq' ? (m.bizreqs || []) : (m.techreqs || []);
  const localPath = declaredList[0] || (absCodepath(m.dir) + '/' + kind + '.iter.md');
  const globalFiles = (CONTEXT_FILES || []);
  const globalPath = MAINFILE ? MAINFILE + (globalFiles.length > 1 ? ` (+${globalFiles.length - 1} context file${globalFiles.length > 2 ? 's' : ''})` : '') : '(mock mode)';
  let local = { content: '', exists: false };
  let globalTxt = '';
  if (LIVE) {
    try { const r = await api('/api/file/read', { method:'POST', body: JSON.stringify({ path: localPath }) }); local = { content: r.content, exists: true }; } catch (e) {}
    for (const gf of globalFiles) {
      try { const g = await api('/api/file/read', { method:'POST', body: JSON.stringify({ path: gf }) }); globalTxt += `===== ${gf} =====\n` + g.content + '\n\n'; } catch (e) {}
    }
    if (!globalTxt) globalTxt = '(no global context files resolve — set globalcontextfiles in Settings)';
  } else { globalTxt = '(mock mode — open via iter start for live content)'; }
  lbNav({ label, title: `${label} — ${m.name}`,
    build: () => `
      <div class="reqpathrow"><span><b>LOCAL — specific to this ${esc(m.level)}</b> (editable): <span class="mono">${esc(localPath)}</span>${local.exists ? '' : ' — <i>does not exist yet; saving creates it</i>'}</span></span></div>

      <div class="reqpathrow" title="drag the bottom edge of the box above to adjust the boundary">
        <span><b>GLOBAL — the project head + context files</b> (read-only): <span class="mono">${esc(globalPath)}</span></span>
        <span>main.iter.md is edited in Settings; global context files are edited on disk, deliberately</span></div>
      <div class="reqglobal">${esc(globalTxt)}</div>`,
    foot: `<button class="btn" data-lbclose>Close</button>
           <button class="btn primary" id="reqSave">Save Local ${esc(kind)}.iter.md</button>`,
    wire: () => {
      $('reqSave').addEventListener('click', async () => {
        if (!LIVE) { toast('Mock mode — nothing saved'); return; }
        try {
          await api('/api/file', { method:'PUT', body: JSON.stringify({ path: localPath, content: $('reqLocal').value }) });
          local = { content: $('reqLocal').value, exists: true };
          toast('Saved ' + localPath.split('/').pop());
        } catch (e) { toast('Save failed: ' + e.message); }
      });
    } });
}

/* ------------------------------------------------ testing interface lightbox */

let tg = { entries: [], sel: 0, runs: {}, node: null, logOpen: null };

function tgEntrySel(){ return tg.entries[tg.sel]; }
function tgSanitize(id){ return String(id).replace(/[^A-Za-z0-9_-]/g, '_'); }
function tgResultColor(r){
  return r === 'passed' ? 'var(--s-complete-bg)' : r === 'failed' ? 'var(--s-failed-bg)'
    : r === 'error' ? 'var(--s-paused-bg)' : 'var(--border)';
}

async function testingLb(ref){
  tg.node = ref === null || ref === undefined ? null : markerByRef(ref);
  if (!LIVE) { toast('Mock mode — open via iter start for live test data'); return; }
  let data;
  try { data = await api('/api/testgroups'); } catch (e) { toast('Testgroups: ' + e.message); return; }
  const nodeDir = tg.node ? absCodepath(tg.node.dir) : null;
  const mine = (data.files || [])
    .filter(f => !nodeDir || f.c4_dir === nodeDir || (f.c4_dir || '').startsWith(nodeDir + '/'));
  tg.missing = mine.filter(f => f.missing);
  tg.entries = mine
    .filter(f => !f.missing)
    .flatMap(f => f.groups.map(g => ({ ...g, file: f.file, test_dir: f.test_dir, c4_key: f.c4_key, c4_name: f.c4_name, teststate: f.teststate })));
  tg.orphans = data.orphans || [];
  tg.undeclared = data.undeclared || [];
  tg.sel = 0; tg.logOpen = null;
  await tgLoadRuns();
  lbNav({ label: 'Testing', title: 'Testing — ' + (tg.node ? tg.node.name : 'all testgroups'),
    build: tgBuild, wire: null });
}

async function tgLoadRuns(){
  const e = tgEntrySel();
  if (!e || tg.runs[e.test_dir]) return;
  try { tg.runs[e.test_dir] = (await api('/api/testruns', { method:'POST', body: JSON.stringify({ dir: e.test_dir }) })).runs || []; }
  catch (err) { tg.runs[e.test_dir] = []; }
}

function tgNotesHtml(){
  let out = '';
  for (const f of (tg.missing || [])) {
    out += `<p style="color:var(--s-failed-bg);font-size:12px;margin:8px 0 0">${esc(f.c4_name)}'s children.testgroups link resolves to
      <span class="mono">${esc(f.file)}</span> but no file matches — a testwriter item should create it.</p>`;
  }
  if (!tg.node && (tg.undeclared || []).length) {
    out += `<p style="color:var(--text-dim);font-size:12px;margin:8px 0 0">${tg.undeclared.length} code node(s) resolve no
      <span class="mono">children.testgroups</span> files — deliberately outside the sweep.</p>`;
  }
  if (!tg.node && (tg.orphans || []).length) {
    out += `<p style="color:var(--s-paused-bg);font-size:12px;margin:8px 0 0">Orphaned (no node's children link claims them):
      <span class="mono">${tg.orphans.map(esc).join(' · ')}</span></p>`;
  }
  return out;
}

function tgBuild(){
  if (!tg.entries.length) {
    return `<p style="color:var(--text-dim)">No linked testgroups found${tg.node ? ' for ' + esc(tg.node.name) : ''}.
      A node's <span class="mono">children.testgroups</span> links name its testgroup files — a link matching nothing
      means deliberately untested. The plan agent writes the definitions; the testwriter registers the
      tests (creating files where the links will find them).</p>` + tgNotesHtml();
  }
  const e = tgEntrySel();
  const left = tg.entries.map((g, i) => `
    <div class="tgrow ${i === tg.sel ? 'sel' : ''}" data-tgsel="${i}">
      <span class="tgdot" style="background:${tgResultColor(g.result)}"></span>
      <span>${esc(g.label)}</span><small>${esc(g.counts || '')}</small>
    </div>`).join('');
  const runs = (tg.runs[e.test_dir] || []).filter(r =>
    (e.testlist || []).some(t => r.name.endsWith('-' + tgSanitize(t.id) + '.log')));
  const openItem = items.find(i => i.source_testgroup === e.label && i.state !== 'complete');
  const tests = (e.testlist || []).map(t => `
    <tr><td class="mono"><b>${esc(t.id)}</b></td><td>${esc(t.name || '')}</td>
      <td style="color:var(--text-dim)">${esc(t.desc || '')}</td><td class="mono">${esc(t.shell)}</td></tr>`).join('');
  const runRows = runs.slice(0, 40).map(r => `
    <tr class="runrow" data-runlog="${esc(r.path)}" title="Click to view the captured output">
      <td class="mono">${esc(r.name)}</td><td class="mono">${(r.size/1024).toFixed(1)} KB</td></tr>`).join('');
  return `<div class="tgwrap">
    <div class="tglist">${left}</div>
    <div>
      <p style="margin:0 0 6px">
        <span class="chip" style="background:${tgResultColor(e.result)};color:#fff">${esc(e.result || 'never run')}</span>
        <span class="chip kv mono">${esc(e.counts || '–')}</span>
        <span class="chip meta mono">last run: <b>${e.lastrun ? esc(fmtTs(e.lastrun)) : '—'}</b></span>
        ${e.teststate && e.teststate.state === 'omitted' ? `<span class="chip" style="background:var(--s-paused-bg);color:#fff" title="Parked by teststate: ${esc(e.teststate.value)}${e.teststate.by ? ' via ' + esc(e.teststate.by) : ''} — the sweep skips this group and auto-closes its unstarted fix items">⛔ omitted from test loop</span>` : ''}
        ${openItem ? `<span class="chip" style="background:var(--s-todo-bg);color:#fff" title="An open work item exists for this group (dedup guard active)">fix item: ${esc(openItem.state)} · ${esc(shortId(openItem))}</span>` : ''}
      </p>
      <p style="margin:0 0 10px;color:var(--text-dim);font-size:12.5px">${esc(e.desc || '(no group description — add "desc" in the testgroups block)')}</p>
      <label class="autofix" title="OFF: a red run births a fix work item in todo, for your review. ON: it lands queued and an agent is dispatched automatically.">
        <input type="checkbox" data-autofix ${e.auto_fix ? 'checked' : ''}> auto-fix
        <span style="font-weight:500;color:var(--text-dim)">red run → fix item ${e.auto_fix ? 'QUEUED (auto-dispatch)' : 'in TODO (human review)'}</span>
      </label>
      <h4 style="margin:14px 0 4px">Tests (${(e.testlist||[]).length})</h4>
      ${tests ? `<table class="t"><thead><tr><th>id</th><th>name</th><th>what it proves</th><th>script</th></tr></thead><tbody>${tests}</tbody></table>`
        : '<p style="color:var(--text-dim);font-size:12.5px;margin:4px 0">No tests registered yet — a testwriter item fills the testlist.</p>'}
      <h4 style="margin:14px 0 4px">Run history <span style="color:var(--text-dim);font-weight:500;font-size:11.5px">· ${esc(e.test_dir)}/runs/ · newest first</span></h4>
      ${runRows ? `<table class="t"><tbody>${runRows}</tbody></table>` : '<p style="color:var(--text-dim);font-size:12.5px;margin:4px 0">No recorded runs yet — the sweep and <span class="mono">iter runtests</span> write one log per test per run.</p>'}
      ${tgNotesHtml()}
    </div></div>`;
}

async function openRunLog(path){
  try {
    const f = await api('/api/file/read', { method:'POST', body: JSON.stringify({ path }) });
    lbNav({ label: path.split('/').pop(), title: 'Test Run — ' + path.split('/').pop(),
      build: () => `<p class="mono" style="color:var(--text-dim);font-size:11.5px;margin:0 0 8px">${esc(path)}</p>
        <div class="textblock mono" style="max-height:60vh">${esc(f.content)}</div>` });
  } catch (e) { toast('Log: ' + e.message); }
}

/* delegated clicks for all the drill-down machinery (works inside lightboxes) */
document.addEventListener('click', (e) => {
  const crumb = e.target.closest('[data-crumb]');
  if (crumb) { lbStack = lbStack.slice(0, +crumb.dataset.crumb + 1); lbRenderTop(); return; }
  const rn = e.target.closest('[data-refnode]');
  if (rn) { navNode(rn.dataset.refnode); return; }
  const ri = e.target.closest('[data-refiface]');
  if (ri) { navIface(ri.dataset.refiface); return; }
  const el = e.target.closest('[data-editlong]');
  if (el) { editLongDesc(el.dataset.editlong); return; }
  const rq = e.target.closest('[data-reqlb]');
  if (rq) { reqLb(rq.dataset.node, rq.dataset.reqlb); return; }
  const tl = e.target.closest('[data-testlb]');
  if (tl) { testingLb(tl.dataset.node ?? null); return; }
  const ts = e.target.closest('[data-tgsel]');
  if (ts) { tg.sel = +ts.dataset.tgsel; tgLoadRuns().then(lbRenderTop); return; }
  const af = e.target.closest('[data-autofix]');
  if (af) { tgToggleAutofix(af.checked); return; }
  const rl = e.target.closest('[data-runlog]');
  if (rl) { openRunLog(rl.dataset.runlog); return; }
});

/* -------------------------------------------------- multi-server identity */
/* In the wired version: url_slug + project_name from /api/projectsettings, the
   server list from /api/servers (backed by ~/.iterapp/servers.json, pid-checked). */
const SLUG = 'pdy-dev';
const SERVERS = [
  { name:'Paydaay Core Product', slug:'pdy-dev', port:9741, current:true },
  { name:'greet (sample)',       slug:'greet',   port:9812 },
  { name:'paydaay-notify',       slug:'notify',  port:9733 },
];

function slugColor(slug){
  let h = 0;
  for (const c of slug) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360}, 62%, 42%)`;
}

/* favicon: an SVG dot tinted by slug hash, carrying the slug's initial —
   with ten tabs open, color beats text */
let faviconLink = null;
function setFavicon(slug){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="7" fill="${slugColor(slug)}"/>
    <text x="8" y="11.6" font-size="9.5" text-anchor="middle" fill="#fff"
      font-family="sans-serif" font-weight="700">${(slug[0] || 'i').toUpperCase()}</text></svg>`;
  if (!faviconLink) {
    faviconLink = document.createElement('link');
    faviconLink.rel = 'icon';
    document.head.appendChild(faviconLink);
  }
  faviconLink.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
}
// SLUG is the demo project's, so LIVE gets a neutral dot until /api/meta says
// whose queue this is (issue 10 — the identity flashes as loudly as the counts).
setFavicon(LIVE ? 'iter' : SLUG);

let servers = SERVERS;

async function renderServers(){
  if (LIVE) {
    try {
      const rows = await api('/api/servers');
      servers = rows.map(r => ({
        name: r.project_name, slug: r.url_slug, port: r.port,
        current: String(r.port) === location.port,
      }));
    } catch (e) { servers = []; }
  }
  // Settings applies to THE SERVER YOU'RE BROWSING, so it renders as an
  // indented child of the current server's row (other servers get no child —
  // their settings live in their own webapp).
  const onSettings = location.hash.replace(/^#\//,'') === 'settings';
  const settingsChild = `<a href="#/settings" data-view="settings" class="srvchild ${onSettings ? 'here' : ''}"
       title="this server's settings (engine config + project settings)">Settings</a>`;
  $('serverSwitch').innerHTML = servers.map(s => `
    <a href="#" class="srv ${s.current ? 'here' : ''}" data-server="${esc(s.slug)}"
       title="http://${esc(s.slug)}.localhost:${s.port}/">
      <span class="dot" style="background:${slugColor(s.slug)}"></span>
      ${esc(s.slug)}
      <small>:${s.port}</small></a>${s.current ? settingsChild : ''}`).join('')
    || `<span style="color:var(--text-dim);font-size:11.5px;padding:2px 9px">only this one</span>${settingsChild}`;
}

$('serverSwitch').addEventListener('click', (e) => {
  const a = e.target.closest('[data-server]');
  if (!a) return;
  e.preventDefault();
  const s = servers.find(x => x.slug === a.dataset.server);
  if (!s || s.current) { toast('This server'); return; }
  if (LIVE) window.open(`http://localhost:${s.port}/`, '_blank');
  else toast(`(mock) would open http://${s.slug}.localhost:${s.port}/`);
});

// Agent defs feed the New WorkItem form's per-type defaults; fetched once at
// startup (a failure just means no pre-fill — the form still works).
AGENT_DEFS = LIVE ? [] : MOCK_AGENT_DEFS;
if (LIVE) api('/api/agents').then(d => { AGENT_DEFS = d.agents || []; }).catch(() => {});
// The markup ships with the demo project's name and host in the sidebar; in LIVE
// they are blanked until /api/meta names the project you are actually looking at.
if (LIVE) {
  const brand = document.querySelector('.projbrand');
  brand.querySelector('b').textContent = '';
  brand.querySelector('span').textContent = '';
  document.title = 'IterLoop';
}
render();
navTo(location.hash.replace(/^#\//,'') || 'workitems');
renderServers();
if (LIVE) {
  loadAll().then(refreshEngine);
  setInterval(refreshEngine, 5000);
  const es = new EventSource('/api/events');
  let debounce;
  let dashDebounce;
  // The dashboard reads /api/history, which is a full pass over the closed
  // archive — worth doing when the numbers move, not worth doing per event.
  const refreshDashboard = (delay) => {
    if (!document.getElementById('view-dashboard').classList.contains('active')) return;
    clearTimeout(dashDebounce);
    dashDebounce = setTimeout(renderDashboard, delay);
  };
  const fullReload = () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { loadAll().then(refreshEngine); refreshDashboard(0); }, 250);
  };
  es.onmessage = async (ev) => {
    let msg = null;
    try { msg = JSON.parse(ev.data || '{}'); } catch (e) { /* not JSON: treat as "something changed" */ }
    // {"type":"delta"} patches rows in place; {"type":"change"} means the server
    // decided the diff was too big or reached outside the two queue files, and
    // the full load is the cheaper answer.
    if (msg && msg.type === 'delta' && await applyDelta(msg)) { refreshDashboard(3000); return; }
    fullReload();
  };
}
</script>
