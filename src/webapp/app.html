/* "Answer and Queue": the answer is final, so it becomes the state transition —
   one POST stores it, stamps times.answered, and queues the item. */
async function answerAndQueue(id){
  const item = items.find(i => i.workid === id);
  const box = answerBoxFor(id);
  const text = (box ? box.value : answerDrafts.get(id) ?? item.answer ?? '').trim();
  if (!text) {
    toast('An answer needs text — that text is what the agent acts on');
    if (box) box.focus();
    return;
  }
  answerDrafts.delete(id);
  answerState.delete(id);
  if (!LIVE) {
    item.answer = text; item.times.answered = nowIso();
    item.state = 'queued'; item.lasterror = '';
    render(); toast(`Answered — ${shortId(item)} queued`);
    return;
  }
  // Optimistic (issue 13b): the answer and the queue land on screen at once —
  // the round trip only confirms them, and a refusal puts the item back where
  // it was with the typed text intact so nothing has to be retyped.
  const before = { state: item.state, answer: item.answer, answered: item.times.answered, lasterror: item.lasterror };
  item.answer = text; item.times.answered = nowIso();
  item.state = 'queued'; item.lasterror = '';
  render();
  try {
    const r = await api(`/api/workitems/${id}/action`,
      { method:'POST', body: JSON.stringify({ action:'answer', answer: text, queue: true }) });
    if (r.state && r.state !== item.state) { item.state = r.state; render(); }
    toast(`Answered — ${shortId(item)} queued`);
  } catch (e) {
    item.state = before.state; item.answer = before.answer;
    item.times.answered = before.answered; item.lasterror = before.lasterror;
    answerDrafts.set(id, text);            // the typing is not lost because the server said no
    render();
    toast('Answer failed: ' + e.message);
  }
}

/* ---- the Answer lightbox: a question you can actually finish reading -------
   An agent's question runs to thousands of characters, and reading one in the
   row means reading inside a list the engine rewrites every time it writes to
   its database. Even with the paint now held (render()'s overlay check), the
   row is the wrong place for a long read: the question shares its scroll box
   with the request, the output and everything else on the page.

   So the question gets a room of its own. Think of it as taking a letter out of
   a moving conveyor belt to read it at a desk: the modal holds its OWN copy of
   the words and its own scroll position, the belt keeps moving behind it, and
   putting the letter down (Close) is when the belt is looked at again.

   The answer box carries the same `data-answer` attribute as the row's, so the
   delegated input/focusout listeners, the draft map, the 5-second autosave and
   the status line all treat it as the same box — nothing here reimplements
   any of that. */
async function openAnswerLb(id){
  let item = items.find(i => i.workid === id);
  if (!item) return;
  /* A summary row carries `has_question: true` but not a word of the question.
     Opening on one would show an empty box over a question nobody can read —
     fetch first, and if it is STILL a summary say so rather than lie. */
  if (isSummary(item)) {
    await ensureBody(id);
    item = items.find(i => i.workid === id) || item;
    if (isSummary(item)) { toast('Still loading this item’s question — try again in a moment'); return; }
  }
  if (!hasQuestion(item)) { toast('This item has no question to answer'); return; }

  // The states where the server still accepts an edit get the editor; anywhere
  // else this is the durable record of what was asked and what was decided.
  const editable = ANSWERABLE.includes(item.state);
  const asked = item.times.asked
    ? ` <span style="color:var(--text-dim);font-weight:500;font-size:11.5px">— asked ${esc(fmtTs(item.times.asked))}${ago(item.times.asked) ? ` (${ago(item.times.asked)} ago)` : ''}</span>`
    : '';
  const val = answerDrafts.has(id) ? answerDrafts.get(id) : (item.answer || '');
  // 44vh, not the .textblock default of 60vh: the answer box and the buttons
  // have to stay on screen under it, or answering means scrolling away from
  // the question to find where to type.
  const answerHtml = editable
    ? `<textarea class="answerbox" data-answer="${id}" rows="6" spellcheck="true"
         placeholder="Name one of the recommendations, or give a different direction. The agent gets this text verbatim at the top of its request.">${esc(val)}</textarea>
       <div class="answerrow"><span class="answerstat" data-astat="${id}">${esc(answerStatus(item))}</span></div>`
    : (item.answer
        ? `<div class="textblock answer">${esc(item.answer)}</div>`
        : `<div class="textblock unanswered">No answer recorded — this item is <b>${esc(item.state)}</b>, a state the server no longer accepts an answer for.</div>`);

  if (typeof lbStack !== 'undefined') lbStack = [];
  openLb(`Question — ${item.title}`, `
    <div class="dlabel">Question${asked}</div>
    <div class="textblock question" data-answerlbq style="max-height:44vh">${esc(item.question)}</div>
    <div class="dlabel">Answer</div>
    ${answerHtml}`,
    editable
      ? `<button class="btn" data-lbclose>Close</button>
         <button class="btn primary" id="lbAnswerQueue">Answer and Queue</button>`
      : `<button class="btn" data-lbclose>Close</button>`);

  // Deliberately NOT focused: the point of this box is reading the question
  // from the top, and a focused textarea would also be doing render()'s holding
  // for it — hiding whether the overlay hold actually works.
  if (!editable) return;
  $('lbAnswerQueue').addEventListener('click', async () => {
    const box = $('overlay').querySelector(`[data-answer="${id}"]`);
    if (!box || !box.value.trim()) {
      toast('An answer needs text — that text is what the agent acts on');
      if (box) box.focus();
      return;
    }
    noteAnswerEdit(id, box.value);       // whatever is on screen IS the draft
    await flushAnswer(id);
    // answerAndQueue reads the box and paints optimistically before its first
    // await, so the modal is still open when it takes the modal's text — and
    // closing right after releases the paint it just held.
    const done = answerAndQueue(id);
    closeLb();
    await done;
  });
}

/* issue 7c — the release acts on this item's DESCENDANTS, never on the item, so
   it belongs in every menu including a closed one: the parent that filed a
   review-gated programme is normally complete and archived by the time anyone
   notices its children never queued. The count is only fetched on click. */
function gatedMenuItem(item){
  const n = gatedCounts.get(item.workid);
  return `<button data-act="gated" data-id="${item.workid}" role="menuitem">Release${n ? ` ${n}` : ''} gated item${n === 1 ? '' : 's'}…</button>`;
}

/* "Answer…" — offered whenever there IS a question and the server would still
   take an answer for it (question, todo, paused). An item parked in ToDo with
   an unanswered question is the case this catches that the row alone did not:
   the question is right there in the row, but nothing in the menu said so. */
function answerMenuItem(item){
  if (!hasQuestion(item) || !ANSWERABLE.includes(item.state)) return '';
  return `<button data-act="answerlb" data-id="${item.workid}" role="menuitem">Answer…</button>`;
}

function actionButtons(item){
  const s = item.state;
  /* issues 3 + 8 — an archived item is not a work item any more, it is history.
     Every state verb (queue, retry, todo, pause, complete) reaches into the OPEN
     queue only and answers 409; offering those buttons is what made a user click
     Retry five times on an item that could never run again. What IS possible:
     clone it into a fresh item, start a follow-up from it (both build a NEW item
     client-side and never touch this one), and delete the archive entry. */
  if (isClosed(item)) {
    const attempts = item.attempts ? ` after ${item.attempts} attempt${item.attempts===1?'':'s'}` : '';
    return `<button data-act="clone" data-id="${item.workid}" role="menuitem">Clone (run it again)</button>
      ${s === 'complete' ? `<button data-act="followup" data-id="${item.workid}" role="menuitem">Create Follow-up Request</button>` : ''}
      ${gatedMenuItem(item)}
      <div class="sep"></div>
      <span class="note">Closed ${esc(s)}${esc(attempts)} — a closed item cannot be requeued, retried, or edited. Clone makes a fresh copy you can run.</span>
      <button class="danger" data-act="delete" data-id="${item.workid}" role="menuitem">Delete from archive…</button>`;
  }
  if (s === 'in-progress') {
    // The engine is loosely coupled to the queue: while an agent is running this
    // item, queue-side state changes wouldn't alter engine behavior — so Clone,
    // and Stop (delivered to the engine as a file flag it polls mid-turn).
    return `<button data-act="clone" data-id="${item.workid}" role="menuitem">Clone</button>
      ${gatedMenuItem(item)}
      <button class="danger" data-act="stopitem" data-id="${item.workid}" role="menuitem">Stop (halt mid-run)…</button>
      <div class="sep"></div>
      <span class="note">Agent is running — Stop kills its session and returns the item to ToDo.</span>`;
  }
  if (s === 'scheduled') {
    // Engine-owned semantics: queueing a schedule clones a run into the queue;
    // the template itself never queues. Complete retires the schedule.
    return `<button data-act="queue" data-id="${item.workid}" role="menuitem">Run Now</button>
      <button data-act="pause" data-id="${item.workid}" role="menuitem">Pause Schedule</button>
      <button data-act="pauseedit" data-id="${item.workid}" role="menuitem">Pause &amp; Edit</button>
      <button data-act="complete" data-id="${item.workid}" role="menuitem">Complete (retire schedule)</button>
      <button data-act="clone" data-id="${item.workid}" role="menuitem">Clone</button>
      ${gatedMenuItem(item)}
      <div class="sep"></div>
      <span class="note">Run Now clones this schedule into a queued run (skipped if one is still open).</span>
      <button class="danger" data-act="delete" data-id="${item.workid}" role="menuitem">Delete</button>`;
  }
  if (s === 'question') {
    // Answering happens in the row OR in the Answer lightbox — the lightbox is
    // first because a long question is unreadable anywhere else. The rest of
    // the menu carries the escapes, including queueing it unanswered, which is
    // the human's call and not something the engine refuses.
    return `${answerMenuItem(item)}
      <button data-act="queue" data-id="${item.workid}" role="menuitem">Queue without answering</button>
      <button data-act="todo" data-id="${item.workid}" role="menuitem">Move to ToDo</button>
      <button data-act="pauseedit" data-id="${item.workid}" role="menuitem">Pause &amp; Edit</button>
      <button data-act="complete" data-id="${item.workid}" role="menuitem">Complete (no work needed)</button>
      <button data-act="clone" data-id="${item.workid}" role="menuitem">Clone</button>
      ${gatedMenuItem(item)}
      <div class="sep"></div>
      <span class="note">An agent is waiting on this decision — open the row and type the answer there.</span>
      <button class="danger" data-act="delete" data-id="${item.workid}" role="menuitem">Delete</button>`;
  }
  const b = [];
  if (s === 'todo' || s === 'paused') b.push(['queue','Queue']);
  // An item that already carries a question can be parked back into the
  // Question bucket (e.g. after editing the question text).
  if (hasQuestion(item) && (s === 'todo' || s === 'paused')) b.push(['question','Move to Question']);
  if ((s === 'todo' || s === 'paused') && item.sched && item.sched.kind) b.push(['schedule','Resume Schedule']);
  if (s === 'failed') b.push(['queue','Requeue (Retry)']);
  // paused/queued/failed can always go back to the ToDo review bucket — the
  // ToDo → Pause & Edit → ToDo round-trip must work from the menu too.
  if (s === 'paused' || s === 'queued' || s === 'failed') b.push(['todo','Move to ToDo']);
  if (s !== 'complete') { b.push(['complete','Complete']); b.push(['pauseedit','Pause &amp; Edit']); }
  if (s === 'complete') b.push(['followup','Create Follow-up Request']);
  b.push(['clone','Clone']);
  const rows = b.map(([a,l]) => `<button data-act="${a}" data-id="${item.workid}" role="menuitem">${l}</button>`);
  // First in the list: a todo/paused item still carrying an unanswered question
  // is one someone has to READ before any of the verbs below make sense.
  const answer = answerMenuItem(item);
  if (answer) rows.unshift(answer);
  rows.push(gatedMenuItem(item));
  rows.push('<div class="sep"></div>');
  rows.push(`<button class="danger" data-act="delete" data-id="${item.workid}" role="menuitem">Delete</button>`);
  return rows.join('');
}

/* A rebuild of the rows replaces the DOM wholesale, which would eat the caret
   out of an answer box mid-sentence. While one has focus the rebuild is held
   and replayed on blur — the engine's own updates can wait a few seconds; a
   half-typed answer cannot survive being retyped.

   An OPEN LIGHTBOX holds the rebuild for the same reason, one step larger. A
   question can run to several thousand characters, and reading one takes longer
   than the gap between two engine writes: every rebuild drops the scrolled
   element on the floor and the replacement starts back at the top, so the
   reader is walked to the top of the page every few seconds. A modal is the
   reader's whole attention — the queue behind it can wait until they close it.
   Only the PAINT waits; syncBodies() below still runs, and the data underneath
   keeps being patched by applyDelta() exactly as before. */
let renderHeld = false;
function renderBlocked(){
  return !!document.querySelector('.answerbox:focus') || $('overlay').classList.contains('open');
}
function render(){
  // Ahead of the focus check on purpose: a delta can invalidate the body of a
  // row that is open somewhere else on the page while an answer is being typed,
  // and that refetch should start now rather than wait on a blur. The fetch's
  // own render() is held in turn, and the blur replays it.
  syncBodies();
  if (renderBlocked()) { renderHeld = true; return; }
  renderHeld = false;
  if (firstLoad) { renderSkeleton(); return; }
  renderSummary(); renderRows();
}

/* ------------------------------------------------------------------ toast */
let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ------------------------------------------------------------------ lightboxes */

function openLb(title, bodyHtml, footHtml){
  // A modal takes the screen, so the Actions menu that opened it goes away with
  // it. This used to happen by accident — the next engine event repainted the
  // rows out from under the menu — and the repaint is now held while a lightbox
  // is up, so the close has to be said out loud.
  document.querySelectorAll('.actmenu.open').forEach(m => m.classList.remove('open'));
  $('lbTitle').textContent = title;
  $('lbBody').innerHTML = bodyHtml;
  $('lbFoot').innerHTML = footHtml || '<button class="btn" data-lbclose>Close</button>';
  $('overlay').classList.add('open');
}
/* Closing releases the hold render() took while the modal was up: everything
   that arrived behind it is already in `items`, so one rebuild catches the list
   up to now. Without this the list would sit on whatever it said when the modal
   opened until the next engine write happened along. */
function closeLb(){
  $('overlay').classList.remove('open');
  if (typeof lbStack !== 'undefined') lbStack = [];
  if (renderHeld && !renderBlocked()) render();
}

function fakeGroups(item){
  if (!item.tests) return [];
  const half = Math.floor(item.tests.total/2);
  return [
    { label:'default greeting', lastrun:item.times.mainworkdone||item.times.added, result:'passed', counts:'2/2', testlist:['testscript01.sh'] },
    { label:'named greeting', lastrun:item.times.mainworkdone||item.times.added, result:'passed', counts:'3/3', testlist:['testscript02.sh'] },
    { label:'contract', lastrun:item.times.mainworkdone||item.times.added,
      result: item.tests.passed === item.tests.total ? 'passed' : 'failed',
      counts:`${item.tests.passed - 5}/${item.tests.total - 5}`, testlist:['testscript03.sh','testscript05.sh'] },
    { label:'shout', lastrun:item.times.mainworkdone||item.times.added, result:'passed', counts:`${Math.min(half,20)}/${Math.min(half,20)}`, testlist:['testscript04.sh'] },
  ];
}

function lbTests(item){
  if (LIVE) {
    api(`/api/workitems/${item.workid}/tests`).then(data => {
      const files = data.testfiles || [];
      if (!files.length || files.every(f => !f.groups.length)) {
        return openLb('Test Details — ' + shortId(item),
          `<p style="color:var(--text-dim)">No test groups found for this work item's testfiles. Groups live in <span class="mono">*testgroup.iter.md</span> files declared by each marker file.</p>`);
      }
      const rows = files.flatMap(f => f.groups.map(g => {
        const ok = g.result === 'passed';
        return `<tr><td><b>${esc(g.label)}</b></td>
          <td><span class="chip" style="background:${ok?'var(--s-complete-bg)':(g.result?'var(--s-failed-bg)':'var(--surface2)')};color:${g.result?'#fff':'var(--text-dim)'}">${esc(g.result || 'never run')}</span></td>
          <td class="mono">${esc(g.counts || '–')}</td><td class="mono">${esc(g.lastrun ? fmtTs(g.lastrun) : '–')}</td>
          <td class="mono">${(g.testlist||[]).map(t => esc(typeof t === 'string' ? t : t.shell || t.id)).join(', ')}</td></tr>`;
      })).join('');
      openLb('Test Details — ' + shortId(item),
        `<table class="t"><thead><tr><th>Group</th><th>Result</th><th>Counts</th><th>Last run</th><th>Scripts</th></tr></thead><tbody>${rows}</tbody></table>
         <p style="color:var(--text-dim);font-size:12px;margin-bottom:0">Source: <span class="mono">${files.map(f=>esc(f.file)).join(' · ')}</span></p>`);
    }).catch(e => toast('Tests: ' + e.message));
    return;
  }
  const groups = fakeGroups(item);
  if (!groups.length) return openLb('Test Details — ' + shortId(item),
    `<p style="color:var(--text-dim)">No test results recorded for this work item yet. The engine stamps results from <span class="mono">*testgroup.iter.md</span> files at close-out.</p>`);
  const rows = groups.map(g => {
    const ok = g.result === 'passed';
    return `<tr>
      <td><b>${esc(g.label)}</b></td>
      <td><span class="chip" style="background:${ok?'var(--s-complete-bg)':'var(--s-failed-bg)'};color:#fff">${g.result}</span></td>
      <td class="mono">${esc(g.counts)}</td>
      <td class="mono">${esc(fmtTs(g.lastrun))}</td>
      <td class="mono">${g.testlist.map(esc).join(', ')}</td></tr>`;
  }).join('');
  openLb('Test Details — ' + shortId(item),
    `<table class="t"><thead><tr><th>Group</th><th>Result</th><th>Counts</th><th>Last run</th><th>Scripts</th></tr></thead><tbody>${rows}</tbody></table>
     <p style="color:var(--text-dim);font-size:12px;margin-bottom:0">Source: <span class="mono">${item.testfiles.map(esc).join(' · ')}</span></p>`);
}

function dur(a,b){
  if (!a || !b) return '';
  const ms = new Date(b) - new Date(a);
  if (ms < 0) return '';
  const s = Math.round(ms/1000);
  if (s < 90) return s + 's';
  if (s < 5400) return Math.round(s/60) + 'm ' + (s%60) + 's';
  return (s/3600).toFixed(1) + 'h';
}

function lbTimes(item){
  const t = item.times;
  const steps = [
    ['Added', t.added, ''],
    ['Started', t.start, dur(t.added, t.start) && `waited ${dur(t.added,t.start)} in queue`],
    ['Prework done', t.preworkdone, dur(t.start,t.preworkdone) && `prework ${dur(t.start,t.preworkdone)}`],
    ['Mainwork done', t.mainworkdone, dur(t.preworkdone,t.mainworkdone) && `mainwork ${dur(t.preworkdone,t.mainworkdone)}`],
    ['Postwork done', t.postworkdone, dur(t.mainworkdone,t.postworkdone) && `postwork ${dur(t.mainworkdone,t.postworkdone)}`],
    ['Closed', t.closed, dur(t.added,t.closed) && `total ${dur(t.added,t.closed)}`],
  ];
  // A question can be raised at any point in a run, so its two stamps ride at
  // the end rather than claiming a place in the linear lifecycle above.
  if (t.asked) steps.push(['Question asked', t.asked, 'parked for a human decision']);
  if (t.answered) steps.push(['Answered', t.answered, dur(t.asked,t.answered) && `waited ${dur(t.asked,t.answered)} on a human`]);
  const rows = steps.map(([label, ts, note]) =>
    `<div class="tl"><span class="st">${label}</span><span class="ts" title="${ts ? `Stored UTC: ${esc(ts)}` : ''}">${ts ? esc(fmtTs(ts)) : '—'}</span><span class="du">${note||''}</span></div>`).join('');
  openLb('Time Records — ' + shortId(item),
    `<div class="timeline">${rows}</div>
     <p style="color:var(--text-dim);font-size:12px;margin-bottom:0">Attempts: <b>${item.attempts}</b>${item.lasterror ? ` · last error: <span class="mono">${esc(item.lasterror)}</span>` : ''}</p>`);
}

function lbContext(item){
  const resolved = item.context.map(p => p.replace('./', PROJECT_ROOT + '/').replace('~/', HOME + '/'));
  openLb('Context and Prompts — ' + shortId(item), `
    <h4 style="margin:0 0 6px">Context patterns → resolved files</h4>
    <table class="t"><tbody>${item.context.map((p,i) =>
      `<tr><td class="mono">${esc(p)}</td><td class="mono" style="color:var(--text-dim)">${esc(resolved[i])}</td></tr>`).join('')}</tbody></table>
    <h4 style="margin:16px 0 6px">Source instructions applied</h4>
    <p style="margin:0" class="mono" style="font-size:12px">.iter/source/${item.source==='user'?'user':(item.source==='error'?'error':'agent')}.md${item.source.startsWith('agent') ? ` <span style="color:var(--text-dim)">({type} = ${esc(sourceLabel(item.source).toLowerCase())})</span>`:''}</p>
    <h4 style="margin:16px 0 6px">Composed turn sequence</h4>
    <table class="t"><thead><tr><th>#</th><th>Turn</th><th>Prompt source</th></tr></thead><tbody>
      ${[
        ...item.prework.map((p,i)=>[`${i+1}`, prepostNames().includes(p)?`prework:${p}`:'prework:inline', prepostNames().includes(p)?`.iter/prepostwork/${p}.${prepostExec(p)==='shell'?'sh':'md'}`:'inline literal from work item']),
        [`${item.prework.length+1}`, 'mainwork (+ spin-up on first turn)',
          'work item request + agent definition + source instructions + context list'
          + (hasQuestion(item) && hasAnswer(item) ? ' — prefaced by the answered question (asked → answer), engine-composed, not stored in the request' : '')],
        ...item.postwork.map((p,i)=>[`${item.prework.length+2+i}`, `postwork:${p}`, `.iter/prepostwork/${p}.${prepostExec(p)==='shell'?'sh':'md'}`]),
        [`${item.prework.length+item.postwork.length+2}`, 'selfcheck', 'engine-composed: re-read agent definition, confirm completion'],
      ].map(([n,t2,s]) => `<tr><td class="mono">${n}</td><td><b>${esc(t2)}</b></td><td style="color:var(--text-dim)">${esc(s)}</td></tr>`).join('')}
    </tbody></table>`);
}

function lbLogs(item){
  if (LIVE) {
    api(`/api/workitems/${item.workid}/logs`).then(data => {
      const text = (data.lines && data.lines.length)
        ? data.lines.join('\n')
        : '(no engine log lines for this item yet — logging may be disabled, or it has not been picked up)';
      openLb('Engine Logs — ' + shortId(item),
        `<div class="textblock mono" style="max-height:52vh">${esc(text)}</div>`);
    }).catch(e => toast('Logs: ' + e.message));
    return;
  }
  const tag = `${item.type}#${(seq % 7) + 1}`;
  const lines = [];
  const push = (ts, lvl, msg) => ts && lines.push(`${fmtTimeOnly(ts)} ${lvl}  [${tag}]  ${msg}`);
  push(item.times.start, 'INFO ', `picked ${shortId(item)} "${item.title.slice(0,44)}…" (prio ${item.priority}, source ${item.source}, attempt ${item.attempts||1})`);
  push(item.times.start, 'INFO ', `codepath lock acquired: ${item.codepath}`);
  item.prework.forEach(p => push(item.times.preworkdone, 'INFO ', `prework:${prepostNames().includes(p)?p:'inline(…)'} done`));
  push(item.times.mainworkdone, 'INFO ', 'mainwork done');
  item.postwork.forEach(p => push(item.times.postworkdone, 'INFO ', `postwork:${p} done`));
  if (item.state === 'failed') push(item.times.start, 'ERROR', item.lasterror || 'mainwork failed');
  if (item.state === 'complete') push(item.times.closed, 'INFO ', `complete → workitems_closed.jsonl; lock released (${shortId(item)})`);
  if (!lines.length) lines.push('(no engine activity yet — item has not been picked up)');
  openLb('Engine Logs — ' + shortId(item),
    `<div class="textblock mono" style="max-height:52vh">${esc(lines.join('\n'))}</div>`);
}

/* ------------------------------------------------------------------ edit / create form */

let draft = null;   // { mode:'create'|'edit'|'clone'|'followup', base:workid|null, data:{...} }

/* structureV2: an item may lock SEVERAL codepaths (a node's codedirs), with the
   first as the primary/working directory. The form edits the whole list, so a
   malformed one can be repaired in place instead of by delete-and-recreate. */
function formCodepaths(d){
  const list = (d.codepaths && d.codepaths.length) ? d.codepaths : [d.codepath];
  return list.map(p => (p || '').trim()).filter(Boolean);
}
function codepathLines(){
  return $('f_codepath').value.split('\n').map(s => s.trim()).filter(Boolean);
}

/* What an UNSET automation mode actually resolves to, spelled out instead of
   hidden behind the word "default": a user-filed item takes the project setting
   (issue 7a), an agent-created one inherits the item that created it. */
function automationInheritLabel(src){
  return (!src || src === 'user' || src === 'error' || src === 'scheduler')
    ? `project default — ${DEFAULT_AUTOMATION} (Settings → default_automation)`
    : 'inherit from the item that created this one';
}

function openForm(mode, source, priorState){
  /* Edit, clone and follow-up all copy an existing item's TEXT into the form,
     and the form's save writes every one of those fields back. Opened on a
     summary — no mainwork, no context, no question — Save would quietly replace
     the real request with an empty one. Every caller fetches the body first;
     this is the backstop that makes a race a toast instead of data loss.
     (`create` from a Projects node passes a synthesized item, not a queue row.) */
  if (source && LIVE && mode !== 'create' && isSummary(source)) {
    ensureBody(source.workid);
    toast('Still loading this item’s request — try again in a moment');
    return;
  }
  // create with a source = prefilled create (e.g. Create WorkItem from a Projects node)
  const d = source ? JSON.parse(JSON.stringify(source)) : mk({});
  if (mode === 'create' && !source) d.context = literalContextLines();
  if (mode === 'clone') { d.workid = uuid(); d.state='todo'; d.attempts=0; d.output=''; d.tests=null; d.lasterror='';
    d.times = { added:nowIso(), start:'', preworkdone:'', mainworkdone:'', postworkdone:'', closed:'' }; }
  if (mode === 'followup') {
    const parent = source;
    Object.assign(d, mk({ title:'Follow-up: ' + parent.title.slice(0,60), type:parent.type,
      codepath:parent.codepath, codepath_ignore:(parent.codepath_ignore||[]).slice(),
      context:parent.context.slice(), testfiles:parent.testfiles.slice(),
      mainwork:`Follow-up to ${shortId(parent)} ("${parent.title.slice(0,60)}").\n\n` , source:'user' }));
  }
  draft = { mode, base: mode==='edit' ? source.workid : null, data: d };
  const titleMap = { create:'New WorkItem', edit:'Edit WorkItem — ' + shortId(d), clone:'Clone WorkItem', followup:'Create Follow-up Request' };

  const agentOpts = AGENTS.map(a => `<option value="${a}" ${d.type===a?'selected':''}>${a}</option>`).join('');
  const srcOpts = ['user','error','scheduler',...AGENTS.map(a=>'agent: '+a)]
    .map(s => `<option value="${esc(s)}" ${d.source===s?'selected':''}>${esc(s)}</option>`).join('');
  const modelOpts = `<option value="" ${d.model?'':'selected'}>model: agent default</option>` +
    MODELS.map(m => `<option value="${m}" ${d.model===m?'selected':''}>model: ${m}</option>`).join('');
  const inheritLabel = esc(automationInheritLabel(d.source));

  openLb(titleMap[mode], `
    <div class="form" id="editForm">
      <span class="flabel">Title</span>
      <input type="text" id="f_title" value="${esc(d.title)}" placeholder="Short description, 20–40 chars">
      <span class="flabel">Agent</span>
      <div class="inline">
        <select id="f_type">${agentOpts}</select>
        <select id="f_exec" title="Executor — agent: a claude session does the work (LLM). shell: the engine runs prework/mainwork/postwork as shell commands directly, no LLM.">
          <option value="agent" ${(d.exec||'agent')!=='shell'?'selected':''}>exec: agent (LLM)</option>
          <option value="shell" ${d.exec==='shell'?'selected':''}>exec: shell (engine-run)</option>
        </select>
        <select id="f_model" title="Which model runs this ONE item, overriding the agent type's default. Simple, well-specified mechanical work — comment sweeps, doc repointing, rename plumbing — runs fine on sonnet; complex or fuzzy work wants fable. Leave it on the agent default when unsure.">${modelOpts}</select>
        <label title="Lower runs sooner — P0 is most urgent, default 5">Priority <input type="range" id="f_priority" min="0" max="10" value="${d.priority}"
          oninput="document.getElementById('pv').textContent=this.value"><span class="rangeval" id="pv">${d.priority}</span></label>
        <label>Risk <input type="range" id="f_risk" min="0" max="10" value="${d.risk}"
          oninput="document.getElementById('rv').textContent=this.value"><span class="rangeval" id="rv">${d.risk}</span></label>
      </div>
      <span class="flabel">Source</span>
      <div class="inline"><select id="f_source">${srcOpts}</select>
        <span style="color:var(--text-dim);font-size:12px">who requested this work — <b>scheduler</b> makes this a schedule template</span></div>
      <span class="flabel">Automation</span>
      <div class="inline">
        <select id="f_automation" title="How work items created BY this one are born — inherited down the whole chain of agent handoffs. Guards (reject, non-convergence, failed dependencies) still land items in ToDo regardless.">
          <option value="" ${d.automation?'':'selected'}>${inheritLabel}</option>
          <option value="review" ${d.automation==='review'?'selected':''}>review each stage — created items born ToDo</option>
          <option value="auto" ${d.automation==='auto'?'selected':''}>fully automated — created items born Queued</option>
        </select>
        <span style="color:var(--text-dim);font-size:12px">applies to items this one CREATES (plan → code/testwriter → …); the engine enforces it, agent prompts can't override</span>
      </div>
      <span class="flabel" id="f_schedlabel" style="display:none">Schedule</span>
      <div id="f_schedrow" style="display:none">
        <div class="inline">
          <select id="f_sk">
            <option value="every" ${(d.sched&&d.sched.kind)==='every'?'selected':''}>every NN minutes</option>
            <option value="daily" ${(d.sched&&d.sched.kind)==='daily'?'selected':''}>every day at HH:MM</option>
            <option value="weekly" ${(d.sched&&d.sched.kind)==='weekly'?'selected':''}>weekly on a day at HH:MM</option>
            <option value="stale" ${(d.sched&&d.sched.kind)==='stale'?'selected':''}>when not run in NN minutes</option>
          </select>
          <label id="f_sk_every">NN <input type="number" id="f_severy" min="1" style="width:80px" value="${(d.sched&&d.sched.every_min)||60}"> min</label>
          <label id="f_sk_day" style="display:none">on <select id="f_sday">${['mon','tue','wed','thu','fri','sat','sun'].map(x=>`<option ${(d.sched&&d.sched.day)===x?'selected':''}>${x}</option>`).join('')}</select></label>
          <label id="f_sk_at" style="display:none">at <input type="text" id="f_sat" class="mono" style="width:70px" placeholder="HH:MM" value="${esc((d.sched&&d.sched.at)||'02:00')}"></label>
          <label id="f_sk_tz" style="display:none">tz <input type="text" id="f_stz" class="mono" style="width:180px" placeholder="${esc(USER_TZ)} (preferences)" value="${esc((d.sched&&d.sched.tz)||'')}"></label>
        </div>
        <div class="pathhint" style="opacity:.75">minute granularity (itersched checks every 59s) · daily/weekly occurrences missed while the server was down are skipped, never backfilled · each run is a CLONE queued at this item’s priority · one open run at a time — a still-open run suppresses the next fire</div>
      </div>
      <span class="flabel top-align">CodePaths</span>
      <div>
        <textarea id="f_codepath" rows="1" style="width:100%" class="mono"
          placeholder="relative (./src) or absolute — resolved to absolute on save; one DIRECTORY per line, first = primary">${esc(formCodepaths(d).join('\n'))}</textarea>
        <div class="pathhint" id="f_pathhint">${formCodepaths(d).map(p => '→ ' + esc(absCodepath(p))).join('<br>')}</div>
        <div class="pathhint" style="opacity:.75">every line is locked for the whole run and all of them feed the agent's context; the first is the working directory · each must be a DIRECTORY — a file cannot hold the <span class="mono">.iter.lock</span> and would inherit its parent's conflicts</div>
      </div>
      <span class="flabel top-align">CodePath ignore</span>
      <div>
        <textarea id="f_codepath_ignore" rows="1" style="width:100%" class="mono"
          placeholder="subtrees carved OUT of the lock scope — one .gitignore-style pattern per line, relative to CodePath (e.g. test/)">${esc((d.codepath_ignore||[]).join('\n'))}</textarea>
        <div class="pathhint" style="opacity:.75">this item won’t lock or touch these subtrees, so another work item can own them in parallel (e.g. code ignores <span class="mono">test/</span> while a testwriter locks it) · special: <span class="mono">**</span> carves out EVERYTHING = lockless — only for run-only items that write nothing (the Test Loop sweep), never for items that edit files</div>
      </div>
      <span class="flabel top-align">Depends on</span>
      <div>
        <textarea id="f_depends" rows="1" style="width:100%" class="mono"
          placeholder="work items this one must wait for — one workid or unique suffix (last-12 shown in the header) per line">${esc((d.depends_on||[]).join('\n'))}</textarea>
        <div class="pathhint" style="opacity:.75">gates dispatch of QUEUED items only: not runnable until each dependency closes complete AND everything it created closed complete too · a FAILED dependency flips this item to todo for review · unknown/ambiguous ids and cycles are refused on save</div>
      </div>
      <span class="flabel top-align">Context</span>
      <div>
        <textarea id="f_context" rows="2" style="width:100%" placeholder="one path or glob per line">${esc(d.context.join('\n'))}</textarea>
        <div class="pathhint" id="f_ctxhint"></div>
        <div class="pathhint" style="opacity:.75">one rule: globs ok anywhere · relative = from code_root (Settings; default = where .iter lives) · ~ = home · {codepath} = this work item’s code</div>
      </div>
      <span class="flabel top-align">Test files</span>
      <div>
        <textarea id="f_testfiles" rows="1" style="width:100%">${esc(d.testfiles.join('\n'))}</textarea>
        <div class="pathhint" id="f_tfhint"></div>
      </div>
      <span class="flabel top-align">Prework</span>
      <div>${pillRow(d.prework, true, 'prework')}
        <input type="text" id="f_prelit" class="mono" style="margin-top:7px;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--text)"
          placeholder="…or type an inline literal prework step and press Enter"></div>
      <span class="flabel top-align">Request</span>
      <textarea id="f_mainwork" rows="7" placeholder="The mainwork prompt: exactly what needs to be done, acceptance criteria included.">${esc(d.mainwork)}</textarea>
      <span class="flabel top-align" id="f_qlabel" style="display:none">Question</span>
      <div id="f_qrow" style="display:none">
        <textarea id="f_question" rows="6" style="width:100%" placeholder="The decision a human has to make: where in the codebase this sits and why it matters now, the question itself, two to four researched options with what each buys and costs, and which one you'd take.">${esc(d.question||'')}</textarea>
        <div class="pathhint" style="opacity:.75">saving into <b>Question</b> parks the item until it is answered — the request above is what runs once it is</div>
        <textarea id="f_answer_form" rows="3" style="width:100%;margin-top:9px" placeholder="Answer (optional here — the Answer… button on the row is the normal path)">${esc(d.answer||'')}</textarea>
      </div>
      <span class="flabel top-align">Postwork</span>
      <div>${pillRow(d.postwork, true, 'postwork')}
        <input type="text" id="f_postlit" class="mono" style="margin-top:7px;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--text)"
          placeholder="…or type an inline literal postwork step and press Enter"></div>
    </div>`,
    (() => {
      // Default target state: new items default to queued; pause & edit defaults to the
      // item's state before pausing. Scheduler-sourced items can only land in
      // scheduled|paused (syncSched below rewrites the options live).
      const SAVE_STATES = [['queued','Queued'],['todo','ToDo'],['question','Question'],['paused','Paused']];
      const def = mode === 'edit'
        ? (SAVE_STATES.some(([v]) => v === priorState) ? priorState : 'queued')
        : 'queued';
      const opts = SAVE_STATES.map(([v,l]) => `<option value="${v}" ${v===def?'selected':''}>${l}</option>`).join('');
      return `<span style="margin-right:auto;color:var(--text-dim);font-size:12.5px">Saves the work item into the selected state — <b>Queued</b> is immediately eligible.</span>
         <button class="btn" data-lbclose>Cancel</button>
         <span class="savegroup">
           <button class="btn primary" id="saveGo">${mode === 'edit' ? 'Save and set to' : 'Create and set to'}</button>
           <select id="f_savestate" aria-label="State to save the work item into">${opts}</select>
         </span>`;
    })());

  $('f_prelit').addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); addLit('prework', e.target); }});
  $('f_postlit').addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); addLit('postwork', e.target); }});
  $('f_codepath').addEventListener('input', () => {
    $('f_pathhint').innerHTML = codepathLines().map(p => '→ ' + esc(absCodepath(p))).join('<br>');
  });
  // Name the model the picked agent actually runs, so the choice is between two
  // named models rather than one named and one unknown.
  const syncModelDefault = () => {
    const a = AGENT_DEFS.find(x => x.type === $('f_type').value);
    $('f_model').options[0].textContent =
      a && a.model ? `model: agent default (${a.model})` : 'model: agent default';
  };
  $('f_type').addEventListener('change', syncModelDefault);
  syncModelDefault();
  // Per-agent defaults (create mode only): picking an agent type pre-fills
  // codepath / codepath_ignore from the agent def's default_codepath(_ignore)
  // frontmatter, so conventions (usecase agent → usecases dir + test-dir carve)
  // fill themselves in. A field is only overwritten while it still holds a
  // default — the generic './src' / empty, or a default this form applied on an
  // earlier selection. User-typed values are never clobbered.
  if (mode === 'create') {
    const applied = { codepath: null, ignore: null };
    const applyAgentDefaults = () => {
      const nd = agentDefaults($('f_type').value);
      const cp = $('f_codepath'), ig = $('f_codepath_ignore');
      const cpVal = cp.value.trim();
      if (cpVal === './src' || cpVal === '' || cpVal === applied.codepath) {
        const v = nd.codepath || './src';
        if (cp.value !== v) { cp.value = v; cp.dispatchEvent(new Event('input')); }
        applied.codepath = nd.codepath ? v : null;
      }
      const igVal = ig.value.trim();
      if (igVal === '' || igVal === applied.ignore) {
        ig.value = nd.ignore.join('\n');
        applied.ignore = nd.ignore.length ? ig.value : null;
      }
    };
    $('f_type').addEventListener('change', applyAgentDefaults);
    applyAgentDefaults();
  }
  // Scheduler source: reveal the schedule fields, restrict the save-state options
  // to scheduled|paused, and nudge default priority to 2 ("run soon after the
  // scheduled time" — lower = sooner). All reversible by switching Source back.
  const syncSched = () => {
    const isSched = $('f_source').value === 'scheduler';
    $('f_automation').options[0].textContent = automationInheritLabel($('f_source').value);
    $('f_schedlabel').style.display = isSched ? '' : 'none';
    $('f_schedrow').style.display = isSched ? '' : 'none';
    const kind = $('f_sk').value;
    $('f_sk_every').style.display = (kind === 'every' || kind === 'stale') ? '' : 'none';
    $('f_sk_day').style.display = kind === 'weekly' ? '' : 'none';
    $('f_sk_at').style.display = (kind === 'daily' || kind === 'weekly') ? '' : 'none';
    $('f_sk_tz').style.display = (kind === 'daily' || kind === 'weekly') ? '' : 'none';
    const cur = $('f_savestate').value;
    const opts = isSched ? [['scheduled','Scheduled'],['paused','Paused']]
                         : [['queued','Queued'],['todo','ToDo'],['question','Question'],['paused','Paused']];
    const def = opts.some(([v]) => v === cur) ? cur
      : isSched ? (priorState === 'paused' ? 'paused' : 'scheduled')
      : (mode === 'edit' && opts.some(([v]) => v === priorState) ? priorState : 'queued');
    $('f_savestate').innerHTML = opts.map(([v,l]) => `<option value="${v}" ${v===def?'selected':''}>${l}</option>`).join('');
    if (isSched && +$('f_priority').value === 5) { $('f_priority').value = 2; document.getElementById('pv').textContent = '2'; }
  };
  $('f_source').addEventListener('change', syncSched);
  $('f_sk').addEventListener('change', syncSched);
  syncSched();
  // The Question/Answer pair is clutter on the 95% of items that are plain
  // work, so it shows only when this item already carries a question or is
  // being saved INTO the Question state (features/Question_state.md).
  const syncQuestion = () => {
    const on = !!$('f_question').value.trim() || $('f_savestate').value === 'question';
    $('f_qlabel').style.display = on ? '' : 'none';
    $('f_qrow').style.display = on ? '' : 'none';
    if (on && $('f_savestate').value === 'question') $('f_question').focus();
  };
  $('f_savestate').addEventListener('change', syncQuestion);
  syncQuestion();
  wirePathHints('f_context', 'f_ctxhint', 'f_codepath');
  wirePathHints('f_testfiles', 'f_tfhint', 'f_codepath');
  $('saveGo').addEventListener('click', () => saveDraft($('f_savestate').value));
}

function addLit(phase, input){
  const v = input.value.trim();
  if (!v) return;
  draft.data[phase].push(v);
  input.closest('div').querySelector('.pills').insertAdjacentHTML('beforeend',
    `<span class="pill on inline-lit" title="Inline literal step: ${esc(v)}">“${esc(v)}”</span>`);
  input.value = '';
}

function saveDraft(targetState){
  const d = draft.data;
  d.title = $('f_title').value.trim() || '(untitled work item)';
  d.type = $('f_type').value;
  d.priority = +$('f_priority').value;
  d.risk = +$('f_risk').value;
  d.source = $('f_source').value;
  // entered relative, stored absolute; first line is the primary
  d.codepaths = codepathLines().map(absCodepath);
  if (!d.codepaths.length) d.codepaths = [absCodepath('.')];
  d.codepath = d.codepaths[0];
  d.codepath_ignore = $('f_codepath_ignore').value.split('\n').map(s=>s.trim()).filter(Boolean);
  d.depends_on = $('f_depends').value.split('\n').map(s=>s.trim()).filter(Boolean);
  d.context = $('f_context').value.split('\n').map(s=>s.trim()).filter(Boolean);
  d.testfiles = $('f_testfiles').value.split('\n').map(s=>s.trim()).filter(Boolean);
  d.mainwork = $('f_mainwork').value;
  d.question = $('f_question').value.trim();
  d.answer = $('f_answer_form').value.trim();
  d.exec = $('f_exec').value;
  d.model = $('f_model').value;
  d.automation = $('f_automation').value;
  // A NEW user-filed item has no parent to inherit from, so "unset" here means
  // the project default — resolved now, on the client, rather than left as an
  // empty string the engine would have to read as "review" (issue 7a).
  if (draft.mode !== 'edit' && !d.automation
      && ['user','error','scheduler'].includes(d.source)) {
    d.automation = DEFAULT_AUTOMATION;
  }
  // The Question state exists to carry a question; an empty one parks the item
  // in a bucket that tells the next reader nothing.
  if (targetState === 'question' && !d.question) {
    toast('Write the question first — a Question item without one tells nobody anything');
    $('f_question').focus();
    return;
  }
  if (targetState === 'question' && !d.times.asked) d.times.asked = nowIso();
  if ($('f_source').value === 'scheduler') {
    d.sched = { kind: $('f_sk').value, every_min: +$('f_severy').value || 0,
      at: $('f_sat').value.trim(), day: $('f_sday').value, tz: $('f_stz').value.trim(),
      last_fired: (d.sched && d.sched.last_fired) || '' };
  } else {
    d.sched = { kind:'', every_min:0, at:'', day:'', tz:'', last_fired:'' };
  }

  if (LIVE) {
    const mode = draft.mode;
    const done = () => { draft = null; closeLb(); return loadAll(); };
    if (mode === 'edit') {
      const fields = { title: d.title, type: d.type, priority: d.priority, risk: d.risk,
        source: d.source, codepath: d.codepath, codepaths: d.codepaths, codepath_ignore: d.codepath_ignore,
        depends_on: d.depends_on, context: d.context, testfiles: d.testfiles,
        prework: d.prework, postwork: d.postwork, mainwork: d.mainwork,
        question: d.question, answer: d.answer,
        exec: d.exec, sched: d.sched, automation: d.automation, model: d.model };
      const stateAction = targetState === 'queued' ? 'queue' : targetState === 'todo' ? 'todo'
        : targetState === 'scheduled' ? 'schedule' : targetState === 'question' ? 'question' : 'pause';
      const base = draft.base;
      // Flipping an item to `auto` does NOT retroactively queue the children it
      // already created under review mode — correct, but silent, and a queue
      // that stalls at every stage boundary overnight is what silence costs
      // (issue 7c). So the save offers the one-time release straight away.
      const flippedToAuto = d.automation === 'auto'
        && (items.find(i => i.workid === base) || {}).automation !== 'auto';
      let warn = '';
      api(`/api/workitems/${base}`, { method: 'PATCH', body: JSON.stringify(fields) })
        .then(r => { warn = r && r.warning ? r.warning : ''; return postAction(base, stateAction); })
        .then(() => { toast(warn ? `Saved as ${targetState} — ${warn}` : `Saved as ${targetState}`); return done(); })
        .then(() => { if (flippedToAuto) return releaseGated(base, { quiet: true }); })
        .catch(e => toast('Save failed: ' + e.message));
    } else {
      d.state = targetState;
      const what = mode === 'followup' ? 'Follow-up' : mode === 'clone' ? 'Clone' : 'WorkItem';
      api('/api/workitems', { method: 'POST', body: JSON.stringify(d) })
        .then(r => {
          toast(r.warning ? `${what} created — warning: ${r.warning}` : `${what} created as ${targetState}`);
          return done();
        })
        .catch(e => toast('Create failed: ' + e.message));
    }
    return;
  }

  d.state = targetState;
  if (draft.mode === 'edit') {
    const idx = items.findIndex(i => i.workid === draft.base);
    items[idx] = d;
    toast(`Saved as ${targetState}`);
  } else {
    items.unshift(d);
    openIds.add(d.workid);
    const what = draft.mode === 'followup' ? 'Follow-up' : draft.mode === 'clone' ? 'Clone' : 'WorkItem';
    toast(`${what} created as ${targetState}`);
  }
  draft = null;
  closeLb(); render();
}

/* ------------------------------------------------------------------ actions */

async function postAction(id, action){
  return api(`/api/workitems/${id}/action`, { method: 'POST', body: JSON.stringify({ action }) });
}

function confirmStop(item, onConfirm){
  // git_start_commit is stamped by the engine at run start — HEAD of the
  // item's codepath repo the moment work began. If it exists, offer the exact
  // command that undoes everything this run did.
  const undo = item.git_start_commit
    ? `<p>You can undo any changes with the git command:</p>
       <pre class="mono" style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 12px;overflow-x:auto">cd ${esc(absCodepath(item.codepath))}
git reset --hard ${esc(item.git_start_commit)}</pre>`
    : '';
  openLb('Stop this work item?', `
    <p style="margin-top:0"><b>This stops work mid-stream, and may result in partially
    completed work.</b></p>
    <p>The agent session for <b>${esc(item.title)}</b> <span class="mono">(${shortId(item)})</span>
    is killed immediately and the item returns to <b>ToDo</b> for review (partial output kept).</p>
    ${undo}`,
    `<button class="btn" data-lbclose>Cancel</button>
     <button class="btn danger" id="confirmStop">Stop work item</button>`);
  $('confirmStop').addEventListener('click', onConfirm);
}

/* Deleting an OPEN item drops one row off a queue; deleting a CLOSED one edits
   history — the archive is where "what this project has done" is kept, and the
   entry stops counting in the header and the dashboard the moment it goes
   (issue 8). Same button, two very different sentences. */
function confirmDelete(item, onConfirm){
  const closed = isClosed(item);
  const who = `<b>${esc(item.title)}</b> <span class="mono">(${shortId(item)})</span>`;
  openLb(closed ? 'Delete this archive entry?' : 'Delete work item?',
    closed
      ? `<p style="margin-top:0">This removes ${who} from the <b>closed archive</b> — the permanent
           record of the work this project has finished.</p>
         <p>The row is deleted from the queue database and is gone for
           good: its output, its timings and its <b>${esc(item.state)}</b> result stop counting in the header
           counts and in the dashboard history. <b>Nothing keeps a copy and there is no undo.</b></p>
         <p style="color:var(--text-dim);font-size:12.5px">Worth doing for junk — an item that failed on a
           configuration error and produced nothing. Not worth doing for history you may want to read later.</p>`
      : `<p style="margin-top:0">This permanently removes ${who} from the queue. The engine keeps no copy.</p>`,
    `<button class="btn" data-lbclose>Cancel</button>
     <button class="btn danger" id="confirmDelete">${closed ? 'Delete permanently' : 'Delete'}</button>`);
  $('confirmDelete').addEventListener('click', onConfirm);
}

/* issue 13b — optimistic state changes. For queue/pause/todo/complete the
   server's answer is a foregone conclusion in every case but a refusal, so the
   row repaints before the POST leaves; a refusal (a 409 on a closed item, an
   engine-owned in-progress item) puts the old state straight back, so the screen
   never keeps a lie. The SSE delta that follows carries the authoritative
   record, and nothing here refetches the queue. */
const OPTIMISTIC_STATE = {
  queue: 'queued', pause: 'paused', todo: 'todo',
  complete: 'complete', question: 'question', schedule: 'scheduled',
};

async function serverAction(id, action){
  const item = items.find(i => i.workid === id);
  if (!item) return;
  // A scheduled item's "Run Now" CLONES a run into the queue and leaves the
  // template alone, and only the engine knows whether a run is already open —
  // nothing to predict, so that one waits for the answer.
  const next = item.state === 'scheduled' ? null : OPTIMISTIC_STATE[action];
  const before = { state: item.state, closed: item.times.closed, lasterror: item.lasterror };
  if (next) {
    item.state = next;
    if (action === 'queue') item.lasterror = '';
    // complete archives the item, and it is times.closed that flips the row to
    // the archived action menu — stamp it now, the delta overwrites it with the
    // engine's own stamp a moment later.
    if (next === 'complete' && !item.times.closed) item.times.closed = nowIso();
    render();
  }
  try {
    const r = await postAction(id, action);
    if (r.fired) {           // schedule fired a run: a NEW item exists, which a delta can't invent
      toast(`Run queued (${String(r.workid).slice(0,8)}) — schedule unchanged`);
      return loadAll();
    }
    if (r.state && r.state !== item.state) { item.state = r.state; render(); }
    toast(`${shortId(item)} → ${r.state || next || 'done'}`);
  } catch (e) {
    if (next) {
      item.state = before.state;
      item.lasterror = before.lasterror;
      item.times.closed = before.closed;
      render();
    }
    toast('Action failed: ' + e.message);
  }
}

/* issue 7c — "N items were born under review mode and still need a one-time
   release". The count comes from the server's own descendant walk (the same one
   dep_status uses), so this asks rather than guessing, and it asks only when
   someone clicks. Guard-parked and question items are never in the answer. */
async function gatedCount(id){
  if (!LIVE) {
    // The demo has no created_by chain, so every OTHER item parked in todo for
    // no stated reason stands in for the review-gated descendant set.
    const gated = items.filter(i => i.state === 'todo' && !i.todo_reason && i.workid !== id);
    return { count: gated.length, ids: gated.map(i => i.workid) };
  }
  return api(`/api/workitems/${id}/gated`);
}

/* `quiet` is the automatic offer made right after an automation change: it
   should say nothing at all when there is nothing gated, because the user asked
   for a save, not for this. A click on the menu item is the loud path. */
async function releaseGated(id, opts = {}){
  const item = items.find(i => i.workid === id);
  if (!item) return;
  let data;
  try { data = await gatedCount(id); }
  catch (e) { if (!opts.quiet) toast('Gated descendants: ' + e.message); return; }
  const n = data.count || 0;
  gatedCounts.set(id, n);
  render();
  if (!n) {
    if (!opts.quiet) toast(`Nothing gated — no descendant of ${shortId(item)} is waiting on a review-gate release`);
    return;
  }
  const ids = (data.ids || []).slice(0, 40).map(id12);
  openLb(`Release ${n} gated item${n===1?'':'s'}?`, `
    <p style="margin-top:0"><b>${n}</b> work item${n===1?'':'s'} descended from ${esc(item.title)}
      ${n===1?'is':'are'} sitting in ToDo for one reason only: ${n===1?'it was':'they were'} born under
      review-mode automation and never released. Releasing moves ${n===1?'it':'them'} to <b>Queued</b>.</p>
    <p style="color:var(--text-dim);font-size:12.5px">${data.guarded
        ? `${data.guarded} further descendant${data.guarded===1?' is':'s are'} parked by a guard and will be left alone — those`
        : 'Items a guard parked and items waiting on a question are not touched — those'} want your judgment, not
      a release. Dependencies still hold: a released item whose dependency has not closed waits at the dispatch
      gate instead of running.</p>
    <div class="textblock mono" style="max-height:22vh">${esc(ids.join('\n'))}${data.ids && data.ids.length > 40 ? `\n… and ${data.ids.length - 40} more` : ''}</div>`,
    `<button class="btn" data-lbclose>Cancel</button>
     <button class="btn primary" id="confirmGated">Release ${n} item${n===1?'':'s'}</button>`);
  $('confirmGated').addEventListener('click', async () => {
    closeLb();
    if (!LIVE) {
      (data.ids || []).forEach(gid => {
        const g = items.find(i => i.workid === gid);
        if (g) { g.state = 'queued'; g.lasterror = ''; }
      });
      gatedCounts.set(id, 0); render();
      toast(`Released ${n} gated item${n===1?'':'s'}`);
      return;
    }
    try {
      const r = await api(`/api/workitems/${id}/action`,
        { method:'POST', body: JSON.stringify({ action:'release_gated' }) });
      gatedCounts.set(id, 0);
      toast(`Released ${r.released}${r.skipped ? ` · skipped ${r.skipped}` : ''}`);
      await loadAll();          // a bulk move across the queue: structural, not a delta
    } catch (e) { toast('Release failed: ' + e.message); }
  });
}

function doAction(act, id){
  const item = items.find(i => i.workid === id);
  if (!item) return;
  if (act === 'answerqueue') { answerAndQueue(id); return; }
  // Reading and answering, both modes: the lightbox handles its own body fetch
  // and its own read-only fallback, so it is the same call live or in the demo.
  if (act === 'answerlb') { openAnswerLb(id); return; }
  // Acts on this item's descendants, not on the item — so it works the same
  // whether the item is open or archived (issue 7c).
  if (act === 'gated') { releaseGated(id); return; }
  if (LIVE) {
    // Clone and follow-up stay client-side (they open the prefilled form; the POST
    // happens on save). Everything else is a server action.
    // Both prefill a form from this item's text, which a summary does not
    // carry — free when the row is already open, one small GET otherwise.
    if (act === 'clone' || act === 'followup') {
      ensureBody(id).then(() => openForm(act, items.find(i => i.workid === id) || item));
      return;
    }
    if (act === 'stopitem') {
      confirmStop(item, () => {
        postAction(id, 'stop')
          .then(() => { closeLb(); toast(`Stop requested — the engine is halting ${shortId(item)}`); return loadAll(); })
          .catch(e => toast('Stop failed: ' + e.message));
      });
      return;
    }
    if (act === 'delete') {
      confirmDelete(item, () => {
        // Optimistic: the row goes now and comes back if the server refuses.
        const at = items.indexOf(item);
        items.splice(at, 1);
        openIds.delete(id);
        closeLb(); render();
        postAction(id, 'delete')
          .then(r => toast(r.archived ? 'Archive entry deleted' : 'Deleted'))
          .catch(e => { items.splice(at, 0, item); render(); toast('Delete failed: ' + e.message); });
      });
      return;
    }
    if (act === 'pauseedit') {
      // The form edits a server-shaped record, so this one still reloads: the
      // PATCH that follows must start from what is actually on disk.
      const prior = item.state;
      postAction(id, 'pause')
        .then(() => loadAll())
        // loadAll left a SUMMARY in the array and the form edits text — without
        // this the PATCH would post an empty mainwork over the real request.
        .then(() => ensureBody(id))
        .then(() => {
          const fresh = items.find(i => i.workid === id);
          if (fresh) openForm('edit', fresh, prior);
        })
        .catch(e => toast('Pause failed: ' + e.message));
      return;
    }
    serverAction(id, act);
    return;
  }
  switch (act) {
    case 'stopitem':
      confirmStop(item, () => {
        item.state = 'todo';
        item.lasterror = 'STOPPED by user mid-run — work may be partially completed; git_start_commit is the undo point';
        item.times.start = '';
        closeLb(); render(); toast(`Stopped ${shortId(item)}`);
      });
      return;
    case 'queue':
      if (item.state === 'scheduled') {
        // mock of the engine's clone-and-queue semantics
        const c = JSON.parse(JSON.stringify(item));
        c.workid = uuid(); c.state = 'queued'; c.source = 'scheduler';
        c.source_schedule = item.workid; c.sched = null; c.attempts = 0; c.output = '';
        c.times = { added: nowIso(), start:'', preworkdone:'', mainworkdone:'', postworkdone:'', closed:'' };
        item.sched.last_fired = nowIso();
        items.unshift(c);
        toast(`Run queued (${shortId(c)}) — schedule unchanged`); break;
      }
      item.state = 'queued'; item.lasterror = '';
      toast(`Queued ${shortId(item)}`); break;
    case 'pause':
      item.state = 'paused';
      toast(`Paused ${shortId(item)}`); break;
    case 'schedule':
      item.state = 'scheduled';
      toast(`Schedule resumed for ${shortId(item)}`); break;
    case 'question':
      item.state = 'question';
      if (!item.times.asked) item.times.asked = nowIso();
      toast(`${shortId(item)} → question`); break;
    case 'complete':
      item.state = 'complete'; item.times.closed = nowIso();
      toast(`Marked ${shortId(item)} complete`); break;
    case 'pauseedit': {
      const prior = item.state;
      item.state = 'paused'; render();
      openForm('edit', item, prior);
      toast(`Paused ${shortId(item)} for editing`); return;
    }
    case 'clone':
      openForm('clone', item); return;
    case 'followup':
      openForm('followup', item); return;
    case 'delete':
      confirmDelete(item, () => {
        const archived = isClosed(item);
        items = items.filter(i => i.workid !== id);
        openIds.delete(id);
        closeLb(); render(); toast(archived ? 'Archive entry deleted' : 'Deleted');
      });
      return;
  }
  render();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-rowclick]');

  // close any open action menu when clicking elsewhere
  if (!e.target.closest('.actmenu') && !e.target.closest('[data-actions]')) {
    document.querySelectorAll('.actmenu.open').forEach(m => m.classList.remove('open'));
  }
  // Bulk checkbox: record the selection and DON'T toggle the row detail.
  if (e.target.dataset && e.target.dataset.bulksel !== undefined) {
    const id = e.target.dataset.bulksel;
    if (e.target.checked) bulkSel.add(id); else bulkSel.delete(id);
    renderBulkBar();
    return;
  }
  if (!t) return;

  if (t.dataset.bulkact) {
    if (t.dataset.bulkact === 'exit') setBulkMode(false);
    else if (t.dataset.bulkact === 'clear') { bulkSel.clear(); renderBulkBar(); render(); }
    else if (t.dataset.bulkact === 'go') confirmBulkMove();
    return;
  }

  if (t.dataset.filter) {
    const f = t.dataset.filter;
    if (f === 'total') activeFilters.clear();
    else activeFilters.has(f) ? activeFilters.delete(f) : activeFilters.add(f);
    render(); return;
  }
  if (t.dataset.actions) {
    const menu = document.querySelector(`[data-menu="${t.dataset.actions}"]`);
    const was = menu.classList.contains('open');
    document.querySelectorAll('.actmenu.open').forEach(m => m.classList.remove('open'));
    if (!was) menu.classList.add('open');
    return;
  }
  if (t.dataset.act) { doAction(t.dataset.act, t.dataset.id); return; }
  if (t.dataset.lb) {
    const item = items.find(i => i.workid === t.dataset.id);
    ({tests:lbTests, times:lbTimes, context:lbContext, logs:lbLogs})[t.dataset.lb](item);
    return;
  }
  if (t.dataset.toggle && draft) {
    const list = draft.data[t.dataset.toggle];
    const name = t.dataset.name;
    const i = list.indexOf(name);
    i >= 0 ? list.splice(i,1) : list.push(name);
    t.classList.toggle('on', i < 0);
    return;
  }
  if (t.hasAttribute('data-lbclose') || t.id === 'lbClose') { draft = null; closeLb(); return; }
  if (t.id === 'collapseAll') { openIds.clear(); render(); return; }
  if (t.id === 'loadOlder') { loadArchivePage(); return; }
  if (t.id === 'newItem') { openForm('create', null); return; }
  if (t.id === 'engineChip' || t.closest('#engineChip')) {
    if (LIVE) {
      const action = engineRunning ? 'pause' : 'resume';
      api('/api/engine', { method: 'POST', body: JSON.stringify({ action }) })
        .then(() => { toast(action === 'pause' ? 'Engine draining: finishing in-flight work' : 'Engine resumed'); refreshEngine(); })
        .catch(e => toast('Engine: ' + e.message));
      return;
    }
    engineRunning = !engineRunning;
    const chip = $('engineChip');
    chip.dataset.engine = engineRunning ? 'running' : 'paused';
    $('engineState').textContent = engineRunning ? 'Running' : 'Paused';
    toast(engineRunning ? 'Engine resumed (stop.signal cleared)' : 'Engine pausing (drain): finishing in-flight work');
    return;
  }

  const rowId = t.dataset.rowclick;
  if (rowId && !e.target.closest('.actwrap')) {
    // Opening is also the retry: a body fetch that failed is not attempted again
    // on every repaint (that would hammer a down API), so closing and re-opening
    // the row is the gesture that asks once more. render() → syncBodies() does
    // the fetch; nothing here needs to know whether one is needed.
    if (openIds.has(rowId)) openIds.delete(rowId);
    else { bodyError.delete(rowId); openIds.add(rowId); }
    render(); return;
  }
});

/* Fake 14-day history — in the wired version this is GET /api/history?days=14,
   computed server-side from workitems_closed.jsonl. */
const HIST = {
  comp: [18,22,25,19,28,31,24,27,33,29,35,38,32,41],
  fail: [ 2, 1, 0, 3, 1, 2, 1, 0, 2, 1, 1, 3, 0, 1],
  byAgent: [['code',86],['testwriter',52],['test',49],['plan',18],['refactor',12],['ingest',7]],
};
function histLabels(){
  const out = [];
  for (let i = HIST.comp.length - 1; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    out.push(`${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')}`);
  }
  return out;
}

/* single-series bar panel: thin marks, faint grid, hover tooltip, table view */
function barPanel(title, sub, data, labels, color, height){
  const W = 640, H = height, padL = 30, padB = 18, padT = 8;
  const max = Math.max(...data, 1);
  const step = (W - padL) / data.length;
  const bw = Math.min(step * 0.66, 34);
  const ticks = [0, Math.round(max/2), max];
  const gy = v => padT + (H - padT - padB) * (1 - v / max);
  const grid = ticks.map(v => `<line x1="${padL}" x2="${W}" y1="${gy(v)}" y2="${gy(v)}"/>`).join('');
  const ylab = ticks.map(v => `<text x="${padL-6}" y="${gy(v)+3}" text-anchor="end">${v}</text>`).join('');
  const bars = data.map((v,i) => {
    const x = padL + i*step + (step-bw)/2, y = gy(v);
    return `<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}"
      height="${Math.max(H - padB - y, 1).toFixed(1)}" rx="2" fill="${color}"
      data-tip="${labels[i]}: ${v}"></rect>`;
  }).join('');
  const xlab = labels.map((l,i) => i % 2 ? '' :
    `<text x="${(padL + i*step + step/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${l}</text>`).join('');
  const tableRows = labels.map((l,i) => `<tr><td>${l}</td><td class="mono">${data[i]}</td></tr>`).join('');
  return `<div class="panel"><h3>${title}</h3><div class="sub">${sub}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">
      <g class="chartgrid">${grid}</g><g class="chartaxis">${ylab}${xlab}</g>${bars}
    </svg>
    <details><summary>View as table</summary>
      <table class="t"><thead><tr><th>Day</th><th>Count</th></tr></thead><tbody>${tableRows}</tbody></table>
    </details></div>`;
}

let dashWindow = { days: 14, start: '', end: '' };

function mockHistory(){
  const labels = histLabels();
  return {
    days: HIST.comp.map((c, i) => ({ date: '2026-08-' + labels[i].split('/')[1], complete: c, failed: HIST.fail[i] })),
    by_agent: Object.fromEntries(HIST.byAgent),
    tiles: { spend_today_usd: 12.34, budget_usd_per_day: 50, success_pct: 97, per_hour: 1.4, median_cycle_sec: 1440, running: items.filter(i => i.state === 'in-progress').length, open: items.length, handoff_pct: 38 },
  };
}

function fmtCycle(sec){
  if (!sec) return '–';
  if (sec < 120) return `${sec}<small>s</small>`;
  if (sec < 7200) return `${Math.round(sec/60)}<small>m</small>`;
  return `${(sec/3600).toFixed(1)}<small>h</small>`;
}

async function renderDashboard(){
  let data;
  if (LIVE) {
    try {
      const q = dashWindow.start && dashWindow.end
        ? `start=${dashWindow.start}&end=${dashWindow.end}` : `days=${dashWindow.days}`;
      data = await api('/api/history?' + q);
    } catch (e) {
      $('view-dashboard').innerHTML = `<div class="empty">API error: ${esc(e.message)}</div>`;
      return;
    }
  } else {
    data = mockHistory();
  }
  const comp = data.days.map(d => d.complete);
  const fail = data.days.map(d => d.failed);
  const labels = data.days.map(d => { const p = d.date.split('-'); return `${+p[1]}/${p[2]}`; });
  const t = data.tiles;
  const cAll = comp.reduce((a,b)=>a+b,0), fAll = fail.reduce((a,b)=>a+b,0);
  const windowLabel = `${data.days.length} days`;
  const tiles = [
    [`$${(t.spend_today_usd ?? 0).toFixed(2)}`,
      t.budget_usd_per_day > 0
        ? `Spend today · auto-drains at $${t.budget_usd_per_day.toFixed(0)}`
        : 'Spend today · no budget set (Settings → max_cost_usd_per_day)'],
    [`${t.success_pct}<small>%</small>`, `Success rate · window`],
    [`${t.per_hour < 0.1 && t.per_hour > 0 ? t.per_hour.toFixed(2) : t.per_hour.toFixed(1)}<small>/hr</small>`, 'Completions per hour · window avg'],
    [fmtCycle(t.median_cycle_sec), 'Median cycle time · added → closed'],
    [`${t.running}`, 'Agents running now'],
    [`${t.open}`, 'Open work items'],
    [`${t.handoff_pct}<small>%</small>`, 'Agent-created handoffs · share of closed'],
  ];
  const byAgent = Object.entries(data.by_agent).sort((a,b) => b[1]-a[1]);
  const agentMax = Math.max(1, ...byAgent.map(a => a[1]));
  $('view-dashboard').innerHTML = `
    <div class="projtools" style="margin-bottom:10px">
      <label>Window:
        <select id="dashDays">
          ${[7,14,30].map(d => `<option value="${d}" ${dashWindow.days===d && !dashWindow.start ? 'selected':''}>${d} days</option>`).join('')}
        </select></label>
      <label>or <input type="date" id="dashStart" value="${dashWindow.start}"> – <input type="date" id="dashEnd" value="${dashWindow.end}"></label>
      <button class="btn" id="dashApply">Apply range</button>
    </div>
    <div class="tiles">${tiles.map(([n,l]) => `<div class="tile"><div class="tn">${n}</div><div class="tl2">${l}</div></div>`).join('')}</div>
    <div class="dashsplit">
      <div>
        ${barPanel('Completions per day', `${windowLabel} · ${cAll} closed complete`, comp, labels, 'var(--s-complete-bg)', 170)}
        ${barPanel('Failures per day', `${windowLabel} · ${fAll} closed failed (kept separate from completions — the pair isn't colorblind-safe stacked)`, fail, labels, 'var(--s-failed-bg)', 96)}
      </div>
      <div class="panel"><h3>Completions by agent</h3><div class="sub">${windowLabel}</div>
        ${byAgent.length ? byAgent.map(([name,v]) =>
          `<div class="hbar"><span class="hname">${esc(name)}</span><div class="htrack"><div class="hfill" style="width:${Math.round(100*v/agentMax)}%"></div></div><span class="hval">${v}</span></div>`).join('')
          : '<div class="empty" style="padding:14px 0">no completions in this window</div>'}
      </div>
    </div>`;
  $('dashDays').addEventListener('change', e => { dashWindow = { days: +e.target.value, start: '', end: '' }; renderDashboard(); });
  $('dashApply').addEventListener('click', () => {
    const s = $('dashStart').value, en = $('dashEnd').value;
    if (s && en) { dashWindow = { days: 0, start: s, end: en }; renderDashboard(); }
    else toast('Pick both start and end dates');
  });
}
