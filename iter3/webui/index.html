<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iter</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--line:#2c313a;--text:#d8dce3;--dim:#8b93a1;
--accent:#4da3ff;--ok:#39c47f;--warn:#e0b341;--bad:#e05252;--q:#b878e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;letter-spacing:.06em}
header .who{margin-left:auto;color:var(--dim)}
main{padding:18px;max-width:1100px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 10px}
button{background:var(--accent);color:#08121f;border:0;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
input,select,textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit}
.tile{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;display:flex;gap:10px;align-items:center;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile .id{color:var(--dim);font-family:ui-monospace,monospace;font-size:12px;cursor:copy}
.tile .nm{flex:1}
.state{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;text-transform:uppercase}
.state.queued{background:#28405c;color:#9ec9ff}.state.in-progress{background:#274733;color:#7de0ae}
.state.complete{background:#243328;color:#7fae8c}.state.failed{background:#4b2626;color:#ff9b9b}
.state.question{background:#3c2a4d;color:#dbb3f7}.state.parked,.state.paused{background:#3a3a2c;color:#d9cf8e}
.state.scheduled{background:#2c3a44;color:#9fd3e8}
.indent{margin-left:34px;border-left:2px solid var(--line)}
.row{display:flex;gap:18px;flex-wrap:wrap}
.kv{color:var(--dim);font-size:12px}
.kv b{color:var(--text)}
#login{max-width:340px;margin:12vh auto}
#login input{width:100%;margin-bottom:10px}
.err{color:var(--bad);min-height:20px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;max-width:720px;width:90%}
dialog::backdrop{background:rgba(0,0,0,.55)}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:320px;overflow:auto}
.wfield{margin:10px 0}
.wfield label{display:block;color:var(--dim);margin-bottom:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
</style>
</head>
<body>
<header>
  <h1>ITER</h1>
  <span class="kv" id="backend"></span>
  <span class="who" id="who"></span>
  <button class="ghost" id="logout" style="display:none">logout</button>
</header>
<main>
  <div id="login" class="card">
    <h2>Sign in</h2>
    <input id="li-user" placeholder="user" autocomplete="username">
    <input id="li-pass" placeholder="password" type="password" autocomplete="current-password">
    <div class="err" id="li-err"></div>
    <button id="li-go">Sign in</button>
  </div>

  <div id="app" style="display:none">
    <div class="card" id="servers"><h2>Servers &amp; Engines</h2><div id="engines"></div></div>
    <div class="card">
      <h2>Projects</h2>
      <div class="row" id="projects"></div>
    </div>
    <div class="card">
      <h2>Workitems <span class="kv" id="wi-proj"></span></h2>
      <div class="row" style="margin-bottom:8px">
        <select id="f-state"><option value="">all states</option></select>
        <button class="ghost" id="refresh">refresh</button>
      </div>
      <div id="items"></div>
    </div>
  </div>
</main>
<dialog id="detail"></dialog>
<script>
"use strict";
const $=s=>document.querySelector(s);
let token=null,me=null,project=null,itemsCache=[];
const STATES=["in-progress","queued","question","parked","paused","failed","complete","scheduled"];
STATES.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;$("#f-state").appendChild(o);});

async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{"content-type":"application/json",
    ...(token?{authorization:"Bearer "+token}:{}),...(opts.headers||{})}});
  const body=await r.json().catch(()=>null);
  if(!r.ok)throw Object.assign(new Error((body&&body.error)||r.status),{status:r.status,body});
  return body;
}
function esc(s){const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}

async function boot(){
  try{const h=await fetch("/health").then(r=>r.json());$("#backend").textContent="data: "+h.backend;}catch(e){}
  try{token=localStorage.getItem("iter_token");me=localStorage.getItem("iter_user");}catch(e){}
  if(token){try{await load();return;}catch(e){token=null;}}
  $("#login").style.display="";$("#app").style.display="none";
}
$("#li-go").onclick=async()=>{
  try{
    const r=await api("/auth/login",{method:"POST",body:JSON.stringify({user:$("#li-user").value,password:$("#li-pass").value})});
    token=r.token;me=r.user;
    try{localStorage.setItem("iter_token",token);localStorage.setItem("iter_user",me);}catch(e){}
    await load();
  }catch(e){$("#li-err").textContent="login failed";}
};
$("#logout").onclick=()=>{token=null;try{localStorage.removeItem("iter_token");}catch(e){};location.reload();};
$("#refresh").onclick=()=>project&&loadItems(project);
$("#f-state").onchange=()=>renderItems();

async function load(){
  $("#login").style.display="none";$("#app").style.display="";
  $("#who").textContent=me||"";$("#logout").style.display="";
  const[projects,engines]=await Promise.all([api("/api/projects"),api("/api/engines")]);
  $("#projects").innerHTML=projects.map(p=>
    `<button class="ghost" data-p="${esc(p.name)}">${esc(p.name)} <span class="kv">(${esc(p.state)})</span></button>`).join("")||"<span class='kv'>none yet</span>";
  document.querySelectorAll("#projects button").forEach(b=>b.onclick=()=>loadItems(b.dataset.p));
  const now=Date.now();
  $("#engines").innerHTML=engines.map(e=>{
    const seen=e.last_seen?Date.parse(e.last_seen):0;
    const alive=seen&&(now-seen)<3*(e.ticksec||5)*1000+5000;
    return `<div class="kv"><span class="dot ${alive?"on":"off"}"></span><b>${esc(e.name)}</b>
      ${esc(e.state)} · account: ${esc(e.account||"—")} · host: ${esc(e.host||"?")} ·
      last seen: ${esc(e.last_seen||"never")}${alive?"":" (offline)"}</div>`;
  }).join("")||"<span class='kv'>no engines registered</span>";
  if(projects.length&&!project)loadItems(projects[0].name);
}

async function loadItems(p){
  project=p;$("#wi-proj").textContent="— "+p;
  itemsCache=await api("/api/projects/"+encodeURIComponent(p)+"/workitems");
  renderItems();
}

/* dependency indent: an item nests under its first blocker when visible */
function renderItems(){
  const filter=$("#f-state").value;
  const shown=itemsCache.filter(i=>!filter||i.state===filter);
  const ids=new Set(shown.map(i=>i.id));
  const children={},roots=[];
  shown.forEach(i=>{
    const dep=(i.blockedby||[]).find(d=>ids.has(d));
    if(dep){(children[dep]=children[dep]||[]).push(i);}else roots.push(i);
  });
  const order={"in-progress":0,"question":1,"queued":2,"paused":3,"parked":4,"scheduled":5,"failed":6,"complete":7};
  const rank=i=>[order[i.state]??9,i.priority??5];
  const cmp=(a,b)=>{const[x1,y1]=rank(a),[x2,y2]=rank(b);return x1-x2||y1-y2;};
  roots.sort(cmp);
  const tile=(i,depth)=>`
    <div class="tile ${depth?"indent":""}" data-id="${esc(i.id)}">
      <span class="state ${esc(i.state)}">${esc(i.state)}</span>
      <span class="nm">${esc(i.name)} <span class="kv">P${esc(i.priority)} · ${esc(i.agent)}</span></span>
      <span class="id" title="click to copy">${esc(i.id.slice(0,8))}</span>
    </div>`+((children[i.id]||[]).sort(cmp).map(c=>tile(c,depth+1)).join(""));
  $("#items").innerHTML=roots.map(r=>tile(r,0)).join("")||"<span class='kv'>no workitems</span>";
  document.querySelectorAll("#items .tile").forEach(t=>{
    t.onclick=e=>{
      if(e.target.classList.contains("id")){navigator.clipboard&&navigator.clipboard.writeText(t.dataset.id);e.target.textContent="copied!";
        setTimeout(()=>{e.target.textContent=t.dataset.id.slice(0,8);},900);return;}
      openDetail(t.dataset.id);
    };
  });
}

async function openDetail(id){
  const i=itemsCache.find(x=>x.id===id);if(!i)return;
  const details=await api(`/api/projects/${encodeURIComponent(project)}/workitems/${id}/details`).catch(()=>[]);
  const dlg=$("#detail");
  const blocked=(i.blockedby||[]).map(b=>`<a href="#" data-dep="${esc(b)}">${esc(b.slice(0,8))}</a>`).join(", ")||"—";
  dlg.innerHTML=`
    <div style="padding:16px">
      <h2>${esc(i.name)}</h2>
      <div class="kv">id <b style="font-family:monospace">${esc(i.id)}</b> · v${esc(i.version)} ·
        state <b>${esc(i.state)}</b> · P${esc(i.priority)} · agent <b>${esc(i.agent)}</b> ·
        blocked by: ${blocked}</div>
      <div class="kv">lockdirs: ${esc((i.lockdirs||[]).join(", ")||"—")} · engine: ${esc(i.engine||"—")}
        · attempt ${esc(i.attempt)} ${i.lasterror?" · <span style='color:var(--bad)'>"+esc(i.lasterror.slice(0,200))+"</span>":""}</div>
      <div id="dl"></div>
      <div style="margin-top:12px;text-align:right"><button class="ghost" onclick="this.closest('dialog').close()">close</button></div>
    </div>`;
  const dl=dlg.querySelector("#dl");
  details.forEach(d=>{
    const box=document.createElement("div");
    box.innerHTML=`<h2 style="margin-top:14px">${esc(d.key)} <span class="kv">#${esc(d.order)} (${esc(d.valuetype)})</span></h2>`;
    if(d.valuetype==="json"&&d.value&&Array.isArray(d.value.fields)){box.appendChild(widgetForm(i,d));}
    else{const pre=document.createElement("pre");pre.textContent=typeof d.value==="string"?d.value:JSON.stringify(d.value,null,2);box.appendChild(pre);}
    dl.appendChild(box);
  });
  dlg.querySelectorAll("[data-dep]").forEach(a=>a.onclick=ev=>{ev.preventDefault();dlg.close();openDetail(a.dataset.dep);});
  dlg.showModal();
}

/* dynamic question widget: render typed fields, answers overwrite value in place */
function widgetForm(item,d){
  const w=d.value,form=document.createElement("div");
  form.innerHTML=`<div><b>${esc(w.title)}</b></div><div class="kv">${esc(w.summary||"")}</div>
    ${w.detail?`<details><summary class="kv">more…</summary><div class="kv">${esc(w.detail)}</div></details>`:""}`;
  w.fields.forEach((f,idx)=>{
    const fd=document.createElement("div");fd.className="wfield";
    const lab=`<label>${esc(f.label||f.key)}</label>`;
    if(f.type==="checkbox"){
      fd.innerHTML=lab+f.options.map(o=>`<label style="display:block;color:var(--text)">
        <input type="checkbox" data-f="${idx}" value="${esc(o.value)}"
        ${Array.isArray(f.value)&&f.value.includes(o.value)?"checked":""}> ${esc(o.value)} — <span class="kv">${esc(o.desc||"")}</span></label>`).join("");
    }else if(f.type==="radio"){
      fd.innerHTML=lab+f.options.map(o=>`<label style="display:block;color:var(--text)">
        <input type="radio" name="r${idx}" data-f="${idx}" value="${esc(o.value)}"
        ${f.value===o.value?"checked":""}> ${esc(o.value)} — <span class="kv">${esc(o.desc||"")}</span></label>`).join("");
    }else if(f.type==="combo"){
      fd.innerHTML=lab+`<select data-f="${idx}">`+f.options.map(o=>
        `<option value="${esc(o.value)}" ${f.value===o.value?"selected":""}>${esc(o.value)}</option>`).join("")+`</select>`;
    }else if(f.type==="int"){
      fd.innerHTML=lab+`<input type="number" data-f="${idx}" value="${esc(f.value??"")}">`;
    }else{
      fd.innerHTML=lab+`<textarea data-f="${idx}" rows="2" style="width:100%">${esc(f.value??"")}</textarea>`;
    }
    form.appendChild(fd);
  });
  const btn=document.createElement("button");btn.textContent="Submit answer";
  btn.onclick=async()=>{
    const w2=JSON.parse(JSON.stringify(w));
    w2.fields.forEach((f,idx)=>{
      const els=form.querySelectorAll(`[data-f="${idx}"]`);
      if(f.type==="checkbox")f.value=undefined,w2.fields[idx].value=[...els].filter(e=>e.checked).map(e=>e.value);
      else if(f.type==="radio")w2.fields[idx].value=([...els].find(e=>e.checked)||{}).value??null;
      else if(f.type==="int")w2.fields[idx].value=parseInt(els[0].value||"0",10);
      else w2.fields[idx].value=els[0].value;
    });
    try{
      await api(`/api/projects/${encodeURIComponent(project)}/workitems/${item.id}/details/${d.order}`,
        {method:"PUT",body:JSON.stringify({key:d.key,valuetype:"json",value:w2})});
      const fresh=await api(`/api/projects/${encodeURIComponent(project)}/workitems/${item.id}`);
      fresh.state="queued";fresh.needs_approval=false;
      await api(`/api/projects/${encodeURIComponent(project)}/workitems/${item.id}?expect_version=${fresh.version}`,
        {method:"PUT",body:JSON.stringify(fresh)});
      btn.textContent="answered ✓";$("#detail").close();loadItems(project);
    }catch(e){btn.textContent="failed: "+e.message;}
  };
  form.appendChild(btn);
  return form;
}

boot();
setInterval(()=>{if(token&&$("#app").style.display!=="none")load().catch(()=>{});},10000);
</script>
</body>
</html>
