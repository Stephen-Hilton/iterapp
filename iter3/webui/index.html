<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2026">
<title>iter</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--line:#2c313a;--text:#d8dce3;--dim:#8b93a1;
--accent:#4da3ff;--ok:#39c47f;--warn:#e0b341;--bad:#e05252;--q:#b878e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}

/* ---- pinned top: brand row + counts/tools bar ---- */
#top{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line)}
#brandrow{display:flex;align-items:center;gap:16px;padding:8px 18px}
#brandrow h1{font-size:16px;margin:0;letter-spacing:.06em}
#brandrow .who{margin-left:auto;color:var(--dim)}
#counts{display:flex;gap:8px;align-items:center;padding:0 18px 10px;overflow-x:auto}
#counts .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.count{display:flex;align-items:baseline;gap:6px;padding:4px 12px;border:1px solid var(--line);
  border-radius:8px;cursor:pointer;white-space:nowrap;background:var(--bg);user-select:none}
.count b{font-size:16px;font-variant-numeric:tabular-nums}
.count span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.count.zero{opacity:.38}
.count.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.count.total b{color:var(--text)}
.count.c-inprogress b{color:var(--ok)}.count.c-queued b{color:var(--accent)}
.count.c-question b{color:var(--q)}.count.c-failed b{color:var(--bad)}
.count.c-complete b{color:#7fae8c}.count.c-parked b,.count.c-paused b{color:var(--warn)}
.count.c-scheduled b{color:#9fd3e8}

/* ---- layout: left pane + main ---- */
#layout{display:flex;align-items:flex-start;gap:0;min-height:calc(100vh - 90px)}
aside{width:240px;flex:none;border-right:1px solid var(--line);padding:14px;position:sticky;top:90px;
  max-height:calc(100vh - 90px);overflow-y:auto}
main{flex:1;padding:14px 18px;min-width:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 8px}
.side-section{margin-bottom:22px}
.proj{display:block;width:100%;text-align:left;background:transparent;color:var(--text);
  border:1px solid transparent;border-radius:6px;padding:6px 9px;font:inherit;cursor:pointer}
.proj:hover{border-color:var(--line)}
.proj.sel{border-color:var(--accent);color:var(--accent)}
.proj .kv{display:block}
.eng{padding:6px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.eng:first-of-type{border-top:0}
.eng b{color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}

button{background:var(--accent);color:#08121f;border:0;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer;font:inherit;font-weight:600}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button.sm{padding:3px 9px;font-size:12px}
input,select,textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:inherit}
.kv{color:var(--dim);font-size:12px}
.kv b{color:var(--text)}

/* ---- workitem rows ---- */
#toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tile{border:1px solid var(--line);border-radius:6px;padding:7px 12px;margin:5px 0;display:flex;
  gap:10px;align-items:center;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile .left{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.tile .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .right{display:flex;gap:12px;align-items:center;flex:none;color:var(--dim);font-size:12px}
.tile .id{font-family:ui-monospace,monospace;cursor:copy}
.tile .att{color:var(--warn);font-size:12px}
.tags{display:flex;gap:5px;flex:none}
.tag{font-size:11px;padding:1px 8px;border-radius:9px;font-weight:600;white-space:nowrap}
.state{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;text-transform:uppercase;flex:none}
.state.queued{background:#28405c;color:#9ec9ff}.state.in-progress{background:#274733;color:#7de0ae}
.state.complete{background:#243328;color:#7fae8c}.state.failed{background:#4b2626;color:#ff9b9b}
.state.question{background:#3c2a4d;color:#dbb3f7}.state.parked,.state.paused{background:#3a3a2c;color:#d9cf8e}
.state.scheduled{background:#2c3a44;color:#9fd3e8}
.prio{font-weight:700;font-size:12px;color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
.agent{font-size:12px;color:var(--dim);flex:none}
.indent{margin-left:34px;border-left:2px solid var(--line)}
@keyframes flashbg{0%{background:#2b4a72;border-color:var(--accent)}100%{background:transparent;border-color:var(--line)}}
.flash{animation:flashbg 1.8s ease-out}

/* ---- project state control (aspirational; engines follow it) ---- */
.segwrap{margin-left:auto;display:flex;align-items:center;gap:8px}
.segwrap .kv b{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:var(--dim);border:0;border-radius:0;padding:4px 11px;font-size:12px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.Running{background:#274733;color:#7de0ae}
.seg button.on.Draining{background:#4a3f1e;color:#f0c75e}
.seg button.on.Stopped{background:#4b2626;color:#ff9b9b}
.seg button:disabled{cursor:default}
#brandrow .who{margin-left:0}
@media (max-width:760px){
  .segwrap{margin-left:0;width:100%;order:9;justify-content:space-between}
  #brandrow{flex-wrap:wrap;row-gap:6px}
  #brandrow .who{margin-left:auto}
}

/* ---- settings gears + forms ---- */
.gear{background:transparent;color:var(--dim);border:1px solid transparent;border-radius:6px;padding:2px 6px;font-size:14px;line-height:1;cursor:pointer}
.gear:hover{color:var(--accent);border-color:var(--line)}
.projrow{display:flex;align-items:center;gap:4px}
.projrow .proj{flex:1}
.eng .gear{float:right}
.sf .frow textarea{font-family:ui-monospace,monospace;font-size:12px}
.sf .help{color:var(--dim);font-size:11px;margin-top:2px}
.sf .ro{color:var(--dim);padding-top:7px;font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
.sf h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:18px 0 6px;border-top:1px solid var(--line);padding-top:12px}
.sf .list button{margin:2px 4px 2px 0}
.sf .fieldbad{border-color:var(--bad) !important}
@media (max-width:760px){.projrow .gear{padding:4px 8px}}

/* ---- actions menu ---- */
.actmenu[hidden]{display:none}   /* the class's display:flex must not beat [hidden] */
.actmenu{position:fixed;z-index:200;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:6px;min-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:2px}
.actmenu button{background:transparent;color:var(--text);text-align:left;border:0;padding:7px 10px;border-radius:5px;font-weight:500}
.actmenu button:hover{background:var(--bg)}
.actmenu button.danger{color:var(--bad)}
.actmenu .sep{border-top:1px solid var(--line);margin:4px 0}
.actmenu .note{font-size:11px;color:var(--dim);padding:4px 10px;max-width:300px;white-space:normal}

#login{max-width:340px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
#login input{width:100%;margin-bottom:10px}
.err{color:var(--bad);min-height:20px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;max-width:1100px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.55)}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:480px;overflow:auto}
.wfield{margin:10px 0}
.wfield label{display:block;color:var(--dim);margin-bottom:4px}
.frow{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;align-items:start;margin:8px 0}
.frow label{color:var(--dim);padding-top:7px}
.frow input,.frow select,.frow textarea{width:100%}
.dlghead{display:flex;align-items:center;gap:10px}
.dlghead h2{flex:1;font-size:15px;color:var(--text);text-transform:none;letter-spacing:0;margin:0}
details.v2>summary{cursor:pointer;color:var(--dim);font-size:12px;margin-top:14px}
a{color:var(--accent)}

/* ---- phones: stack everything vertically (laptops keep the wide layout) ---- */
@media (max-width: 760px){
  body{font-size:15px}
  #brandrow{padding:8px 12px;gap:10px}
  #brandrow .who{font-size:12px}
  #counts{flex-wrap:wrap;padding:0 12px 6px;overflow:visible;row-gap:6px}
  #chips{flex-wrap:nowrap;gap:6px;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .count{padding:2px 8px;gap:4px;flex:none}
  .count b{font-size:13px}
  .count span{font-size:10px}
  #counts .tools{margin-left:0;width:100%;justify-content:space-between}
  #counts .tools button{padding:5px 10px;font-size:13px}
  #counts .tools select{max-width:140px;padding:4px 6px;font-size:13px}
  #brandrow button{padding:4px 10px;font-size:13px}
  #layout{display:block !important;min-height:0}
  aside{width:auto;position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);
    padding:8px 12px;display:flex;gap:14px;overflow-x:auto}
  .side-section{margin:0;flex:none}
  #projects{display:flex;gap:6px}
  .proj{width:auto;white-space:nowrap;padding:4px 9px}
  .proj .kv{display:inline;margin-left:6px}
  #engines,#agents{display:flex;gap:10px}
  .eng{border-top:0;white-space:nowrap;padding:2px 0}
  .eng br{display:none}
  main{padding:10px 12px}
  #viewnote{display:block;width:100%}
  /* rows: name on top, meta strip below */
  .tile{flex-wrap:wrap;gap:6px 8px;padding:8px 10px;cursor:default}
  .tile .left{flex:1 1 100%;flex-wrap:wrap;gap:6px 8px;align-items:center}
  .tile .nm{white-space:normal;flex:1 1 100%;order:9;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tile .right{flex:1 1 100%;justify-content:flex-start;flex-wrap:wrap;gap:6px 10px}
  .tile .right .actbtn{margin-left:auto}
  .tags{flex-wrap:wrap}
  .indent{margin-left:14px}
  /* dialogs: full screen sheets */
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border:0;border-radius:0;overflow-y:auto}
  dialog>div{padding:12px !important}
  .dlghead{flex-wrap:wrap}
  .dlghead h2{flex:1 1 100%;order:-1}
  .frow{grid-template-columns:1fr;gap:3px 0}
  .frow label{padding-top:0;font-size:12px}
  pre{max-height:none;font-size:13px}
  /* actions menu: bottom sheet */
  .actmenu{left:0 !important;right:0;top:auto !important;bottom:0;width:100vw;min-width:0;border-radius:12px 12px 0 0;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));max-height:70vh;overflow-y:auto}
  .actmenu button{padding:11px 12px;font-size:15px}
  .actmenu .note{max-width:none}
  button{padding:8px 12px}
  #login{margin:8vh 14px}
}
</style>
</head>
<body>
<div id="top" style="display:none">
  <div id="brandrow">
    <h1>ITER</h1>
    <span class="kv" id="backend"></span>
    <span id="projctl" class="segwrap"></span>
    <span class="who" id="who"></span>
    <button class="gear" id="user-gear" title="my settings">⚙</button>
    <button class="ghost" id="logout">logout</button>
  </div>
  <div id="counts">
    <div id="chips" style="display:flex;gap:8px;align-items:center"></div>
    <div class="tools">
      <button id="newitem">+ New workitem</button>
      <label class="kv">sort
        <select id="sort">
          <option value="runorder">run order</option>
          <option value="state">state</option>
          <option value="priority">priority</option>
          <option value="requested">requested ts</option>
          <option value="completed">completed ts</option>
          <option value="agent">agent assigned</option>
          <option value="requestor">requestor</option>
        </select>
      </label>
      <button class="ghost" id="refresh">refresh</button>
    </div>
  </div>
</div>

<div id="login">
  <h2>Sign in</h2>
  <input id="li-user" placeholder="user" autocomplete="username">
  <input id="li-pass" placeholder="password" type="password" autocomplete="current-password">
  <div class="err" id="li-err"></div>
  <button id="li-go">Sign in</button>
</div>

<div id="layout" style="display:none">
  <aside>
    <div class="side-section">
      <h2>Projects</h2>
      <div id="projects"></div>
    </div>
    <div class="side-section">
      <h2>Servers &amp; Engines</h2>
      <div class="eng kv" id="dataserver"></div>
      <div id="engines"></div>
    </div>
    <div class="side-section">
      <h2>Agents</h2>
      <div id="agents"></div>
    </div>
  </aside>
  <main>
    <div id="toolbar">
      <h2 style="margin:0">Workitems <span class="kv" id="wi-proj"></span></h2>
      <span class="kv" id="viewnote"></span>
    </div>
    <div id="items"></div>
  </main>
</div>

<dialog id="detail"></dialog>
<dialog id="form"></dialog>
<dialog id="settings"></dialog>
<div id="actmenu" class="actmenu" hidden></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let token=null,me=null,myRole="",project=null,itemsCache=[],agentsCache=[],dlgDirty=false;
const filters=new Set();   // additive state filters from the pinned counts bar
const STATES=["in-progress","queued","question","parked","paused","failed","complete","scheduled"];
const CLOSED=new Set(["complete","failed"]); // immutable except appended "doc" rows + reopen
const OPEN_TARGETS=["queued","parked","paused","question"];
const TAG_PALETTE=["#4da3ff","#39c47f","#e0b341","#b878e6","#e07a52","#4dd0c4","#e05252","#9fd3e8"];

async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{"content-type":"application/json",
    ...(token?{authorization:"Bearer "+token}:{}),...(opts.headers||{})}});
  const body=await r.json().catch(()=>null);
  if(!r.ok)throw Object.assign(new Error((body&&body.error)||r.status),{status:r.status,body});
  return body;
}
function esc(s){const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
function fmtTs(iso){
  if(!iso)return "";
  const d=new Date(iso);
  if(isNaN(d))return "";
  const p=n=>String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const P=name=>`/api/projects/${encodeURIComponent(project)}/workitems${name?"/"+name:""}`;
function tagColor(t){
  if(t.color&&/^#[0-9a-f]{3,8}$/i.test(t.color))return t.color;
  let h=0;for(const c of (t.text||""))h=(h*31+c.charCodeAt(0))>>>0;
  return TAG_PALETTE[h%TAG_PALETTE.length];
}
function tagFg(hex){
  const h=hex.replace("#","");const n=h.length===3?h.split("").map(c=>c+c).join(""):h.slice(0,6);
  const r=parseInt(n.slice(0,2),16),g=parseInt(n.slice(2,4),16),b=parseInt(n.slice(4,6),16);
  return (r*299+g*587+b*114)/1000>150?"#0b0d11":"#f3f5f8";
}
/* a lockdir at the repo root drains every other agent before this item can start */
function fullTreeLock(i){return (i.lockdirs||[]).some(d=>String(d).replace(/\/+$/,"")==="{topdir}");}
function tagsHtml(i){
  const tags=(i.tags||[]).filter(t=>t&&t.text);
  if(fullTreeLock(i)&&!CLOSED.has(i.state))tags.unshift({text:"full tree lock",color:"#e05252"});
  if(!tags.length)return "";
  return `<span class="tags">${tags.map(t=>{const c=tagColor(t);return `<span class="tag" style="background:${esc(c)};color:${tagFg(c)}">${esc(t.text)}</span>`;}).join("")}</span>`;
}

async function boot(){
  try{const h=await fetch("/health").then(r=>r.json());$("#backend").textContent="data: "+h.backend;}catch(e){}
  try{token=localStorage.getItem("iter_token");me=localStorage.getItem("iter_user");myRole=localStorage.getItem("iter_role")||"";
      const s=localStorage.getItem("iter_sort");if(s)$("#sort").value=s;}catch(e){}
  if(token){try{await load();return;}catch(e){token=null;}}
  $("#login").style.display="";$("#layout").style.display="none";$("#top").style.display="none";
}
$("#li-go").onclick=async()=>{
  try{
    const r=await api("/auth/login",{method:"POST",body:JSON.stringify({user:$("#li-user").value,password:$("#li-pass").value})});
    token=r.token;me=r.user;myRole=r.role||"";
    try{localStorage.setItem("iter_token",token);localStorage.setItem("iter_user",me);localStorage.setItem("iter_role",myRole);}catch(e){}
    await load();
  }catch(e){$("#li-err").textContent="login failed";}
};
$("#li-pass").addEventListener("keydown",e=>{if(e.key==="Enter")$("#li-go").click();});
$("#logout").onclick=()=>{token=null;try{localStorage.removeItem("iter_token");}catch(e){};location.reload();};
$("#refresh").onclick=()=>project&&loadItems(project);
$("#sort").onchange=()=>{try{localStorage.setItem("iter_sort",$("#sort").value);}catch(e){};renderItems();};
$("#newitem").onclick=()=>openForm("create",null);
$("#user-gear").onclick=()=>openSettings("user",me);

async function load(){
  $("#login").style.display="none";$("#layout").style.display="flex";$("#top").style.display="";
  $("#who").textContent=me||"";
  const[projects,engines,agents,meRow]=await Promise.all([api("/api/projects"),api("/api/engines"),api("/api/agents").catch(()=>[]),
    me?api("/api/users/"+encodeURIComponent(me)).catch(()=>null):null]);
  agentsCache=agents;
  if(meRow&&meRow.role){myRole=meRow.role;try{localStorage.setItem("iter_role",myRole);}catch(e){}}
  $("#who").textContent=(me||"")+(myRole?" · "+myRole:"");
  projects.sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:"base"}));
  try{const lp=localStorage.getItem("iter_project");if(lp&&!project&&projects.some(p=>p.name===lp))project=lp;}catch(e){}
  $("#projects").innerHTML=projects.map(p=>
    `<div class="projrow"><button class="proj ${p.name===project?"sel":""}" data-p="${esc(p.name)}">${esc(p.name)}
     <span class="kv">${esc(p.state)}</span></button><button class="gear" data-gear="project" data-name="${esc(p.name)}" title="project settings">⚙</button></div>`).join("")||"<span class='kv'>none yet</span>";
  document.querySelectorAll("#projects .proj").forEach(b=>b.onclick=()=>loadItems(b.dataset.p));
  $("#dataserver").innerHTML=`<span class="dot on"></span><b>iter_data</b> ${esc(location.host)} <button class="gear" data-gear="data" title="iter_data settings">⚙</button>`;
  const now=Date.now();
  $("#engines").innerHTML=engines.map(e=>{
    const seen=e.last_seen?Date.parse(e.last_seen):0;
    const alive=seen&&(now-seen)<3*(e.ticksec||5)*1000+5000;
    return `<div class="eng"><button class="gear" data-gear="engine" data-name="${esc(e.name)}" title="engine settings">⚙</button><span class="dot ${alive?"on":"off"}"></span><b>${esc(e.name)}</b> ${esc(e.state)}${alive?"":" (offline)"}
      <br>acct: ${esc(e.account||"—")} · ${esc(e.host||"?")}
      <br>seen: ${esc(fmtTs(e.last_seen)||"never")}
      <br>serves: ${esc(Object.keys(e.projects||{}).join(", ")||"—")}</div>`;
  }).join("")||"<div class='eng kv'>no engines registered</div>";
  $("#agents").innerHTML=agents.map(a=>`<div class="eng"><button class="gear" data-gear="agent" data-name="${esc(a.name)}" title="${isAdmin()?"edit agent":"view agent (admins edit)"}">${isAdmin()?"⚙":"👁"}</button><b>${esc(a.name)}</b> <span class="kv">${esc(a.model||"—")} · max ${esc(a.max??"—")}</span>
      <br><span class="kv">${esc((a.desc||"").slice(0,70))}</span></div>`).join("")||"<div class='eng kv'>no agents defined</div>";
  document.querySelectorAll("[data-gear]").forEach(g=>g.onclick=ev=>{ev.stopPropagation();openSettings(g.dataset.gear,g.dataset.name);});
  if(projects.length&&!project)project=projects[0].name;
  if(project)await loadItems(project);else renderCounts();
}

async function loadItems(p){
  project=p;$("#wi-proj").textContent="— "+p;
  try{localStorage.setItem("iter_project",p);}catch(e){}
  document.querySelectorAll("#projects .proj").forEach(b=>b.classList.toggle("sel",b.dataset.p===p));
  const [items]=await Promise.all([api(P()),renderProjectCtl().catch(()=>{})]);
  itemsCache=items;
  renderCounts();renderItems();
}

/* Running | Draining | Stopped for the selected project: the COMMANDED state.
   Engines read it every tick and report their own actual state (left pane);
   the status endpoint says whether every engine has honored a drain. */
async function renderProjectCtl(){
  if(!project){$("#projctl").innerHTML="";return;}
  const [proj,status]=await Promise.all([api("/api/projects/"+encodeURIComponent(project)),
    api("/api/projects/"+encodeURIComponent(project)+"/status").catch(()=>null)]);
  const live=status?status.engines.filter(e=>!e.stale).length:0;
  const total=status?status.engines.length:0;
  const running=status?(status.inprogress||0):0;
  let note=`${live}/${total} engines online`;
  if(proj.state==="Draining")note+=status&&status.all_drained?" · drained":` · ${running} still running`;
  else if(proj.state==="Running")note+=` · ${running} running`;
  if(status&&status.not_honoring&&status.not_honoring.length)note+=` · <span style="color:var(--bad)">not honoring: ${esc(status.not_honoring.join(", "))}</span>`;
  $("#projctl").innerHTML=`<span class="kv"><b>${esc(project)}</b> ${note}</span>
    <span class="seg">${["Running","Draining","Stopped"].map(st=>`<button class="${st} ${proj.state===st?"on":""}" data-st="${st}" ${proj.state===st?"disabled":""}>${st}</button>`).join("")}</span>`;
  $("#projctl").querySelectorAll("button[data-st]").forEach(b=>b.onclick=async()=>{
    const st=b.dataset.st;
    const warn={Running:"Engines will start picking queued work for this project.",
      Draining:"Engines finish what is running and start nothing new.",
      Stopped:"Engines stop picking work; anything mid-run finishes its turn."}[st];
    if(!confirm(`Set ${project} to ${st}?\n${warn}`))return;
    try{
      const fresh=await api("/api/projects/"+encodeURIComponent(project));
      fresh.state=st;
      await api("/api/projects/"+encodeURIComponent(project),{method:"PUT",body:JSON.stringify(fresh)});
      await load();
    }catch(e){alert("could not change state: "+e.message);}
  });
}

/* ---- pinned counts bar: total + per-state; clicks are ADDITIVE (V2 behaviour) ---- */
function renderCounts(){
  const by={};itemsCache.forEach(i=>{by[i.state]=(by[i.state]||0)+1;});
  const chip=(label,n,key,cls,active)=>`
    <div class="count ${cls} ${n===0?"zero":""} ${active?"active":""}" data-k="${key}">
      <b>${n}</b><span>${label}</span></div>`;
  let html=chip("total",itemsCache.length,"","total",filters.size===0);
  for(const s of STATES)html+=chip(s,by[s]||0,s,"c-"+s,filters.has(s));
  $("#chips").innerHTML=html;
  document.querySelectorAll("#chips .count").forEach(c=>c.onclick=()=>{
    const k=c.dataset.k;
    if(!k)filters.clear();else if(filters.has(k))filters.delete(k);else filters.add(k);
    renderCounts();renderItems();
  });
}

/* ---- run order: only what can run, plus whatever a runnable item is stuck behind ---- */
function depsSatisfied(i,byId){
  return (i.blockedby||[]).every(d=>{const dep=byId[d];return !dep||dep.state==="complete";});
}
function runnable(i){return i.state==="in-progress"||(i.state==="queued"&&!i.needs_approval);}
function runGroup(i,byId){
  if(i.state==="in-progress")return 0;                       // running now
  if(i.state==="queued"&&!i.needs_approval&&depsSatisfied(i,byId))return 1; // next up
  if(i.state==="question")return 2;
  if(i.state==="queued")return 3;                            // blocked / needs approval
  if(i.state==="paused")return 4;
  if(i.state==="parked")return 5;
  if(i.state==="scheduled")return 6;
  if(i.state==="failed")return 7;
  return 8;                                                  // complete
}
/* items that are runnable, or have a runnable descendant (via blockedby edges) */
function runView(items){
  const byId={},kids={};
  items.forEach(i=>{byId[i.id]=i;});
  items.forEach(i=>(i.blockedby||[]).forEach(d=>{if(byId[d])(kids[d]=kids[d]||[]).push(i.id);}));
  const memo={};
  const has=(id,seen=new Set())=>{
    if(memo[id]!==undefined)return memo[id];
    if(seen.has(id))return false;seen.add(id);
    const r=(kids[id]||[]).some(c=>runnable(byId[c])||has(c,seen));
    memo[id]=r;return r;
  };
  return items.filter(i=>runnable(i)||(!CLOSED.has(i.state)&&has(i.id)));
}
const stateOrder={"in-progress":0,"queued":1,"question":2,"paused":3,"parked":4,"scheduled":5,"failed":6,"complete":7};
function comparator(mode,byId){
  const prio=(a,b)=>(a.priority??5)-(b.priority??5)||(a.ts?.receive||"").localeCompare(b.ts?.receive||"");
  switch(mode){
    case "state":     return (a,b)=>(stateOrder[a.state]??9)-(stateOrder[b.state]??9)||prio(a,b);
    case "priority":  return prio;
    case "requested": return (a,b)=>(b.ts?.receive||"").localeCompare(a.ts?.receive||"");
    case "completed": return (a,b)=>(b.ts?.complete||"").localeCompare(a.ts?.complete||"");
    case "agent":     return (a,b)=>(a.agent||"").localeCompare(b.agent||"")||prio(a,b);
    case "requestor": return (a,b)=>(a.requestedby||"").localeCompare(b.requestedby||"")||prio(a,b);
    default:          return (a,b)=>runGroup(a,byId)-runGroup(b,byId)||prio(a,b); // runorder
  }
}

function tileHtml(i,depth){
  const att=(i.attempt>0?` <span class="att">(A${esc(i.attempt)})</span>`:"")+(i.run_now&&i.state==="queued"?` <span class="att" title="run-now override requested">▶ run now</span>`:"");
  return `
  <div class="tile ${depth?"indent":""}" data-id="${esc(i.id)}">
    <div class="left">
      <span class="state ${esc(i.state)}">${esc(i.state)}</span>
      <span class="prio">P${esc(i.priority??5)}</span>
      <span class="nm">${esc(i.name)}</span>
      <span class="agent">${esc(i.agent||"")}</span>${att}
    </div>
    <div class="right">
      ${tagsHtml(i)}
      <span>${esc(fmtTs(i.ts&&i.ts.receive))}</span>
      <span class="id" title="click to copy full id">${esc(i.id.slice(-8))}</span>
      <button class="ghost sm actbtn" data-act-for="${esc(i.id)}">Actions ▾</button>
    </div>
  </div>`;
}

function renderItems(){
  const mode=$("#sort").value;
  const byId={};itemsCache.forEach(i=>{byId[i.id]=i;});
  const cmp=comparator(mode,byId);
  let shown,html="";
  if(mode==="runorder"&&filters.size===0){
    /* runnable-only view, nested under the first blocker that is itself shown */
    shown=runView(itemsCache);
    const ids=new Set(shown.map(i=>i.id));
    const children={},roots=[];
    shown.forEach(i=>{
      const dep=(i.blockedby||[]).find(d=>ids.has(d));
      if(dep){(children[dep]=children[dep]||[]).push(i);}else roots.push(i);
    });
    roots.sort(cmp);
    const emit=(i,depth)=>tileHtml(i,depth)+((children[i.id]||[]).sort(cmp).map(c=>emit(c,depth+1)).join(""));
    html=roots.map(r=>emit(r,0)).join("");
    $("#viewnote").textContent=`run order: ${shown.length} of ${itemsCache.length} — runnable items and what they are stuck behind`;
  }else{
    shown=itemsCache.filter(i=>filters.size===0||filters.has(i.state));
    html=[...shown].sort(cmp).map(i=>tileHtml(i,0)).join("");
    $("#viewnote").textContent=filters.size?`${shown.length} shown (${[...filters].join(" + ")})`:"";
  }
  $("#items").innerHTML=html||"<span class='kv'>no workitems</span>";
  document.querySelectorAll("#items .tile").forEach(t=>{
    t.onclick=e=>{
      if(e.target.classList.contains("actbtn")){e.stopPropagation();openMenu(t.dataset.id,e.target);return;}
      if(e.target.classList.contains("id")){
        navigator.clipboard&&navigator.clipboard.writeText(t.dataset.id);
        e.target.textContent="copied!";
        setTimeout(()=>{e.target.textContent=t.dataset.id.slice(-8);},900);
        return;
      }
      openDetail(t.dataset.id);
    };
  });
}

/* jump to a workitem line in the queue and flash it */
function jumpToItem(id){
  const t=document.querySelector(`#items .tile[data-id="${CSS.escape(id)}"]`);
  if(!t){ // not in the current view: show everything by state and retry once
    if(filters.size||$("#sort").value==="runorder"){filters.clear();$("#sort").value="state";renderCounts();renderItems();return jumpToItem(id);}
    return;
  }
  t.scrollIntoView({block:"center",behavior:"smooth"});
  t.classList.remove("flash");void t.offsetWidth; // restart animation
  t.classList.add("flash");
  setTimeout(()=>t.classList.remove("flash"),2000);
}

const menu=$("#actmenu");
function closeMenu(){menu.hidden=true;menu.innerHTML="";}
document.addEventListener("click",e=>{if(!menu.hidden&&!e.target.closest("#actmenu")&&!e.target.classList.contains("actbtn"))closeMenu();});

function menuItems(i){
  const b=(act,label,cls="")=>`<button data-act="${act}" class="${cls}">${label}</button>`;
  const note=t=>`<span class="note">${t}</span>`;
  const s=i.state;
  if(CLOSED.has(s)){
    const att=i.attempt?` after ${i.attempt} attempt${i.attempt===1?"":"s"}`:"";
    return b("clone","Clone (run it again)")+(s==="complete"?b("followup","Create follow-up request"):"")+
      b("reopen","Reopen (back to queued)…")+b("doc","Append doc…")+`<div class="sep"></div>`+
      note(`Closed ${esc(s)}${esc(att)} — a closed item is immutable; docs can be appended, or reopen it.`)+
      b("delete","Delete from archive…","danger");
  }
  if(s==="in-progress"){
    return b("clone","Clone")+`<div class="sep"></div>`+note("Agent is running. V3 has no mid-run stop yet; the engine will close it when the turn ends.");
  }
  if(s==="scheduled"){
    return b("runnow","Run now")+b("pause","Pause schedule")+b("pauseedit","Pause &amp; edit")+
      b("complete","Complete (retire schedule)")+b("clone","Clone")+`<div class="sep"></div>`+
      note("Run now clones this schedule into a queued run.")+b("delete","Delete","danger");
  }
  if(s==="question"){
    return b("answer","Answer…")+b("queue","Queue without answering")+b("park","Park")+b("pauseedit","Pause &amp; edit")+
      b("complete","Complete (no work needed)")+b("clone","Clone")+`<div class="sep"></div>`+
      note("An agent is waiting on this decision — open the item and answer there.")+b("delete","Delete","danger");
  }
  let rows=[];
  if(s==="queued")rows.push(b("runnow_item",i.run_now?"Run now (already requested)":"Run now (override agent cap)"));
  if(s==="parked"||s==="paused")rows.push(b("queue","Queue"));
  if(s==="parked"||s==="paused")rows.push(b("runnow_item","Queue &amp; run now"));
  if((s==="parked"||s==="paused")&&i.sched&&i.sched.kind)rows.push(b("schedule","Resume schedule"));
  if(s==="parked"||s==="paused")rows.push(b("question","Move to question"));
  if(s==="paused"||s==="queued")rows.push(b("park","Park"));
  rows.push(b("complete","Complete"));rows.push(b("pauseedit","Pause &amp; edit"));rows.push(b("clone","Clone"));
  rows.push(`<div class="sep"></div>`);rows.push(b("delete","Delete","danger"));
  return rows.join("");
}
function openMenu(id,anchor){
  const i=itemsCache.find(x=>x.id===id);if(!i)return;
  menu.innerHTML=`<span class="note"><b>${esc(i.name.slice(0,60))}</b> · ${esc(i.state)}</span>`+menuItems(i);
  menu.hidden=false;menuOpenedAt=Date.now();
  const r=anchor.getBoundingClientRect();
  menu.style.top=Math.min(r.bottom+4,window.innerHeight-menu.offsetHeight-8)+"px";
  menu.style.left=Math.max(8,Math.min(r.right-menu.offsetWidth,window.innerWidth-menu.offsetWidth-8))+"px";
  menu.querySelectorAll("button[data-act]").forEach(btn=>btn.onclick=async e=>{
    e.stopPropagation();closeMenu();
    try{await doAction(btn.dataset.act,i);}catch(err){alert("action failed: "+err.message);}
  });
}
async function fresh(id){return api(P(id));}
async function setState(i,state,mutate){
  const f=await fresh(i.id);
  f.state=state;if(mutate)mutate(f);
  await api(P(i.id)+"?expect_version="+f.version,{method:"PUT",body:JSON.stringify(f)});
  return f;
}
async function requestText(id){
  const d=await api(P(id)+"/details").catch(()=>[]);
  const r=d.find(x=>x.key==="request");
  return r?(typeof r.value==="string"?r.value:JSON.stringify(r.value,null,2)):"";
}
async function createItem(body,request){
  const created=await api(P(),{method:"POST",body:JSON.stringify(body)});
  await api(P(created.id)+"/details/0",{method:"PUT",body:JSON.stringify({key:"request",valuetype:"text",value:request||""})});
  return created;
}
function cloneBody(i,over={}){
  return {name:i.name,agent:i.agent,exec_shell:i.exec_shell||"",priority:i.priority??5,lockdirs:i.lockdirs||[],
    blockedby:i.blockedby||[],tags:i.tags||[],prework:i.prework||[],postwork:i.postwork||[],
    requestedby:me||"",createdby:me||"",state:"queued",...over};
}
async function doAction(act,i){
  switch(act){
    case "answer": return openDetail(i.id);
    case "doc": return openDetail(i.id);
    case "queue": await setState(i,"queued",f=>{f.needs_approval=false;});break;
    case "runnow_item":{
      const byId={};itemsCache.forEach(x=>{byId[x.id]=x;});
      const open=(i.blockedby||[]).filter(d=>byId[d]&&byId[d].state!=="complete");
      if(open.length){alert(`Cannot run now: still blocked by ${open.map(d=>d.slice(-8)).join(", ")}`);return;}
      if(i.needs_approval){alert("Cannot run now: this item still needs a signed approval.");return;}
      if(!confirm(`Run "${i.name.slice(0,60)}" now?\nThe engine starts it on its next tick even if the agent cap is full (no other work starts until the count drops back under the cap). It still waits for any overlapping lock to clear.`))return;
      await setState(i,"queued",f=>{f.needs_approval=false;f.run_now=true;});break;}
    case "park": await setState(i,"parked");break;
    case "pause": await setState(i,"paused");break;
    case "question": await setState(i,"question");break;
    case "schedule": await setState(i,"scheduled");break;
    case "complete":
      if(!confirm(`Mark "${i.name.slice(0,60)}" complete without running it?`))return;
      await setState(i,"complete",f=>{f.ts=f.ts||{};f.ts.complete=new Date().toISOString().replace(/\.\d+Z$/,"Z");});break;
    case "reopen":{
      const reason=prompt("Reopen this item (back to queued; downstream items become blocked again). Reason?");
      if(reason===null)return;
      await api(P(i.id)+"/reopen",{method:"POST",body:JSON.stringify({reason})});break;}
    case "pauseedit":{
      const f=(i.state==="paused")?await fresh(i.id):await setState(i,"paused");
      await loadItems(project);
      return openForm("edit",f);}
    case "clone":{
      const req=await requestText(i.id);
      const c=await createItem(cloneBody(i,{name:i.name}),req);
      await loadItems(project);
      jumpToItem(c.id);return;}
    case "runnow":{
      const req=await requestText(i.id);
      const c=await createItem(cloneBody(i,{source_schedule:i.id,sched:undefined}),req);
      await loadItems(project);
      jumpToItem(c.id);return;}
    case "followup":{
      const req=await requestText(i.id);
      return openForm("followup",{...cloneBody(i,{name:"Follow-up: "+i.name,blockedby:[i.id],tags:[]}),
        _request:`Follow-up to workitem ${i.id} ("${i.name}").\n\nOriginal request:\n${req}\n\n---\nWhat to do now:\n`});}
    case "delete":
      if(!confirm(`Delete "${i.name.slice(0,60)}" (${i.id.slice(-8)})? This cannot be undone.`))return;
      await api(P(i.id),{method:"DELETE"});break;
  }
  await loadItems(project);
}

const sdlg=$("#settings");
sdlg.addEventListener("click",e=>{if(e.target===sdlg)sdlg.close();});

/* field spec -> row html; values come from the record, JSON fields are pretty-printed */
function fieldRow(f,rec){
  const v=rec?rec[f.key]:undefined;
  const id=`sf-${f.key}`;
  let ctl="";
  if(f.type==="readonly")ctl=`<div class="ro">${esc(v==null||v===""?"—":(typeof v==="object"?JSON.stringify(v):v))}</div>`;
  else if(f.type==="textarea")ctl=`<textarea id="${id}" rows="${f.rows||4}" style="font-family:inherit">${esc(v??"")}</textarea>`;
  else if(f.type==="json")ctl=`<textarea id="${id}" rows="${f.rows||4}">${esc(v==null?(f.empty??""):JSON.stringify(v,null,2))}</textarea>`;
  else if(f.type==="select")ctl=`<select id="${id}">${f.options.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(f.type==="number")ctl=`<input id="${id}" type="number" step="any" value="${esc(v??"")}" style="width:160px">`;
  else if(f.type==="password")ctl=`<input id="${id}" type="password" autocomplete="new-password" placeholder="leave blank to keep">`;
  else ctl=`<input id="${id}" value="${esc(v??"")}">`;
  return `<div class="frow"><label>${esc(f.label||f.key)}</label><div>${ctl}${f.help?`<div class="help">${f.help}</div>`:""}</div></div>`;
}
/* read every editable field back into `out`; throws with the field name on bad JSON/number */
function readFields(fields,out){
  for(const f of fields){
    if(f.type==="readonly")continue;
    const el=sdlg.querySelector(`#sf-${f.key}`);if(!el)continue;
    el.classList.remove("fieldbad");
    const raw=el.value;
    try{
      if(f.type==="json"){ if(raw.trim()==="")out[f.key]=(f.emptyValue!==undefined?f.emptyValue:null); else out[f.key]=JSON.parse(raw); }
      else if(f.type==="number"){ if(raw.trim()==="")out[f.key]=(f.nullable?null:0); else{const n=Number(raw);if(Number.isNaN(n))throw new Error("not a number");out[f.key]=n;} }
      else if(f.type==="password"){ if(raw)out[f.key]=raw; }
      else out[f.key]=raw;
    }catch(e){el.classList.add("fieldbad");throw new Error(`${f.label||f.key}: ${e.message}`);}
  }
  return out;
}
/* one lightbox shape for every settings record */
function settingsBox(title,fields,rec,onSave,{extra="",canSave=true,note=""}={}){
  sdlg.innerHTML=`<div class="sf" style="padding:16px">
    <div class="dlghead"><h2>${esc(title)}</h2><button class="ghost sm" id="sf-close">close</button></div>
    ${note?`<div class="kv" style="margin:6px 0 10px">${note}</div>`:""}
    ${fields.map(f=>fieldRow(f,rec)).join("")}
    <div style="text-align:right;margin-top:10px"><span class="err" id="sf-err" style="margin-right:12px"></span>
      ${canSave?`<button id="sf-save">Save</button>`:`<span class="kv">read only (admin can edit)</span>`}</div>
    ${extra}
  </div>`;
  sdlg.querySelector("#sf-close").onclick=()=>sdlg.close();
  const save=sdlg.querySelector("#sf-save");
  if(save)save.onclick=async()=>{
    const err=sdlg.querySelector("#sf-err");err.textContent="";
    try{await onSave(readFields(fields,{}));}catch(e){err.textContent=e.message;}
  };
  sdlg.showModal();
}

const PROJECT_FIELDS=[
  {key:"name",type:"readonly"},
  {key:"desc",label:"description",type:"textarea",rows:5,help:"sent to every agent as project context, on every run"},
  {key:"state",type:"select",options:["Running","Draining","Stopped"],help:"the COMMANDED state; every engine serving this project follows it"},
  {key:"gitrepo",label:"git repo",type:"text"},
  {key:"maxagents",label:"max agents",type:"json",rows:4,help:'usage%-gated cap, evaluated against the higher of 5h/7d usage: {"&gt;95%":0,"&gt;90%":1,"else":4}'},
  {key:"maxdailycost",label:"max daily cost ($)",type:"number",nullable:true,help:"blank = unlimited · 0 = spend nothing (kill switch)"},
  {key:"agents",label:"agent overrides",type:"json",rows:6,help:'per-agent overrides keyed by agent name: {"code":{"max":2,"model":"opus","timeoutsec":3600,"closegate":{"verify":"haiku","requires_commit":true}}}'},
  {key:"failure",label:"failure policy",type:"json",rows:4,help:"maxattempts · first_retry_second · retry_backoff_exponent"},
  {key:"engines",type:"json",rows:2,help:'engine names serving this project, e.g. ["Engine01"]'},
  {key:"accounts",type:"json",rows:5,help:'Claude accounts by env-var NAME (never the token): [{"name":"Dev1","token_envar":"DEV1_TOKEN","order":1,"switch":80,"stop":99}]'},
];
const ENGINE_FIELDS=[
  {key:"name",type:"readonly"},{key:"state",type:"readonly",help:"engine-reported (actual)"},{key:"last_seen",type:"readonly"},{key:"account",type:"readonly"},
  {key:"host",type:"text"},{key:"ticksec",label:"tick (sec)",type:"number"},{key:"full_refresh_minutes",label:"full refresh (min)",type:"number",help:"unconditional reload cadence — the seq fallback"},
  {key:"queuelock",type:"json",rows:3},
  {key:"projects",label:"projects served",type:"json",rows:6,help:'machine-specific dirs per project: {"pdy-dev":{"dirs":{"topdir":"~/dev/pdy-dev/"}}} — remove a project here to stop this engine serving it'},
];
const AGENT_FIELDS=[
  {key:"name",type:"readonly"},{key:"desc",label:"description",type:"text"},
  {key:"max",type:"number",help:"default concurrent cap (project override wins)"},{key:"timeoutsec",label:"timeout (sec)",type:"number"},
  {key:"model",type:"text",help:"claude model alias: opus · sonnet · haiku · fable"},{key:"flags",type:"text",help:"extra claude CLI flags"},
  {key:"childstate",label:"child state",type:"text",help:"state for workitems this agent creates (default queued)"},
  {key:"closegate",label:"close gate",type:"json",rows:5,help:'{"verify":"haiku","requires_children":false,"requires_commit":false,"max_bounces":1,"verify_max_turns":8} — verify "" disables the verifier'},
  {key:"promptbody",label:"prompt body",type:"textarea",rows:18,help:"the agent's full role prompt; project description + workitem request are appended at run time"},
];
const userFields=(self)=>[
  {key:"user",type:"readonly"},
  self?{key:"role",type:"readonly"}:{key:"role",type:"select",options:["user","engine","admin"]},
  {key:"email",type:"text"},
  {key:"password",type:"password",help:"set a new password; blank keeps the current one"},
  {key:"css",label:"custom css url",type:"text"},
  {key:"settings",type:"json",rows:3,emptyValue:{}},
  self?{key:"authz",type:"readonly",help:"per-project access (admin sets this)"}:{key:"authz",type:"json",rows:3,emptyValue:{},help:'{"pdy-dev":"admin","other":"readonly"}'},
  ...(self?[]:[{key:"tokenver",label:"token version",type:"number",help:"bump to revoke every outstanding token for this user"},{key:"pubkey",label:"approval pubkey",type:"text"}]),
];

async function openSettings(kind,name){
  try{
    if(kind==="project")return await projectSettings(name);
    if(kind==="engine")return await engineSettings(name);
    if(kind==="agent")return await agentSettings(name);
    if(kind==="user")return await userSettings(name);
    if(kind==="data")return dataSettings();
  }catch(e){alert("could not open settings: "+e.message);}
}
async function projectSettings(name){
  const [rec,agents]=await Promise.all([api("/api/projects/"+encodeURIComponent(name)),api("/api/agents").catch(()=>[])]);
  const extra=`<h3>Agents (global definitions; override per project above)</h3>
    <div class="list">${agents.map(a=>`<button class="ghost sm" data-agent="${esc(a.name)}">⚙ ${esc(a.name)}</button>`).join("")||"<span class='kv'>none</span>"}</div>
    <div class="kv" style="margin-top:6px">promptbody, model, caps and the close gate live on the agent; the project's "agent overrides" field wins where set.</div>`;
  settingsBox(`Project settings — ${name}`,PROJECT_FIELDS,rec,async(vals)=>{
    const fresh=await api("/api/projects/"+encodeURIComponent(name));
    Object.assign(fresh,vals);
    await api("/api/projects/"+encodeURIComponent(name),{method:"PUT",body:JSON.stringify(fresh)});
    sdlg.close();await load();
  },{extra,canSave:isAdmin()});
  sdlg.querySelectorAll("[data-agent]").forEach(b=>b.onclick=()=>openSettings("agent",b.dataset.agent));
}
async function agentSettings(name){
  const rec=await api("/api/agents/"+encodeURIComponent(name));
  settingsBox(`Agent — ${name}`,AGENT_FIELDS,rec,async(vals)=>{
    const fresh=await api("/api/agents/"+encodeURIComponent(name));
    Object.assign(fresh,vals);
    await api("/api/agents/"+encodeURIComponent(name),{method:"PUT",body:JSON.stringify(fresh)});
    sdlg.close();agentsCache=await api("/api/agents").catch(()=>agentsCache);
  },{canSave:isAdmin()});
}
async function engineSettings(name){
  const rec=await api("/api/engines/"+encodeURIComponent(name));
  settingsBox(`Engine — ${name}`,ENGINE_FIELDS,rec,async(vals)=>{
    const fresh=await api("/api/engines/"+encodeURIComponent(name));
    Object.assign(fresh,vals);
    await api("/api/engines/"+encodeURIComponent(name),{method:"PUT",body:JSON.stringify(fresh)});
    sdlg.close();await load();
  },{note:"state, last seen and account are written by the engine itself every tick; everything else is yours to set."});
}
async function userSettings(name){
  const self=name===me;
  const rec=await api("/api/users/"+encodeURIComponent(name));
  let extra="";
  if(isAdmin()){
    const users=await api("/api/users").catch(()=>[]);
    extra=`<h3>All users (admin)</h3><div class="list">${users.map(u=>`<button class="ghost sm" data-user="${esc(u.user)}">⚙ ${esc(u.user)} <span class="kv">${esc(u.role)}</span></button>`).join("")}</div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"><input id="nu-name" placeholder="new user name" style="width:150px"><input id="nu-pass" type="password" placeholder="password" style="width:150px">
      <select id="nu-role"><option>user</option><option>engine</option><option>admin</option></select><button class="sm" id="nu-add">add user</button></div>`;
  }
  settingsBox(self?`My settings — ${name}`:`User — ${name}`,userFields(self&&!isAdmin()),rec,async(vals)=>{
    const fresh=await api("/api/users/"+encodeURIComponent(name));
    Object.assign(fresh,vals);
    await api("/api/users/"+encodeURIComponent(name),{method:"PUT",body:JSON.stringify(fresh)});
    sdlg.close();
  },{extra,note:self?"your profile and password; role and project access are set by an admin":""});
  sdlg.querySelectorAll("[data-user]").forEach(b=>b.onclick=()=>openSettings("user",b.dataset.user));
  const add=sdlg.querySelector("#nu-add");
  if(add)add.onclick=async()=>{
    const n=sdlg.querySelector("#nu-name").value.trim(),p=sdlg.querySelector("#nu-pass").value,r=sdlg.querySelector("#nu-role").value;
    if(!n||!p){sdlg.querySelector("#sf-err").textContent="new user needs a name and a password";return;}
    try{await api("/api/users/"+encodeURIComponent(n),{method:"PUT",body:JSON.stringify({role:r,password:p,email:"",settings:{},authz:{}})});openSettings("user",n);}
    catch(e){sdlg.querySelector("#sf-err").textContent="add failed: "+e.message;}
  };
}
async function dataSettings(){
  const h=await fetch("/health").then(r=>r.json()).catch(()=>({}));
  const fields=[
    {key:"host",type:"readonly"},{key:"backend",type:"readonly"},{key:"ts",label:"server time (UTC)",type:"readonly"},
    {key:"env",label:"deploy settings",type:"readonly"},
  ];
  settingsBox("iter_data",fields,{host:location.host,backend:h.backend,ts:h.ts,
    env:"ITER_PREFIX (table prefix) · ITER_JWT_SECRET (shared with local iter_data) · ITER_ADMIN_PASSWORD (first-run admin) — set in the Lambda environment by iter3/deploy_lambda.sh, or in .env for a local server"},
    async()=>{},{canSave:false,note:"iter_data has no runtime-editable settings; the values below come from its environment. Projects, engines, agents and users are the records you edit via their own gears."});
}

/* ================= detail lightbox ================= */
const dlg=$("#detail");
function tryCloseDlg(){
  if(dlgDirty&&!confirm("Discard unsaved edits?"))return false;
  dlgDirty=false;dlg.close();return true;
}
dlg.addEventListener("click",e=>{if(e.target===dlg)tryCloseDlg();});
dlg.addEventListener("cancel",e=>{
  if(!menu.hidden){e.preventDefault();closeMenu();return;}   // Escape closes the menu first
  if(dlgDirty&&!confirm("Discard unsaved edits?"))e.preventDefault();else dlgDirty=false;});
dlg.addEventListener("input",()=>{dlgDirty=true;});
dlg.addEventListener("change",()=>{dlgDirty=true;});

async function openDetail(id){
  const i=itemsCache.find(x=>x.id===id);if(!i)return;
  const details=await api(P(id)+"/details").catch(()=>[]);
  dlgDirty=false;
  const blocked=(i.blockedby||[]).map(b=>`<a href="#" data-dep="${esc(b)}">${esc(b.slice(-8))}</a>`).join(", ")||"—";
  dlg.innerHTML=`
    <div style="padding:16px">
      <div class="dlghead"><span class="state ${esc(i.state)}">${esc(i.state)}</span><h2>${esc(i.name)}</h2>${tagsHtml(i)}
        <button class="ghost sm actbtn" id="dlg-actions">Actions ▾</button><button class="ghost sm" id="dlg-close">close</button></div>
      <div class="kv">id <b style="font-family:monospace">${esc(i.id)}</b> · v${esc(i.version)} ·
        P${esc(i.priority)} · agent <b>${esc(i.agent)}</b> ·
        requested by <b>${esc(i.requestedby||"—")}</b> · created by <b>${esc(i.createdby||"—")}</b> · blocked by: ${blocked}</div>
      <div class="kv">received ${esc(fmtTs(i.ts&&i.ts.receive)||"—")} · started ${esc(fmtTs(i.ts&&i.ts.start)||"—")}
        · completed ${esc(fmtTs(i.ts&&i.ts.complete)||"—")} · attempt ${esc(i.attempt)} · engine ${esc(i.engine||"—")}</div>
      <div class="kv">lockdirs: ${esc((i.lockdirs||[]).join(", ")||"—")}
        ${i.lasterror?" · <span style='color:var(--bad)'>"+esc(i.lasterror.slice(0,200))+"</span>":""}</div>
      <div id="dl"></div>
      <div style="margin-top:14px"><h2>append doc</h2>
        <textarea id="doc-text" rows="3" style="width:100%" placeholder="note, closeout record, decision… (allowed on closed items)"></textarea>
        <div style="text-align:right;margin-top:4px"><button id="doc-add">append doc</button></div></div>
    </div>`;
  dlg.querySelector("#dlg-close").onclick=()=>tryCloseDlg();
  dlg.querySelector("#dlg-actions").onclick=e=>{e.stopPropagation();openMenu(i.id,e.target);};
  const docBtn=dlg.querySelector("#doc-add");
  docBtn.onclick=async()=>{
    const v=dlg.querySelector("#doc-text").value.trim();if(!v)return;
    try{
      await api(P(i.id)+"/details",{method:"POST",body:JSON.stringify({key:"doc",valuetype:"text",value:v})});
      dlgDirty=false;openDetail(i.id);
    }catch(e){docBtn.textContent="failed: "+e.message;}
  };
  const dl=dlg.querySelector("#dl");
  const closedAt=i.ts&&i.ts.complete;
  details.forEach(d=>{
    const box=document.createElement("div");
    const after=d.key==="doc"&&closedAt&&d.ts&&d.ts>closedAt;
    const head=`${esc(d.key)} <span class="kv">#${esc(d.order)} (${esc(d.valuetype)})${d.by?" · "+esc(d.by):""}${d.ts?" · "+esc(fmtTs(d.ts)):""}${after?" · <b style='color:var(--q)'>post-close</b>":""}</span>`;
    if(d.key==="v2"){
      /* migration leftovers: every V2 field V3 has no column for, kept for reference only */
      box.innerHTML=`<details class="v2"><summary>V2 migration leftovers (${esc(Object.keys(d.value||{}).length)} fields, reference only) — #${esc(d.order)}</summary></details>`;
      const pre=document.createElement("pre");pre.textContent=JSON.stringify(d.value,null,2);box.firstElementChild.appendChild(pre);
      dl.appendChild(box);return;
    }
    box.innerHTML=`<h2 style="margin-top:14px">${head}</h2>`;
    if(d.valuetype==="json"&&d.value&&Array.isArray(d.value.fields)){box.appendChild(widgetForm(i,d));}
    else{const pre=document.createElement("pre");pre.textContent=typeof d.value==="string"?d.value:JSON.stringify(d.value,null,2);box.appendChild(pre);}
    dl.appendChild(box);
  });
  /* blocked-by: close the lightbox, jump to that line, flash it */
  dlg.querySelectorAll("[data-dep]").forEach(a=>a.onclick=ev=>{
    ev.preventDefault();
    const dep=a.dataset.dep;
    if(!tryCloseDlg())return;
    jumpToItem(dep);
  });
  dlg.showModal();
}

/* dynamic question widget: answers overwrite value in place */
function widgetForm(item,d){
  const w=d.value,form=document.createElement("div");
  form.innerHTML=`<div><b>${esc(w.title)}</b></div><div class="kv">${esc(w.summary||"")}</div>
    ${w.detail?`<details><summary class="kv">more…</summary><pre>${esc(w.detail)}</pre></details>`:""}`;
  w.fields.forEach((f,idx)=>{
    const fd=document.createElement("div");fd.className="wfield";
    const lab=`<label>${esc(f.label||f.key)}</label>`;
    if(f.type==="checkbox"){
      fd.innerHTML=lab+f.options.map(o=>`<label style="display:block;color:var(--text)">
        <input type="checkbox" data-f="${idx}" value="${esc(o.value)}"
        ${Array.isArray(f.value)&&f.value.includes(o.value)?"checked":""}> ${esc(o.value)} — <span class="kv">${esc(o.desc||"")}</span></label>`).join("");
    }else if(f.type==="radio"){
      fd.innerHTML=lab+f.options.map(o=>`<label style="display:block;color:var(--text)">
        <input type="radio" name="r${idx}" data-f="${idx}" value="${esc(o.value)}"
        ${f.value===o.value?"checked":""}> ${esc(o.value)} — <span class="kv">${esc(o.desc||"")}</span></label>`).join("");
    }else if(f.type==="combo"){
      fd.innerHTML=lab+`<select data-f="${idx}">`+f.options.map(o=>
        `<option value="${esc(o.value)}" ${f.value===o.value?"selected":""}>${esc(o.value)}</option>`).join("")+`</select>`;
    }else if(f.type==="int"){
      fd.innerHTML=lab+`<input type="number" data-f="${idx}" value="${esc(f.value??"")}">`;
    }else{
      fd.innerHTML=lab+`<textarea data-f="${idx}" rows="4" style="width:100%">${esc(f.value??"")}</textarea>`;
    }
    form.appendChild(fd);
  });
  const closed=CLOSED.has(item.state);
  const btn=document.createElement("button");btn.textContent=closed?"answered (closed item)":"Submit answer";
  btn.disabled=closed;
  btn.onclick=async()=>{
    const w2=JSON.parse(JSON.stringify(w));
    w2.fields.forEach((f,idx)=>{
      const els=form.querySelectorAll(`[data-f="${idx}"]`);
      if(f.type==="checkbox")w2.fields[idx].value=[...els].filter(e=>e.checked).map(e=>e.value);
      else if(f.type==="radio")w2.fields[idx].value=([...els].find(e=>e.checked)||{}).value??null;
      else if(f.type==="int")w2.fields[idx].value=parseInt(els[0].value||"0",10);
      else w2.fields[idx].value=els[0].value;
    });
    try{
      await api(P(item.id)+"/details/"+d.order,{method:"PUT",body:JSON.stringify({key:d.key,valuetype:"json",value:w2})});
      const f=await fresh(item.id);
      f.state="queued";f.needs_approval=false;
      await api(P(item.id)+"?expect_version="+f.version,{method:"PUT",body:JSON.stringify(f)});
      dlgDirty=false;btn.textContent="answered ✓";dlg.close();loadItems(project);
    }catch(e){btn.textContent="failed: "+e.message;}
  };
  form.appendChild(btn);
  return form;
}

boot();
setInterval(()=>{
  if(!token||$("#layout").style.display==="none"||sdlg.open)return;
  load().catch(()=>{});
  if(project&&!dlg.open&&!form.open&&!sdlg.open&&menu.hidden)loadItems(project).catch(()=>{});
},10000);
</script>
