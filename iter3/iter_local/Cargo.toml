[package]
name = "iter_local"
version = "0.1.0"
edition = "2024"
description = "The local-file half of iter V3: the structureV2 marker scan, testgroups, the deterministic test runner and validate — no queue, no server, no V2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3.4"
