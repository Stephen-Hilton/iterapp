[workspace]
members = [".", "iter3/iter_core", "iter3/iter_data", "iter3/iter_engine", "iter3/iter_local"]
resolver = "2"

[package]
name = "iterapp"
version = "0.1.0"
edition = "2024"

# One executable, two functions: the iterloop engine and the iterapp webapp.
[[bin]]
name = "iter"
path = "src/main.rs"

[build-dependencies]
chrono = "0.4.45"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10"
clap = { version = "4.6.6", features = ["derive"] }
glob = "0.3.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4"] }
