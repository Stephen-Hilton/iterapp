[package]
name = "iterapp"
version = "0.1.0"
edition = "2024"

# One executable, two functions: the iterloop engine and the iterapp webapp.
[[bin]]
name = "iter"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
glob = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4"] }
